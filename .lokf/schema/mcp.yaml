  McpCompleteRequestParamsContextArguments:
    description: Previously-resolved variables in a URI template or prompt.
    in_subset:
    - completion_complete
    exact_mappings:
    - mcp_schema:CompleteRequestParams/properties/context/properties/arguments
    extra_slots:
      range_expression:
        range: string
  McpCompleteResult:
    description: The result returned by the server for a {@link CompleteRequestcompletion/complete} request.
    is_a: McpResult
    in_subset:
    - completion_complete
    exact_mappings:
    - mcp_schema:CompleteResult
    extra_slots:
      allowed: true
    attributes:
      meta:
        description: Extends {@link MetaObject} with additional result-specific fields. All key naming
          rules from `MetaObject` apply.
        alias: _meta
        range: McpResultMetaObject
      completion:
        description: The completion values and whether more are available.
        range: McpCompleteResultCompletion
        required: true
      result_type:
        description: |-
          Indicates the type of the result, which allows the client to determine
          how to parse the result object.

          Servers implementing this protocol version MUST include this field.
          For backward compatibility, when a client receives a result from a
          server implementing an earlier protocol version (which does not include
          `resultType`), the client MUST treat the absent field as `"complete"`.
        alias: resultType
        required: true
  McpCompleteResultCompletion:
    description: The object MCP's `CompleteResult` holds under `completion`.
    in_subset:
    - completion_complete
    exact_mappings:
