types:
  McpBase64:
    typeof: string
    uri: xsd:base64Binary
    description: Binary data, written as base64 text.
    comments:
    - MCP gives such a string the format byte.
  McpCursor:
    description: An opaque token used to represent a cursor for pagination.
    typeof: string
    exact_mappings:
    - mcp_schema:Cursor
  McpProgressToken:
    description: A progress token, used to associate progress notifications with the original request.
    typeof: string
    union_of:
    - string
    - integer
    comments:
    - linkml 1.12.1's JSON Schema generator reads a type's typeof and not its union_of, so each slot that
      takes this value states the union in its own any_of.
    exact_mappings:
    - mcp_schema:ProgressToken
  McpRequestId:
    description: A uniquely identifying ID for a request in JSON-RPC.
    typeof: string
