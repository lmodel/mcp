        multivalued: true
        range: McpContentBlock
        inlined_as_list: true
        required: true
      is_error:
        description: |-
          Whether the tool use resulted in an error.

          If true, the content typically describes the error that occurred.
          Default: false
        alias: isError
        range: boolean
      structured_content:
        description: |-
          An optional structured result value.

