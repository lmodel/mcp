    - is_a: McpListResourcesRequest
    - is_a: McpListResourceTemplatesRequest
    - is_a: McpReadResourceRequest
    - is_a: McpSubscriptionsListenRequest
    - is_a: McpListPromptsRequest
    - is_a: McpGetPromptRequest
    - is_a: McpListToolsRequest
    - is_a: McpCallToolRequest
    - is_a: McpCompleteRequest
    extra_slots:
      allowed: true
  McpClientResult:
    description: Common result fields.
    is_a: McpEmptyResult
    exact_mappings:
    - mcp_schema:ClientResult
    extra_slots:
      allowed: true
  McpCompleteRequest:
    description: A request from the client to the server, to ask for completion options.
    is_a: McpJSONRPCRequest
    in_subset:
    - completion_complete
    exact_mappings:
    - mcp_schema:CompleteRequest
    extra_slots:
      allowed: true
    attributes:
      identifier:
        description: A uniquely identifying ID for a request in JSON-RPC.
        aliases:
        - id
        any_of:
        - range: string
        - range: integer
        required: true
      jsonrpc:
        description: The JSON-RPC version, always `2.0`.
        equals_string: '2.0'
        required: true
      method:
        description: The method's name, always `completion/complete`.
        equals_string: completion/complete
        required: true
      params:
        description: Parameters for a `completion/complete` request.
        range: McpCompleteRequestParams
        required: true
  McpCompleteRequestParams:
    description: Parameters for a `completion/complete` request.
    is_a: McpRequestParams
    in_subset:
