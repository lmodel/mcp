classes:
  McpAnnotations:
    description: Optional annotations for the client. The client can use annotations to inform how objects
      are used or displayed
    in_subset:
    - common_types
    exact_mappings:
    - mcp_schema:Annotations
    extra_slots:
      allowed: true
    attributes:
      intended_audience:
        description: |-
          Describes who the intended audience of this object or data is.

          It can include multiple entries to indicate content useful for multiple audiences (e.g., `["user", "assistant"]`).
        aliases:
        - audience
        multivalued: true
        range: McpRole
      last_modified:
        description: |-
          The moment the resource was last modified, as an ISO 8601 formatted string.

          Should be an ISO 8601 formatted string (e.g., "2025-01-12T15:00:58Z").

          Examples: last activity timestamp in an open file, timestamp when the resource
          was attached, etc.
        alias: lastModified
      priority:
        description: |-
          Describes how important this data is for operating the server.

          A value of 1 means "most important," and indicates that the data is
          effectively required, while 0 means "least important," and indicates that
          the data is entirely optional.
        range: float
        minimum_value: 0
        maximum_value: 1
  McpAudioContent:
    description: Audio provided to or from an LLM.
    in_subset:
    - content
    exact_mappings:
    - mcp_schema:AudioContent
    extra_slots:
      allowed: true
    attributes:
      meta:
        description: |-
          Represents the contents of a `_meta` field, which clients and servers use to attach additional metadata to their interactions.

          Certain key names are reserved by MCP for protocol-level metadata; implementations MUST NOT make assumptions about values at these keys. Additionally, specific schema definitions may reserve particular names for purpose-specific metadata, as declared in those definitions.

          Valid keys have two segments:

          **Prefix:**
          - Optional — if specified, MUST be a series of _labels_ separated by dots (`.`), followed by a slash (`/`).
          - Labels MUST start with a letter and end with a letter or digit. Interior characters may be letters, digits, or hyphens (`-`).
          - Implementations SHOULD use reverse DNS notation (e.g., `com.example/` rather than `example.com/`).
          - Any prefix where the second label is `modelcontextprotocol` or `mcp` is **reserved** for MCP use. For example: `io.modelcontextprotocol/`, `dev.mcp/`, `org.modelcontextprotocol.api/`, and `com.mcp.tools/` are all reserved. However, `com.example.mcp/` is NOT reserved, as the second label is `example`.

          **Name:**
          - Unless empty, MUST start and end with an alphanumeric character (`[a-z0-9A-Z]`).
          - Interior characters may be alphanumeric, hyphens (`-`), underscores (`_`), or dots (`.`).
        alias: _meta
        range: McpMetaObject
      annotations:
        description: Optional annotations for the client.
        range: McpAnnotations
      data:
        description: The base64-encoded audio data.
        range: McpBase64
        required: true
      mime_type:
        description: The MIME type of the audio. Different providers may support different audio types.
        alias: mimeType
        required: true
      kind:
        description: The kind of object, always `audio`.
        aliases:
        - type
        equals_string: audio
        required: true
  McpBaseMetadata:
    description: Base interface for metadata with name (identifier) and title (display name) properties.
    exact_mappings:
    - mcp_schema:BaseMetadata
    extra_slots:
      allowed: true
    slots:
    - mcp_name
    - title
    slot_usage:
      mcp_name:
        description: Intended for programmatic or logical use, but used as a display name in past specs
          or fallback (if title isn't present).
        required: true
      title:
        description: |-
          Intended for UI and end-user contexts — optimized to be human-readable and easily understood,
          even by those unfamiliar with domain-specific terminology.

          If not provided, the name should be used for display (except for {@link Tool},
          where `annotations.title` should be given precedence over using `name`,
          if present).
        range: string
  McpBlobResourceContents:
    description: MCP's `BlobResourceContents`.
    is_a: McpResourceContents
    in_subset:
    - content
    exact_mappings:
    - mcp_schema:BlobResourceContents
    extra_slots:
      allowed: true
    attributes:
      meta:
        description: |-
          Represents the contents of a `_meta` field, which clients and servers use to attach additional metadata to their interactions.

          Certain key names are reserved by MCP for protocol-level metadata; implementations MUST NOT make assumptions about values at these keys. Additionally, specific schema definitions may reserve particular names for purpose-specific metadata, as declared in those definitions.

          Valid keys have two segments:

          **Prefix:**
          - Optional — if specified, MUST be a series of _labels_ separated by dots (`.`), followed by a slash (`/`).
          - Labels MUST start with a letter and end with a letter or digit. Interior characters may be letters, digits, or hyphens (`-`).
          - Implementations SHOULD use reverse DNS notation (e.g., `com.example/` rather than `example.com/`).
          - Any prefix where the second label is `modelcontextprotocol` or `mcp` is **reserved** for MCP use. For example: `io.modelcontextprotocol/`, `dev.mcp/`, `org.modelcontextprotocol.api/`, and `com.mcp.tools/` are all reserved. However, `com.example.mcp/` is NOT reserved, as the second label is `example`.

          **Name:**
          - Unless empty, MUST start and end with an alphanumeric character (`[a-z0-9A-Z]`).
          - Interior characters may be alphanumeric, hyphens (`-`), underscores (`_`), or dots (`.`).
        alias: _meta
        range: McpMetaObject
      blob:
        description: A base64-encoded string representing the binary data of the item.
        range: McpBase64
        required: true
      mime_type:
        description: The MIME type of this resource, if known.
        alias: mimeType
      uri:
        description: The URI of this resource.
        range: uri
        required: true
  McpBooleanSchema:
    description: MCP's `BooleanSchema`.
    in_subset:
    - elicitation_create
    exact_mappings:
    - mcp_schema:BooleanSchema
    extra_slots:
      allowed: true
    slots:
    - description
    - title
    slot_usage:
      description:
        description: A description of the field for the user.
        range: string
      title:
        description: A title for the field.
        range: string
    attributes:
      default:
        description: The value the field takes when the user gives none.
        range: boolean
      kind:
        description: The kind of object, always `boolean`.
        aliases:
        - type
        equals_string: boolean
        required: true
  McpCacheableResult:
    description: A result that supports a time-to-live (TTL) hint for client-side caching.
    is_a: McpResult
    exact_mappings:
    - mcp_schema:CacheableResult
    extra_slots:
      allowed: true
    attributes:
      meta:
        description: Extends {@link MetaObject} with additional result-specific fields. All key naming
          rules from `MetaObject` apply.
        alias: _meta
        range: McpResultMetaObject
      cache_scope:
        description: |-
          Indicates the intended scope of the cached response, analogous to HTTP
          `Cache-Control: public` vs `Cache-Control: private`.

          - `"public"`: The response does not contain user-specific data. Any
            client or intermediary (e.g., shared gateway, caching proxy) MAY cache
            the response and serve it across authorization contexts.
          - `"private"`: The response MAY be cached and reused only within the
            same authorization context. Caches MUST NOT be shared across
            authorization contexts (e.g., a different access token requires a
            different cache).
        alias: cacheScope
        range: McpCacheScope
        required: true
      result_type:
        description: |-
          Indicates the type of the result, which allows the client to determine
          how to parse the result object.

          Servers implementing this protocol version MUST include this field.
          For backward compatibility, when a client receives a result from a
          server implementing an earlier protocol version (which does not include
          `resultType`), the client MUST treat the absent field as `"complete"`.
        alias: resultType
        required: true
      ttl_ms:
        description: |-
          A hint from the server indicating how long (in milliseconds) the
          client MAY cache this response before re-fetching. Semantics are
          analogous to HTTP Cache-Control max-age.

          - If 0, The response SHOULD be considered immediately stale,
            The client MAY re-fetch every time the result is needed.
          - If positive, the client SHOULD consider the result fresh for this many
            milliseconds after receiving the response.
        alias: ttlMs
        range: integer
        minimum_value: 0
        required: true
  McpCallToolRequest:
    description: Used by the client to invoke a tool provided by the server.
    is_a: McpJSONRPCRequest
    in_subset:
    - tools_call
    exact_mappings:
    - mcp_schema:CallToolRequest
    extra_slots:
      allowed: true
    attributes:
      identifier:
        description: A uniquely identifying ID for a request in JSON-RPC.
        aliases:
        - id
        any_of:
        - range: string
        - range: integer
        required: true
      jsonrpc:
        description: The JSON-RPC version, always `2.0`.
        equals_string: '2.0'
        required: true
      method:
        description: The method's name, always `tools/call`.
        equals_string: tools/call
        required: true
      params:
        description: Parameters for a `tools/call` request.
        range: McpCallToolRequestParams
        required: true
  McpCallToolRequestParams:
    description: Parameters for a `tools/call` request.
    is_a: McpInputResponseRequestParams
    in_subset:
    - tools_call
    exact_mappings:
    - mcp_schema:CallToolRequestParams
    extra_slots:
      allowed: true
    slots:
    - mcp_name
    slot_usage:
      mcp_name:
        description: The name of the tool.
        required: true
    attributes:
      meta:
        description: Extends {@link MetaObject} with additional request-specific fields. All key naming
          rules from `MetaObject` apply.
        alias: _meta
        range: McpRequestMetaObject
        required: true
      arguments:
        description: Arguments to use for the tool call.
        range: McpJSONObject
      input_responses:
        description: |-
          A map of client responses to server-initiated requests.
          Keys correspond to the keys in the {@link InputRequests} map;
          values are the client's result for each request.
        alias: inputResponses
        range: McpInputResponses
      request_state:
        description: State the server handed out with an input-required result, sent back unchanged when
          the request is retried.
        alias: requestState
  McpCallToolResult:
    description: The result returned by the server for a {@link CallToolRequesttools/call} request.
    is_a: McpResult
    in_subset:
    - tools_call
    exact_mappings:
    - mcp_schema:CallToolResult
    extra_slots:
      allowed: true
    attributes:
      meta:
        description: Extends {@link MetaObject} with additional result-specific fields. All key naming
          rules from `MetaObject` apply.
        alias: _meta
        range: McpResultMetaObject
      content:
        description: A list of content objects that represent the unstructured result of the tool call.
        multivalued: true
        range: McpContentBlock
        inlined_as_list: true
        required: true
      is_error:
        description: |-
          Whether the tool call ended in an error.

          If not set, this is assumed to be false (the call was successful).

          Any errors that originate from the tool SHOULD be reported inside the result
          object, with `isError` set to true, _not_ as an MCP protocol-level error
          response. Otherwise, the LLM would not be able to see that an error occurred
          and self-correct.

          However, any errors in _finding_ the tool, an error indicating that the
          server does not support tool calls, or any other exceptional conditions,
          should be reported as an MCP error response.
        alias: isError
        range: boolean
      result_type:
        description: |-
          Indicates the type of the result, which allows the client to determine
          how to parse the result object.

          Servers implementing this protocol version MUST include this field.
          For backward compatibility, when a client receives a result from a
          server implementing an earlier protocol version (which does not include
          `resultType`), the client MUST treat the absent field as `"complete"`.
        alias: resultType
        required: true
      structured_content:
        description: |-
          An optional JSON value that represents the structured result of the tool call.

          This can be any JSON value (object, array, string, number, boolean, or null)
          that conforms to the tool's outputSchema if one is defined.
        alias: structuredContent
        range: McpJSONValue
  McpCallToolResultResponse:
    description: A successful response from the server for a {@link CallToolRequesttools/call} request.
    is_a: McpJSONRPCResultResponse
    in_subset:
    - tools_call
    exact_mappings:
    - mcp_schema:CallToolResultResponse
    extra_slots:
      allowed: true
    attributes:
      identifier:
        description: A uniquely identifying ID for a request in JSON-RPC.
        aliases:
        - id
        any_of:
        - range: string
        - range: integer
        required: true
      jsonrpc:
        description: The JSON-RPC version, always `2.0`.
        equals_string: '2.0'
        required: true
      result:
        description: What the request returned.
        any_of:
        - range: McpInputRequiredResult
        - range: McpCallToolResult
        required: true
  McpCancelledNotification:
    description: |-
      This notification is sent by the client to indicate that it is cancelling a request it previously issued.

      On stdio, the server also sends this notification, solely to terminate a {@link SubscriptionsListenRequestsubscriptions/listen} stream: it references the ID of the `subscriptions/listen` request that opened the stream. Servers MUST NOT use this notification to cancel any other request.

      The request SHOULD still be in-flight, but due to communication latency, it is always possible that this notification MAY arrive after the request has already finished.

      This notification indicates that the result will be unused, so any associated processing SHOULD cease.
    is_a: McpJSONRPCNotification
    in_subset:
    - notifications_cancelled
    exact_mappings:
    - mcp_schema:CancelledNotification
    extra_slots:
      allowed: true
    attributes:
      jsonrpc:
        description: The JSON-RPC version, always `2.0`.
        equals_string: '2.0'
        required: true
      method:
        description: The method's name, always `notifications/cancelled`.
        equals_string: notifications/cancelled
        required: true
      params:
        description: Parameters for a `notifications/cancelled` notification.
        range: McpCancelledNotificationParams
        required: true
  McpCancelledNotificationParams:
    description: Parameters for a `notifications/cancelled` notification.
    is_a: McpNotificationParams
    in_subset:
    - notifications_cancelled
    exact_mappings:
    - mcp_schema:CancelledNotificationParams
    extra_slots:
      allowed: true
    attributes:
      meta:
        description: Extends {@link MetaObject} with additional notification-specific fields. All key
          naming rules from `MetaObject` apply.
        alias: _meta
        range: McpNotificationMetaObject
      reason_text:
        description: An optional string describing the reason for the cancellation. This MAY be logged
          or presented to the user.
        aliases:
        - reason
      request_id:
        description: |-
          The ID of the request to cancel.

          This MUST correspond to the ID of a request the client previously issued.
        alias: requestId
        any_of:
        - range: string
        - range: integer
        required: true
  McpClientCapabilities:
    description: 'Capabilities a client may support. Known capabilities are defined here, in this schema,
      but this is not a closed set: any client can define its own, additional capabilities.'
    in_subset:
    - server_discover
    exact_mappings:
    - mcp_schema:ClientCapabilities
    extra_slots:
      allowed: true
    attributes:
      elicitation:
        description: Present if the client supports elicitation from the server.
        range: McpClientCapabilitiesElicitation
      experimental:
        description: Experimental, non-standard capabilities that the client supports.
        range: McpClientCapabilitiesExperimental
      extensions:
        description: |-
          Optional MCP extensions that the client supports. Keys are extension identifiers
          (e.g., "io.modelcontextprotocol/oauth-client-credentials"), and values are
          per-extension settings objects. An empty object indicates support with no settings.

          Keys MUST follow the {@link MetaObject`_meta` key naming rules}, with a
          mandatory prefix.
        range: McpClientCapabilitiesExtensions
      roots:
        description: Present if the client supports listing roots.
        range: McpClientCapabilitiesRoots
      sampling:
        description: Present if the client supports sampling from an LLM.
        range: McpClientCapabilitiesSampling
  McpClientCapabilitiesElicitation:
    description: Present if the client supports elicitation from the server.
    in_subset:
    - server_discover
    exact_mappings:
    - mcp_schema:ClientCapabilities/properties/elicitation
    extra_slots:
      allowed: true
    attributes:
      form:
        description: Settings for elicitation by form.
        range: McpJSONObject
      url_settings:
        description: Settings for elicitation by URL.
        aliases:
        - url
        range: McpJSONObject
  McpClientCapabilitiesExperimental:
    description: Experimental, non-standard capabilities that the client supports.
    in_subset:
    - server_discover
    exact_mappings:
    - mcp_schema:ClientCapabilities/properties/experimental
    extra_slots:
      range_expression:
        range: McpJSONObject
  McpClientCapabilitiesExtensions:
    description: |-
      Optional MCP extensions that the client supports. Keys are extension identifiers
      (e.g., "io.modelcontextprotocol/oauth-client-credentials"), and values are
      per-extension settings objects. An empty object indicates support with no settings.

      Keys MUST follow the {@link MetaObject`_meta` key naming rules}, with a
      mandatory prefix.
    in_subset:
    - server_discover
