        range: integer
      values:
        description: An array of completion values. Must not exceed 100 items.
        multivalued: true
        maximum_cardinality: 100
        required: true
  McpCompleteResultResponse:
    description: A successful response from the server for a {@link CompleteRequestcompletion/complete}
      request.
    is_a: McpJSONRPCResultResponse
    in_subset:
    - completion_complete
    exact_mappings:
    - mcp_schema:CompleteResultResponse
    extra_slots:
      allowed: true
    attributes:
      identifier:
        description: A uniquely identifying ID for a request in JSON-RPC.
        aliases:
        - id
        any_of:
        - range: string
        - range: integer
        required: true
      jsonrpc:
        description: The JSON-RPC version, always `2.0`.
        equals_string: '2.0'
        required: true
      result:
        description: The result returned by the server for a {@link CompleteRequestcompletion/complete}
          request.
        range: McpCompleteResult
        required: true
  McpContentBlock:
    description: One of `TextContent`, `ImageContent`, `AudioContent`, `ResourceLink`, `EmbeddedResource`.
    in_subset:
    - content
    exact_mappings:
    - mcp_schema:ContentBlock
    any_of:
    - is_a: McpTextContent
    - is_a: McpImageContent
    - is_a: McpAudioContent
    - is_a: McpResourceLink
    - is_a: McpEmbeddedResource
    extra_slots:
      allowed: true
  McpCreateMessageRequest:
    description: A request from the server to sample an LLM via the client. The client has full discretion
      over which model to select. The client should also inform the user before beginning sampling, to
      allow them to inspect the request (human in the loop) and decide whether to approve it.
    in_subset:
    - sampling_createmessage
    exact_mappings:
    - mcp_schema:CreateMessageRequest
    extra_slots:
      allowed: true
    attributes:
      method:
        description: The method's name, always `sampling/createMessage`.
        equals_string: sampling/createMessage
        required: true
      params:
        description: Parameters for a `sampling/createMessage` request.
        range: McpCreateMessageRequestParams
        required: true
  McpCreateMessageRequestParams:
    description: Parameters for a `sampling/createMessage` request.
    in_subset:
    - sampling_createmessage
    exact_mappings:
    - mcp_schema:CreateMessageRequestParams
    extra_slots:
      allowed: true
    attributes:
      include_context:
        description: |-
          A request to include context from one or more MCP servers (including the caller), to be attached to the prompt.
          The client MAY ignore this request.

          Default is `"none"`. The values `"thisServer"` and `"allServers"` are deprecated (SEP-2596): servers SHOULD
          omit this field or use `"none"`, and SHOULD only use the deprecated values if the client declares
          {@link ClientCapabilities.sampling.context}.
        alias: includeContext
        range: McpCreateMessageRequestParamsIncludeContext
      max_tokens:
        description: |-
          The requested maximum number of tokens to sample (to prevent runaway completions).

          The client MAY choose to sample fewer tokens than the requested maximum.
        alias: maxTokens
        range: integer
        required: true
      messages:
        description: Describes a message issued to or received from an LLM API.
        multivalued: true
        range: McpSamplingMessage
        inlined_as_list: true
        required: true
      metadata:
        description: Optional metadata to pass through to the LLM provider. The format of this metadata
          is provider-specific.
        range: McpJSONObject
      model_preferences:
        description: The server's preferences for which model to select. The client MAY ignore these preferences.
        alias: modelPreferences
        range: McpModelPreferences
      stop_sequences:
        description: Sequences at which the model should stop generating.
        alias: stopSequences
        multivalued: true
      system_prompt:
        description: An optional system prompt the server wants to use for sampling. The client MAY modify
          or omit this prompt.
        alias: systemPrompt
      temperature:
        description: The sampling temperature the server asks the model to use.
        range: float
      tool_choice:
        description: |-
          Controls how the model uses tools.
          The client MUST return an error if this field is provided but {@link ClientCapabilities.sampling.tools} is not declared.
          Default is `{ mode: "auto" }`.
        alias: toolChoice
        range: McpToolChoice
      tools:
        description: |-
          Tools that the model may use during generation.
          The client MUST return an error if this field is provided but {@link ClientCapabilities.sampling.tools} is not declared.
        multivalued: true
        range: McpTool
        inlined_as_list: true
  McpCreateMessageResult:
    description: |-
      The result returned by the client for a {@link CreateMessageRequestsampling/createMessage} request.
      The client should inform the user before returning the sampled message, to allow them
      to inspect the response (human in the loop) and decide whether to allow the server to see it.
    is_a: McpSamplingMessage
    in_subset:
    - sampling_createmessage
    exact_mappings:
    - mcp_schema:CreateMessageResult
    extra_slots:
      allowed: true
    attributes:
      meta:
        description: |-
          Represents the contents of a `_meta` field, which clients and servers use to attach additional metadata to their interactions.

          Certain key names are reserved by MCP for protocol-level metadata; implementations MUST NOT make assumptions about values at these keys. Additionally, specific schema definitions may reserve particular names for purpose-specific metadata, as declared in those definitions.

          Valid keys have two segments:

          **Prefix:**
          - Optional — if specified, MUST be a series of _labels_ separated by dots (`.`), followed by a slash (`/`).
          - Labels MUST start with a letter and end with a letter or digit. Interior characters may be letters, digits, or hyphens (`-`).
          - Implementations SHOULD use reverse DNS notation (e.g., `com.example/` rather than `example.com/`).
          - Any prefix where the second label is `modelcontextprotocol` or `mcp` is **reserved** for MCP use. For example: `io.modelcontextprotocol/`, `dev.mcp/`, `org.modelcontextprotocol.api/`, and `com.mcp.tools/` are all reserved. However, `com.example.mcp/` is NOT reserved, as the second label is `example`.

          **Name:**
          - Unless empty, MUST start and end with an alphanumeric character (`[a-z0-9A-Z]`).
          - Interior characters may be alphanumeric, hyphens (`-`), underscores (`_`), or dots (`.`).
        alias: _meta
        range: McpMetaObject
      content:
        description: The content the message carries.
        any_of:
        - range: McpTextContent
        - range: McpImageContent
        - range: McpAudioContent
        - range: McpToolUseContent
        - range: McpToolResultContent
        - multivalued: true
          range: McpSamplingMessageContentBlock
          inlined_as_list: true
        required: true
      model:
        description: The name of the model that generated the message.
        required: true
      role:
        description: The sender or recipient of messages and data in a conversation.
        range: McpRole
        required: true
      stop_reason:
        description: |-
          The reason why sampling stopped, if known.

          Standard values:
          - `"endTurn"`: Natural end of the assistant's turn
          - `"stopSequence"`: A stop sequence was encountered
          - `"maxTokens"`: Maximum token limit was reached
          - `"toolUse"`: The model wants to use one or more tools

          This field is an open string to allow for provider-specific stop reasons.
        alias: stopReason
  McpDiscoverRequest:
    description: |-
      A request from the client asking the server to advertise its supported
      protocol versions, capabilities, and other metadata. Servers **MUST**
      implement `server/discover`. Clients **MAY** call it but are not required
      to — version negotiation can also happen inline via per-request `_meta`.
    is_a: McpJSONRPCRequest
    in_subset:
    - server_discover
    exact_mappings:
    - mcp_schema:DiscoverRequest
    extra_slots:
      allowed: true
    attributes:
      identifier:
        description: A uniquely identifying ID for a request in JSON-RPC.
        aliases:
        - id
        any_of:
        - range: string
        - range: integer
        required: true
      jsonrpc:
        description: The JSON-RPC version, always `2.0`.
        equals_string: '2.0'
        required: true
      method:
        description: The method's name, always `server/discover`.
        equals_string: server/discover
        required: true
      params:
        description: Common params for any request.
        range: McpRequestParams
        required: true
  McpDiscoverResult:
    description: The result returned by the server for a {@link DiscoverRequestserver/discover} request.
    is_a: McpCacheableResult
    in_subset:
    - server_discover
    exact_mappings:
    - mcp_schema:DiscoverResult
    extra_slots:
      allowed: true
    attributes:
      meta:
        description: Extends {@link MetaObject} with additional result-specific fields. All key naming
          rules from `MetaObject` apply.
        alias: _meta
        range: McpResultMetaObject
      cache_scope:
        description: |-
          Indicates the intended scope of the cached response, analogous to HTTP
          `Cache-Control: public` vs `Cache-Control: private`.

          - `"public"`: The response does not contain user-specific data. Any
            client or intermediary (e.g., shared gateway, caching proxy) MAY cache
            the response and serve it across authorization contexts.
          - `"private"`: The response MAY be cached and reused only within the
            same authorization context. Caches MUST NOT be shared across
            authorization contexts (e.g., a different access token requires a
            different cache).
        alias: cacheScope
        range: McpCacheScope
        required: true
      capabilities:
        description: The capabilities of the server.
        range: McpServerCapabilities
        required: true
      instructions:
        description: |-
          Natural-language guidance describing the server and its features.

          This can be used by clients to improve an LLM's understanding of
          available tools (e.g., by including it in a system prompt). It should
          focus on information that helps the model use the server effectively
          and should not duplicate information already in tool descriptions.
      result_type:
        description: |-
          Indicates the type of the result, which allows the client to determine
          how to parse the result object.

          Servers implementing this protocol version MUST include this field.
          For backward compatibility, when a client receives a result from a
          server implementing an earlier protocol version (which does not include
          `resultType`), the client MUST treat the absent field as `"complete"`.
        alias: resultType
        required: true
      supported_versions:
        description: |-
          MCP Protocol Versions this server supports. The client should choose a
          version from this list for use in subsequent requests.
        alias: supportedVersions
        multivalued: true
        required: true
      ttl_ms:
        description: |-
          A hint from the server indicating how long (in milliseconds) the
          client MAY cache this response before re-fetching. Semantics are
          analogous to HTTP Cache-Control max-age.

          - If 0, The response SHOULD be considered immediately stale,
            The client MAY re-fetch every time the result is needed.
          - If positive, the client SHOULD consider the result fresh for this many
            milliseconds after receiving the response.
        alias: ttlMs
        range: integer
        minimum_value: 0
        required: true
  McpDiscoverResultResponse:
    description: A successful response from the server for a {@link DiscoverRequestserver/discover} request.
    is_a: McpJSONRPCResultResponse
    in_subset:
    - server_discover
    exact_mappings:
    - mcp_schema:DiscoverResultResponse
    extra_slots:
      allowed: true
    attributes:
      identifier:
        description: A uniquely identifying ID for a request in JSON-RPC.
        aliases:
        - id
        any_of:
        - range: string
        - range: integer
        required: true
      jsonrpc:
        description: The JSON-RPC version, always `2.0`.
        equals_string: '2.0'
        required: true
      result:
        description: The result returned by the server for a {@link DiscoverRequestserver/discover} request.
        range: McpDiscoverResult
        required: true
  McpElicitRequest:
    description: A request from the server to elicit additional information from the user via the client.
