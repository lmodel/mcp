name: mcp
description: 'The messages and objects of the Model Context Protocol, version 2026-07-28,
  as its schema.json states them: JSON-RPC requests, results, notifications and errors,
  and the tools, resources, prompts, content and capabilities they carry. Generated
  from MCP''s own files by scripts/mcp_to_linkml.py.'
