  McpTool:
    name: McpTool
    definition_uri: https://w3id.org/lmodel/mcp/McpTool
    description: Definition for a tool the client can call.
    in_subset:
    - tools_list
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:Tool
    is_a: McpBaseMetadata
    mixins:
    - McpIcons
    slots:
    - McpTool_description
    - McpTool_name
    - McpTool_title
    - mcpTool__meta
    - mcpTool__annotations
    - mcpTool__icons
    - mcpTool__input_schema
    - mcpTool__output_schema
    slot_usage:
      description:
        name: description
        description: 'A human-readable description of the tool.


          This can be used by clients to improve the LLM''s understanding of available
          tools. It can be thought of like a "hint" to the model.'
      name:
        name: name
        description: Intended for programmatic or logical use, but used as a display
          name in past specs or fallback (if title isn't present).
        required: true
      title:
        name: title
        description: "Intended for UI and end-user contexts \u2014 optimized to be\
          \ human-readable and easily understood,\neven by those unfamiliar with domain-specific\
          \ terminology.\n\nIf not provided, the name should be used for display (except\
          \ for {@link Tool},\nwhere `annotations.title` should be given precedence\
          \ over using `name`,\nif present)."
    attributes:
      meta:
        name: meta
        description: "Represents the contents of a `_meta` field, which clients and\
          \ servers use to attach additional metadata to their interactions.\n\nCertain\
          \ key names are reserved by MCP for protocol-level metadata; implementations\
          \ MUST NOT make assumptions about values at these keys. Additionally, specific\
          \ schema definitions may reserve particular names for purpose-specific metadata,\
          \ as declared in those definitions.\n\nValid keys have two segments:\n\n\
          **Prefix:**\n- Optional \u2014 if specified, MUST be a series of _labels_\
          \ separated by dots (`.`), followed by a slash (`/`).\n- Labels MUST start\
          \ with a letter and end with a letter or digit. Interior characters may\
          \ be letters, digits, or hyphens (`-`).\n- Implementations SHOULD use reverse\
          \ DNS notation (e.g., `com.example/` rather than `example.com/`).\n- Any\
          \ prefix where the second label is `modelcontextprotocol` or `mcp` is **reserved**\
          \ for MCP use. For example: `io.modelcontextprotocol/`, `dev.mcp/`, `org.modelcontextprotocol.api/`,\
          \ and `com.mcp.tools/` are all reserved. However, `com.example.mcp/` is\
          \ NOT reserved, as the second label is `example`.\n\n**Name:**\n- Unless\
          \ empty, MUST start and end with an alphanumeric character (`[a-z0-9A-Z]`).\n\
          - Interior characters may be alphanumeric, hyphens (`-`), underscores (`_`),\
          \ or dots (`.`)."
        alias: _meta
        range: McpMetaObject
      annotations:
        name: annotations
        description: 'Optional additional tool information.


          Display name precedence order is: `title`, `annotations.title`, then `name`.'
        range: McpToolAnnotations
      icons:
        name: icons
        description: 'Optional set of sized icons that the client can display in a
          user interface.


          Clients that support rendering icons MUST support at least the following
          MIME types:

          - `image/png` - PNG images (safe, universal compatibility)

          - `image/jpeg` (and `image/jpg`) - JPEG images (safe, universal compatibility)


          Clients that support rendering icons SHOULD also support:

          - `image/svg+xml` - SVG images (scalable but requires security precautions)

          - `image/webp` - WebP images (modern, efficient format)'
        range: McpIcon
        multivalued: true
        inlined_as_list: true
      input_schema:
        name: input_schema
        description: "A JSON Schema object defining the expected parameters for the\
          \ tool.\n\nTool arguments are always JSON objects, so `type: \"object\"\
          ` is required at the root.\nBeyond that, any JSON Schema 2020-12 keyword\
          \ may appear alongside `type` \u2014 including\ncomposition keywords (`oneOf`,\
          \ `anyOf`, `allOf`, `not`), conditional keywords\n(`if`/`then`/`else`),\
          \ reference keywords (`$ref`, `$defs`, `$anchor`), and any other\nstandard\
          \ validation or annotation keywords.\n\nProperty schemas may carry an `x-mcp-header`\
          \ annotation to mirror the\nargument value into an HTTP header on the Streamable\
          \ HTTP transport. See\nthe Streamable HTTP transport specification for the\
          \ validity and\nextraction rules.\n\nDefaults to JSON Schema 2020-12 when\
          \ no explicit `$schema` is provided."
        alias: inputSchema
        range: McpToolInputSchema
        required: true
      output_schema:
        name: output_schema
        description: 'An optional JSON Schema object defining the structure of the
          tool''s output returned in

          the structuredContent field of a {@link CallToolResult}. This can be any
          valid JSON Schema 2020-12.


          Defaults to JSON Schema 2020-12 when no explicit `$schema` is provided.'
        alias: outputSchema
        range: McpToolOutputSchema
    class_uri: mcp:McpTool
    extra_slots:
      allowed: true
  McpToolAnnotations:
    name: McpToolAnnotations
    definition_uri: https://w3id.org/lmodel/mcp/McpToolAnnotations
    description: 'Additional properties describing a {@link Tool} to clients.


      NOTE: all properties in `ToolAnnotations` are **hints**.

      They are not guaranteed to provide a faithful description of

      tool behavior (including descriptive properties like `title`).


      Clients should never make tool use decisions based on `ToolAnnotations`

      received from untrusted servers.'
    in_subset:
    - tools_list
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:ToolAnnotations
    slots:
    - McpToolAnnotations_title
    - mcpToolAnnotations__destructive_hint
    - mcpToolAnnotations__idempotent_hint
    - mcpToolAnnotations__open_world_hint
    - mcpToolAnnotations__read_only_hint
    slot_usage:
      title:
        name: title
        description: A human-readable title for the tool.
    attributes:
      destructive_hint:
        name: destructive_hint
        description: 'If true, the tool may perform destructive updates to its environment.

          If false, the tool performs only additive updates.


          (This property is meaningful only when `readOnlyHint == false`)


          Default: true'
        alias: destructiveHint
        range: boolean
      idempotent_hint:
        name: idempotent_hint
        description: 'If true, calling the tool repeatedly with the same arguments

          will have no additional effect on its environment.


          (This property is meaningful only when `readOnlyHint == false`)


          Default: false'
        alias: idempotentHint
        range: boolean
      open_world_hint:
        name: open_world_hint
        description: 'If true, this tool may interact with an "open world" of external

          entities. If false, the tool''s domain of interaction is closed.

          For example, the world of a web search tool is open, whereas that

          of a memory tool is not.


          Default: true'
        alias: openWorldHint
        range: boolean
      read_only_hint:
        name: read_only_hint
        description: 'If true, the tool does not modify its environment.


          Default: false'
        alias: readOnlyHint
        range: boolean
    class_uri: mcp:McpToolAnnotations
    extra_slots:
      allowed: true
  McpToolChoice:
    name: McpToolChoice
    definition_uri: https://w3id.org/lmodel/mcp/McpToolChoice
    description: Controls tool selection behavior for sampling requests.
    in_subset:
    - sampling_createmessage
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:ToolChoice
    slots:
    - mcpToolChoice__mode
    attributes:
      mode:
        name: mode
        description: 'Controls the tool use ability of the model:

          - `"auto"`: Model decides whether to use tools (default)

          - `"required"`: Model MUST use at least one tool before completing

          - `"none"`: Model MUST NOT use any tools'
        range: McpToolChoiceMode
    class_uri: mcp:McpToolChoice
    extra_slots:
      allowed: true
  McpToolInputSchema:
    name: McpToolInputSchema
    definition_uri: https://w3id.org/lmodel/mcp/McpToolInputSchema
    description: "A JSON Schema object defining the expected parameters for the tool.\n\
      \nTool arguments are always JSON objects, so `type: \"object\"` is required\
      \ at the root.\nBeyond that, any JSON Schema 2020-12 keyword may appear alongside\
      \ `type` \u2014 including\ncomposition keywords (`oneOf`, `anyOf`, `allOf`,\
      \ `not`), conditional keywords\n(`if`/`then`/`else`), reference keywords (`$ref`,\
      \ `$defs`, `$anchor`), and any other\nstandard validation or annotation keywords.\n\
      \nProperty schemas may carry an `x-mcp-header` annotation to mirror the\nargument\
      \ value into an HTTP header on the Streamable HTTP transport. See\nthe Streamable\
      \ HTTP transport specification for the validity and\nextraction rules.\n\nDefaults\
      \ to JSON Schema 2020-12 when no explicit `$schema` is provided."
    in_subset:
    - tools_list
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:Tool/properties/inputSchema
    slots:
    - mcpToolInputSchema__schema_dialect
    - mcpToolInputSchema__kind
    attributes:
      schema_dialect:
        name: schema_dialect
        description: The JSON Schema dialect the schema is written in.
        aliases:
        - $schema
      kind:
        name: kind
        description: The kind of object, always `object`.
        aliases:
        - type
        required: true
        equals_string: object
    class_uri: mcp:McpToolInputSchema
    extra_slots:
      allowed: true
  McpToolListChangedNotification:
    name: McpToolListChangedNotification
    definition_uri: https://w3id.org/lmodel/mcp/McpToolListChangedNotification
    description: An optional notification from the server to the client, informing
      it that the list of tools it offers has changed. This is only delivered on a
      {@link SubscriptionsListenRequestsubscriptions/listen} stream when the client
      requested it via the `toolsListChanged` filter field.
    in_subset:
    - notifications_tools_list_changed
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:ToolListChangedNotification
    is_a: McpJSONRPCNotification
    slots:
    - mcpToolListChangedNotification__jsonrpc
    - mcpToolListChangedNotification__method
    - mcpToolListChangedNotification__params
    attributes:
      jsonrpc:
        name: jsonrpc
        description: The JSON-RPC version, always `2.0`.
        required: true
        equals_string: '2.0'
      method:
        name: method
        description: The method's name, always `notifications/tools/list_changed`.
        required: true
        equals_string: notifications/tools/list_changed
      params:
        name: params
        description: Common params for any notification.
        range: McpNotificationParams
    class_uri: mcp:McpToolListChangedNotification
    extra_slots:
      allowed: true
  McpToolOutputSchema:
    name: McpToolOutputSchema
    definition_uri: https://w3id.org/lmodel/mcp/McpToolOutputSchema
    description: 'An optional JSON Schema object defining the structure of the tool''s
      output returned in

      the structuredContent field of a {@link CallToolResult}. This can be any valid
      JSON Schema 2020-12.


      Defaults to JSON Schema 2020-12 when no explicit `$schema` is provided.'
    in_subset:
    - tools_list
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:Tool/properties/outputSchema
    slots:
    - mcpToolOutputSchema__schema_dialect
    attributes:
      schema_dialect:
        name: schema_dialect
        description: The JSON Schema dialect the schema is written in.
        aliases:
        - $schema
    class_uri: mcp:McpToolOutputSchema
    extra_slots:
      allowed: true
  McpToolResultContent:
    name: McpToolResultContent
    definition_uri: https://w3id.org/lmodel/mcp/McpToolResultContent
    description: The result of a tool use, provided by the user back to the assistant.
    in_subset:
    - sampling_createmessage
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:ToolResultContent
    slots:
    - mcpToolResultContent__meta
    - mcpToolResultContent__content
    - mcpToolResultContent__is_error
    - mcpToolResultContent__structured_content
    - mcpToolResultContent__tool_use_id
    - mcpToolResultContent__kind
    attributes:
      meta:
        name: meta
        description: 'Optional metadata about the tool result. Clients SHOULD preserve
          this field when

          including tool results in subsequent sampling requests to enable caching
          optimizations.'
        alias: _meta
        range: McpMetaObject
      content:
        name: content
        description: 'The unstructured result content of the tool use.


          This has the same format as {@link CallToolResult.content} and can include
          text, images,

          audio, resource links, and embedded resources.'
        range: McpContentBlock
        required: true
        multivalued: true
        inlined_as_list: true
      is_error:
        name: is_error
        description: 'Whether the tool use resulted in an error.


          If true, the content typically describes the error that occurred.

          Default: false'
        alias: isError
        range: boolean
      structured_content:
        name: structured_content
        description: 'An optional structured result value.


          This can be any JSON value (object, array, string, number, boolean, or null).

          If the tool defined an {@link Tool.outputSchema}, this SHOULD conform to
          that schema.'
        alias: structuredContent
        range: McpJSONValue
      tool_use_id:
        name: tool_use_id
        description: 'The ID of the tool use this result corresponds to.


          This MUST match the ID from a previous {@link ToolUseContent}.'
        alias: toolUseId
        required: true
      kind:
        name: kind
        description: The kind of object, always `tool_result`.
        aliases:
        - type
        required: true
        equals_string: tool_result
    class_uri: mcp:McpToolResultContent
    extra_slots:
      allowed: true
  McpToolUseContent:
    name: McpToolUseContent
    definition_uri: https://w3id.org/lmodel/mcp/McpToolUseContent
    description: A request from the assistant to call a tool.
    in_subset:
    - sampling_createmessage
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:ToolUseContent
    slots:
    - McpToolUseContent_name
    - mcpToolUseContent__meta
    - mcpToolUseContent__identifier
    - mcpToolUseContent__input
    - mcpToolUseContent__kind
    slot_usage:
      name:
        name: name
        description: The name of the tool to call.
        required: true
    attributes:
      meta:
        name: meta
        description: 'Optional metadata about the tool use. Clients SHOULD preserve
          this field when

          including tool uses in subsequent sampling requests to enable caching optimizations.'
        alias: _meta
        range: McpMetaObject
      identifier:
        name: identifier
        description: 'A unique identifier for this tool use.


          This ID is used to match tool results to their corresponding tool uses.'
        aliases:
        - id
        required: true
      input:
        name: input
        description: The arguments to pass to the tool, conforming to the tool's input
          schema.
        range: McpJSONObject
        required: true
      kind:
        name: kind
        description: The kind of object, always `tool_use`.
        aliases:
        - type
        required: true
        equals_string: tool_use
    class_uri: mcp:McpToolUseContent
    extra_slots:
      allowed: true
  McpUnsupportedProtocolVersionError:
    name: McpUnsupportedProtocolVersionError
    definition_uri: https://w3id.org/lmodel/mcp/McpUnsupportedProtocolVersionError
    description: 'Returned when the request''s protocol version is unknown to the
      server or

      unsupported (e.g., a known experimental or draft version the server has

      chosen not to implement). For HTTP, the response status code MUST be

      `400 Bad Request`.'
    in_subset:
    - errors
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:UnsupportedProtocolVersionError
    is_a: McpJSONRPCErrorResponse
    slots:
    - mcpUnsupportedProtocolVersionError__error
    - mcpUnsupportedProtocolVersionError__identifier
    - mcpUnsupportedProtocolVersionError__jsonrpc
    attributes:
      error:
        name: error
        description: The error the request ended with.
        range: McpUnsupportedProtocolVersionErrorError
        required: true
      identifier:
        name: identifier
        description: A uniquely identifying ID for a request in JSON-RPC.
        aliases:
        - id
        any_of:
        - range: string
        - range: integer
      jsonrpc:
        name: jsonrpc
        description: The JSON-RPC version, always `2.0`.
        required: true
        equals_string: '2.0'
    class_uri: mcp:McpUnsupportedProtocolVersionError
    extra_slots:
      allowed: true
  McpUnsupportedProtocolVersionErrorError:
    name: McpUnsupportedProtocolVersionErrorError
    definition_uri: https://w3id.org/lmodel/mcp/McpUnsupportedProtocolVersionErrorError
    description: MCP's `Error`, with the code and data this error carries.
    in_subset:
    - errors
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:UnsupportedProtocolVersionError/properties/error/allOf/1
    is_a: McpError
    slots:
    - mcpError__message
    - mcpUnsupportedProtocolVersionErrorError__code
    - mcpUnsupportedProtocolVersionErrorError__data
    attributes:
      code:
        name: code
        description: The error code, always `-32022`.
        range: integer
        required: true
        equals_number: -32022
      data:
        name: data
        description: Details of the error.
        range: McpUnsupportedProtocolVersionErrorErrorData
        required: true
    class_uri: mcp:McpUnsupportedProtocolVersionErrorError
    extra_slots:
      allowed: true
  McpUnsupportedProtocolVersionErrorErrorData:
    name: McpUnsupportedProtocolVersionErrorErrorData
    definition_uri: https://w3id.org/lmodel/mcp/McpUnsupportedProtocolVersionErrorErrorData
    description: The object MCP's `UnsupportedProtocolVersionError` holds under `data`.
    in_subset:
    - errors
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:UnsupportedProtocolVersionError/properties/error/allOf/1/properties/data
    slots:
    - mcpUnsupportedProtocolVersionErrorErrorData__requested
    - mcpUnsupportedProtocolVersionErrorErrorData__supported
    attributes:
      requested:
        name: requested
        description: The protocol version that was requested by the client.
        required: true
      supported:
        name: supported
        description: 'Protocol versions the server supports. The client should choose
          a

          mutually supported version from this list and retry.'
        required: true
        multivalued: true
    class_uri: mcp:McpUnsupportedProtocolVersionErrorErrorData
    extra_slots:
      allowed: true
  McpUntitledMultiSelectEnumSchema:
    name: McpUntitledMultiSelectEnumSchema
    definition_uri: https://w3id.org/lmodel/mcp/McpUntitledMultiSelectEnumSchema
    description: Schema for multiple-selection enumeration without display titles
      for options.
    in_subset:
    - elicitation_create
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:UntitledMultiSelectEnumSchema
    slots:
    - McpUntitledMultiSelectEnumSchema_description
    - McpUntitledMultiSelectEnumSchema_title
    - mcpUntitledMultiSelectEnumSchema__default
    - mcpUntitledMultiSelectEnumSchema__items
    - mcpUntitledMultiSelectEnumSchema__max_items
    - mcpUntitledMultiSelectEnumSchema__min_items
    - mcpUntitledMultiSelectEnumSchema__kind
    slot_usage:
      description:
        name: description
        description: Optional description for the enum field.
      title:
        name: title
        description: Optional title for the enum field.
    attributes:
      default:
        name: default
        description: Optional default value.
        multivalued: true
      items:
        name: items
        description: Schema for the array items.
        range: McpUntitledMultiSelectEnumSchemaItems
        required: true
      max_items:
        name: max_items
        description: Maximum number of items to select.
        alias: maxItems
        range: integer
      min_items:
        name: min_items
        description: Minimum number of items to select.
        alias: minItems
        range: integer
      kind:
        name: kind
        description: The kind of object, always `array`.
        aliases:
        - type
        required: true
        equals_string: array
    class_uri: mcp:McpUntitledMultiSelectEnumSchema
    extra_slots:
      allowed: true
  McpUntitledMultiSelectEnumSchemaItems:
    name: McpUntitledMultiSelectEnumSchemaItems
    definition_uri: https://w3id.org/lmodel/mcp/McpUntitledMultiSelectEnumSchemaItems
    description: Schema for the array items.
    in_subset:
    - elicitation_create
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:UntitledMultiSelectEnumSchema/properties/items
    slots:
    - mcpUntitledMultiSelectEnumSchemaItems__enum
    - mcpUntitledMultiSelectEnumSchemaItems__kind
    attributes:
      enum:
        name: enum
        description: Array of enum values to choose from.
        required: true
        multivalued: true
      kind:
        name: kind
        description: The kind of object, always `string`.
        aliases:
        - type
        required: true
        equals_string: string
    class_uri: mcp:McpUntitledMultiSelectEnumSchemaItems
    extra_slots:
      allowed: true
  McpUntitledSingleSelectEnumSchema:
    name: McpUntitledSingleSelectEnumSchema
    definition_uri: https://w3id.org/lmodel/mcp/McpUntitledSingleSelectEnumSchema
    description: Schema for single-selection enumeration without display titles for
      options.
    in_subset:
    - elicitation_create
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:UntitledSingleSelectEnumSchema
    slots:
    - McpUntitledSingleSelectEnumSchema_description
    - McpUntitledSingleSelectEnumSchema_title
    - mcpUntitledSingleSelectEnumSchema__default
    - mcpUntitledSingleSelectEnumSchema__enum
    - mcpUntitledSingleSelectEnumSchema__kind
    slot_usage:
      description:
        name: description
        description: Optional description for the enum field.
      title:
        name: title
        description: Optional title for the enum field.
    attributes:
      default:
        name: default
        description: Optional default value.
      enum:
        name: enum
        description: Array of enum values to choose from.
        required: true
        multivalued: true
      kind:
        name: kind
        description: The kind of object, always `string`.
        aliases:
        - type
        required: true
        equals_string: string
    class_uri: mcp:McpUntitledSingleSelectEnumSchema
    extra_slots:
      allowed: true
