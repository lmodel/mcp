  mcpCacheableResult__cache_scope:
    name: mcpCacheableResult__cache_scope
    description: "Indicates the intended scope of the cached response, analogous to\
      \ HTTP\n`Cache-Control: public` vs `Cache-Control: private`.\n\n- `\"public\"\
      `: The response does not contain user-specific data. Any\n  client or intermediary\
      \ (e.g., shared gateway, caching proxy) MAY cache\n  the response and serve\
      \ it across authorization contexts.\n- `\"private\"`: The response MAY be cached\
      \ and reused only within the\n  same authorization context. Caches MUST NOT\
      \ be shared across\n  authorization contexts (e.g., a different access token\
      \ requires a\n  different cache)."
