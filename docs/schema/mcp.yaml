    description: Optional annotations for the client.
    from_schema: https://w3id.org/lmodel/mcp
    slot_uri: mcp:annotations
    alias: annotations
    owner: McpResource
    domain_of:
    - McpResource
    range: McpAnnotations
    inlined: true
    inlined_as_list: true
  mcpResource__icons:
    name: mcpResource__icons
    description: 'Optional set of sized icons that the client can display in a user
      interface.


      Clients that support rendering icons MUST support at least the following MIME
      types:

      - `image/png` - PNG images (safe, universal compatibility)

      - `image/jpeg` (and `image/jpg`) - JPEG images (safe, universal compatibility)


      Clients that support rendering icons SHOULD also support:

      - `image/svg+xml` - SVG images (scalable but requires security precautions)

      - `image/webp` - WebP images (modern, efficient format)'
    from_schema: https://w3id.org/lmodel/mcp
