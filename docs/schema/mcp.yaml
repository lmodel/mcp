    required: true
  mcpCacheableResult__ttl_ms:
    name: mcpCacheableResult__ttl_ms
    description: "A hint from the server indicating how long (in milliseconds) the\n\
      client MAY cache this response before re-fetching. Semantics are\nanalogous\
      \ to HTTP Cache-Control max-age.\n\n- If 0, The response SHOULD be considered\
      \ immediately stale,\n  The client MAY re-fetch every time the result is needed.\n\
      - If positive, the client SHOULD consider the result fresh for this many\n \
      \ milliseconds after receiving the response."
    from_schema: https://w3id.org/lmodel/mcp
    slot_uri: mcp:ttlMs
    alias: ttlMs
    owner: McpCacheableResult
    domain_of:
    - McpCacheableResult
    range: integer
