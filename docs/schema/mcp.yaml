        - range: string
        - range: integer
      jsonrpc:
        name: jsonrpc
        description: The JSON-RPC version, always `2.0`.
        required: true
        equals_string: '2.0'
      result:
        name: result
        description: The result returned by the server for a {@link ListPromptsRequestprompts/list}
          request.
        range: McpListPromptsResult
        required: true
    class_uri: mcp:McpListPromptsResultResponse
    extra_slots:
      allowed: true
  McpListResourceTemplatesRequest:
