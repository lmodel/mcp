  McpRequestMetaObject:
    name: McpRequestMetaObject
    definition_uri: https://w3id.org/lmodel/mcp/McpRequestMetaObject
    description: Extends {@link MetaObject} with additional request-specific fields.
      All key naming rules from `MetaObject` apply.
    in_subset:
    - common_types
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:RequestMetaObject
    is_a: McpMetaObject
    slots:
    - mcpRequestMetaObject__mcp_client_capabilities
    - mcpRequestMetaObject__mcp_client_info
    - mcpRequestMetaObject__mcp_log_level
    - mcpRequestMetaObject__mcp_protocol_version
    - mcpRequestMetaObject__progress_token
    attributes:
      mcp_client_capabilities:
        name: mcp_client_capabilities
        description: 'The client''s capabilities for this specific request. Required.


          Capabilities are declared per-request rather than once at initialization;

          an empty object means the client supports no optional capabilities.

          Servers MUST NOT infer capabilities from prior requests.'
        aliases:
        - io.modelcontextprotocol/clientCapabilities
        range: McpClientCapabilities
        required: true
      mcp_client_info:
        name: mcp_client_info
        description: 'Identifies the client software making the request. Clients SHOULD

          include this field on every request unless specifically configured not

          to do so.


          The {@link Implementation} schema requires `name` and `version`; other

          fields are optional.


          The value is self-reported by the client and is not verified by the

          protocol. It is intended for display, logging, and debugging. Servers

          SHOULD NOT use it to change their behavior, and SHOULD NOT rely on it for

          security decisions.'
        aliases:
        - io.modelcontextprotocol/clientInfo
        range: McpImplementation
      mcp_log_level:
        name: mcp_log_level
        description: 'The desired log level for this request. Optional.


          If absent, the server MUST NOT send any {@link LoggingMessageNotificationnotifications/message}

          notifications for this request. The client opts in to log messages by

          explicitly setting a level. Replaces the former `logging/setLevel` RPC.'
        aliases:
        - io.modelcontextprotocol/logLevel
        range: McpLoggingLevel
      mcp_protocol_version:
        name: mcp_protocol_version
        description: 'The MCP Protocol Version being used for this request. Required.


          For the HTTP transport, this value MUST match the `MCP-Protocol-Version`

          header; otherwise the server MUST return a `400 Bad Request`. If the

          server does not support the requested version, it MUST return an

          {@link UnsupportedProtocolVersionError}.'
        aliases:
        - io.modelcontextprotocol/protocolVersion
        required: true
      progress_token:
        name: progress_token
        description: If specified, the caller is requesting out-of-band progress notifications
          for this request (as represented by {@link ProgressNotificationnotifications/progress}).
          The value of this parameter is an opaque token that will be attached to
          any subsequent notifications. The receiver is not obligated to provide these
          notifications.
        alias: progressToken
        any_of:
        - range: string
        - range: integer
    class_uri: mcp:McpRequestMetaObject
    extra_slots:
      allowed: true
  McpRequestParams:
    name: McpRequestParams
    definition_uri: https://w3id.org/lmodel/mcp/McpRequestParams
