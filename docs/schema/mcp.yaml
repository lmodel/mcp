  McpReadResourceResult:
    name: McpReadResourceResult
    definition_uri: https://w3id.org/lmodel/mcp/McpReadResourceResult
    description: The result returned by the server for a {@link ReadResourceRequestresources/read}
      request.
    in_subset:
    - resources_read
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:ReadResourceResult
    is_a: McpCacheableResult
    slots:
    - mcpReadResourceResult__meta
    - mcpReadResourceResult__cache_scope
    - mcpReadResourceResult__contents
    - mcpReadResourceResult__result_type
    - mcpReadResourceResult__ttl_ms
    attributes:
      meta:
        name: meta
        description: Extends {@link MetaObject} with additional result-specific fields.
          All key naming rules from `MetaObject` apply.
        alias: _meta
        range: McpResultMetaObject
      cache_scope:
        name: cache_scope
        description: "Indicates the intended scope of the cached response, analogous\
          \ to HTTP\n`Cache-Control: public` vs `Cache-Control: private`.\n\n- `\"\
          public\"`: The response does not contain user-specific data. Any\n  client\
          \ or intermediary (e.g., shared gateway, caching proxy) MAY cache\n  the\
          \ response and serve it across authorization contexts.\n- `\"private\"`:\
          \ The response MAY be cached and reused only within the\n  same authorization\
          \ context. Caches MUST NOT be shared across\n  authorization contexts (e.g.,\
          \ a different access token requires a\n  different cache)."
        alias: cacheScope
        range: McpCacheScope
        required: true
      contents:
        name: contents
        description: The contents of the resource that was read.
        required: true
        multivalued: true
        inlined_as_list: true
        any_of:
        - range: McpTextResourceContents
        - range: McpBlobResourceContents
      result_type:
        name: result_type
        description: 'Indicates the type of the result, which allows the client to
          determine

          how to parse the result object.


          Servers implementing this protocol version MUST include this field.

          For backward compatibility, when a client receives a result from a

          server implementing an earlier protocol version (which does not include

          `resultType`), the client MUST treat the absent field as `"complete"`.'
        alias: resultType
        required: true
      ttl_ms:
        name: ttl_ms
        description: "A hint from the server indicating how long (in milliseconds)\
          \ the\nclient MAY cache this response before re-fetching. Semantics are\n\
          analogous to HTTP Cache-Control max-age.\n\n- If 0, The response SHOULD\
          \ be considered immediately stale,\n  The client MAY re-fetch every time\
          \ the result is needed.\n- If positive, the client SHOULD consider the result\
          \ fresh for this many\n  milliseconds after receiving the response."
        alias: ttlMs
        range: integer
        required: true
        minimum_value: 0
    class_uri: mcp:McpReadResourceResult
    extra_slots:
      allowed: true
