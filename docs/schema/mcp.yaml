    class_uri: mcp:McpContentBlock
    extra_slots:
      allowed: true
    any_of:
    - is_a: McpTextContent
    - is_a: McpImageContent
    - is_a: McpAudioContent
    - is_a: McpResourceLink
    - is_a: McpEmbeddedResource
  McpCreateMessageRequest:
    name: McpCreateMessageRequest
    definition_uri: https://w3id.org/lmodel/mcp/McpCreateMessageRequest
    description: A request from the server to sample an LLM via the client. The client
      has full discretion over which model to select. The client should also inform
      the user before beginning sampling, to allow them to inspect the request (human
      in the loop) and decide whether to approve it.
    in_subset:
    - sampling_createmessage
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:CreateMessageRequest
    slots:
    - mcpCreateMessageRequest__method
    - mcpCreateMessageRequest__params
    attributes:
      method:
        name: method
        description: The method's name, always `sampling/createMessage`.
        required: true
        equals_string: sampling/createMessage
      params:
        name: params
        description: Parameters for a `sampling/createMessage` request.
        range: McpCreateMessageRequestParams
        required: true
    class_uri: mcp:McpCreateMessageRequest
    extra_slots:
      allowed: true
  McpCreateMessageRequestParams:
    name: McpCreateMessageRequestParams
    definition_uri: https://w3id.org/lmodel/mcp/McpCreateMessageRequestParams
    description: Parameters for a `sampling/createMessage` request.
    in_subset:
    - sampling_createmessage
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:CreateMessageRequestParams
    slots:
    - mcpCreateMessageRequestParams__include_context
    - mcpCreateMessageRequestParams__max_tokens
    - mcpCreateMessageRequestParams__messages
    - mcpCreateMessageRequestParams__metadata
    - mcpCreateMessageRequestParams__model_preferences
    - mcpCreateMessageRequestParams__stop_sequences
    - mcpCreateMessageRequestParams__system_prompt
    - mcpCreateMessageRequestParams__temperature
    - mcpCreateMessageRequestParams__tool_choice
    - mcpCreateMessageRequestParams__tools
    attributes:
      include_context:
        name: include_context
        description: 'A request to include context from one or more MCP servers (including
          the caller), to be attached to the prompt.

          The client MAY ignore this request.


          Default is `"none"`. The values `"thisServer"` and `"allServers"` are deprecated
          (SEP-2596): servers SHOULD

          omit this field or use `"none"`, and SHOULD only use the deprecated values
          if the client declares

          {@link ClientCapabilities.sampling.context}.'
        alias: includeContext
        range: McpCreateMessageRequestParamsIncludeContext
      max_tokens:
        name: max_tokens
        description: 'The requested maximum number of tokens to sample (to prevent
          runaway completions).


          The client MAY choose to sample fewer tokens than the requested maximum.'
        alias: maxTokens
        range: integer
        required: true
      messages:
        name: messages
        description: Describes a message issued to or received from an LLM API.
        range: McpSamplingMessage
        required: true
        multivalued: true
        inlined_as_list: true
      metadata:
        name: metadata
        description: Optional metadata to pass through to the LLM provider. The format
          of this metadata is provider-specific.
        range: McpJSONObject
      model_preferences:
        name: model_preferences
        description: The server's preferences for which model to select. The client
          MAY ignore these preferences.
        alias: modelPreferences
        range: McpModelPreferences
      stop_sequences:
        name: stop_sequences
        description: Sequences at which the model should stop generating.
        alias: stopSequences
        multivalued: true
      system_prompt:
        name: system_prompt
        description: An optional system prompt the server wants to use for sampling.
          The client MAY modify or omit this prompt.
        alias: systemPrompt
      temperature:
        name: temperature
        description: The sampling temperature the server asks the model to use.
        range: float
      tool_choice:
        name: tool_choice
        description: 'Controls how the model uses tools.

          The client MUST return an error if this field is provided but {@link ClientCapabilities.sampling.tools}
          is not declared.

          Default is `{ mode: "auto" }`.'
        alias: toolChoice
        range: McpToolChoice
      tools:
        name: tools
        description: 'Tools that the model may use during generation.

          The client MUST return an error if this field is provided but {@link ClientCapabilities.sampling.tools}
          is not declared.'
        range: McpTool
        multivalued: true
        inlined_as_list: true
    class_uri: mcp:McpCreateMessageRequestParams
    extra_slots:
      allowed: true
  McpCreateMessageResult:
    name: McpCreateMessageResult
    definition_uri: https://w3id.org/lmodel/mcp/McpCreateMessageResult
    description: 'The result returned by the client for a {@link CreateMessageRequestsampling/createMessage}
      request.

      The client should inform the user before returning the sampled message, to allow
      them

      to inspect the response (human in the loop) and decide whether to allow the
      server to see it.'
    in_subset:
    - sampling_createmessage
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:CreateMessageResult
    is_a: McpSamplingMessage
    slots:
    - mcpCreateMessageResult__meta
    - mcpCreateMessageResult__content
    - mcpCreateMessageResult__model
    - mcpCreateMessageResult__role
    - mcpCreateMessageResult__stop_reason
    attributes:
      meta:
        name: meta
        description: "Represents the contents of a `_meta` field, which clients and\
          \ servers use to attach additional metadata to their interactions.\n\nCertain\
          \ key names are reserved by MCP for protocol-level metadata; implementations\
          \ MUST NOT make assumptions about values at these keys. Additionally, specific\
          \ schema definitions may reserve particular names for purpose-specific metadata,\
          \ as declared in those definitions.\n\nValid keys have two segments:\n\n\
          **Prefix:**\n- Optional \u2014 if specified, MUST be a series of _labels_\
          \ separated by dots (`.`), followed by a slash (`/`).\n- Labels MUST start\
          \ with a letter and end with a letter or digit. Interior characters may\
          \ be letters, digits, or hyphens (`-`).\n- Implementations SHOULD use reverse\
          \ DNS notation (e.g., `com.example/` rather than `example.com/`).\n- Any\
          \ prefix where the second label is `modelcontextprotocol` or `mcp` is **reserved**\
          \ for MCP use. For example: `io.modelcontextprotocol/`, `dev.mcp/`, `org.modelcontextprotocol.api/`,\
          \ and `com.mcp.tools/` are all reserved. However, `com.example.mcp/` is\
          \ NOT reserved, as the second label is `example`.\n\n**Name:**\n- Unless\
          \ empty, MUST start and end with an alphanumeric character (`[a-z0-9A-Z]`).\n\
          - Interior characters may be alphanumeric, hyphens (`-`), underscores (`_`),\
          \ or dots (`.`)."
        alias: _meta
        range: McpMetaObject
      content:
        name: content
        description: The content the message carries.
        required: true
        any_of:
        - range: McpTextContent
        - range: McpImageContent
        - range: McpAudioContent
        - range: McpToolUseContent
        - range: McpToolResultContent
        - range: McpSamplingMessageContentBlock
          multivalued: true
          inlined_as_list: true
      model:
        name: model
        description: The name of the model that generated the message.
        required: true
      role:
        name: role
        description: The sender or recipient of messages and data in a conversation.
        range: McpRole
        required: true
      stop_reason:
        name: stop_reason
        description: 'The reason why sampling stopped, if known.


          Standard values:

          - `"endTurn"`: Natural end of the assistant''s turn

          - `"stopSequence"`: A stop sequence was encountered

          - `"maxTokens"`: Maximum token limit was reached

          - `"toolUse"`: The model wants to use one or more tools


          This field is an open string to allow for provider-specific stop reasons.'
        alias: stopReason
    class_uri: mcp:McpCreateMessageResult
    extra_slots:
      allowed: true
  McpDiscoverRequest:
    name: McpDiscoverRequest
    definition_uri: https://w3id.org/lmodel/mcp/McpDiscoverRequest
    description: "A request from the client asking the server to advertise its supported\n\
      protocol versions, capabilities, and other metadata. Servers **MUST**\nimplement\
      \ `server/discover`. Clients **MAY** call it but are not required\nto \u2014\
      \ version negotiation can also happen inline via per-request `_meta`."
    in_subset:
    - server_discover
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:DiscoverRequest
    is_a: McpJSONRPCRequest
    slots:
    - mcpDiscoverRequest__identifier
    - mcpDiscoverRequest__jsonrpc
    - mcpDiscoverRequest__method
    - mcpDiscoverRequest__params
    attributes:
      identifier:
        name: identifier
        description: A uniquely identifying ID for a request in JSON-RPC.
        aliases:
        - id
        required: true
        any_of:
        - range: string
        - range: integer
      jsonrpc:
        name: jsonrpc
        description: The JSON-RPC version, always `2.0`.
        required: true
        equals_string: '2.0'
      method:
        name: method
        description: The method's name, always `server/discover`.
        required: true
        equals_string: server/discover
      params:
        name: params
        description: Common params for any request.
        range: McpRequestParams
        required: true
    class_uri: mcp:McpDiscoverRequest
    extra_slots:
      allowed: true
  McpDiscoverResult:
    name: McpDiscoverResult
    definition_uri: https://w3id.org/lmodel/mcp/McpDiscoverResult
    description: The result returned by the server for a {@link DiscoverRequestserver/discover}
      request.
    in_subset:
    - server_discover
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:DiscoverResult
    is_a: McpCacheableResult
    slots:
    - mcpDiscoverResult__meta
    - mcpDiscoverResult__cache_scope
    - mcpDiscoverResult__capabilities
    - mcpDiscoverResult__instructions
    - mcpDiscoverResult__result_type
    - mcpDiscoverResult__supported_versions
    - mcpDiscoverResult__ttl_ms
    attributes:
      meta:
        name: meta
        description: Extends {@link MetaObject} with additional result-specific fields.
          All key naming rules from `MetaObject` apply.
        alias: _meta
        range: McpResultMetaObject
      cache_scope:
        name: cache_scope
        description: "Indicates the intended scope of the cached response, analogous\
          \ to HTTP\n`Cache-Control: public` vs `Cache-Control: private`.\n\n- `\"\
          public\"`: The response does not contain user-specific data. Any\n  client\
          \ or intermediary (e.g., shared gateway, caching proxy) MAY cache\n  the\
          \ response and serve it across authorization contexts.\n- `\"private\"`:\
          \ The response MAY be cached and reused only within the\n  same authorization\
          \ context. Caches MUST NOT be shared across\n  authorization contexts (e.g.,\
          \ a different access token requires a\n  different cache)."
        alias: cacheScope
        range: McpCacheScope
        required: true
      capabilities:
        name: capabilities
        description: The capabilities of the server.
        range: McpServerCapabilities
        required: true
      instructions:
        name: instructions
        description: 'Natural-language guidance describing the server and its features.


          This can be used by clients to improve an LLM''s understanding of

          available tools (e.g., by including it in a system prompt). It should

          focus on information that helps the model use the server effectively

          and should not duplicate information already in tool descriptions.'
      result_type:
        name: result_type
        description: 'Indicates the type of the result, which allows the client to
          determine

          how to parse the result object.


          Servers implementing this protocol version MUST include this field.

          For backward compatibility, when a client receives a result from a

          server implementing an earlier protocol version (which does not include

          `resultType`), the client MUST treat the absent field as `"complete"`.'
        alias: resultType
        required: true
      supported_versions:
        name: supported_versions
        description: 'MCP Protocol Versions this server supports. The client should
          choose a

          version from this list for use in subsequent requests.'
        alias: supportedVersions
        required: true
        multivalued: true
      ttl_ms:
        name: ttl_ms
        description: "A hint from the server indicating how long (in milliseconds)\
          \ the\nclient MAY cache this response before re-fetching. Semantics are\n\
          analogous to HTTP Cache-Control max-age.\n\n- If 0, The response SHOULD\
          \ be considered immediately stale,\n  The client MAY re-fetch every time\
          \ the result is needed.\n- If positive, the client SHOULD consider the result\
          \ fresh for this many\n  milliseconds after receiving the response."
        alias: ttlMs
        range: integer
        required: true
        minimum_value: 0
    class_uri: mcp:McpDiscoverResult
    extra_slots:
      allowed: true
  McpDiscoverResultResponse:
    name: McpDiscoverResultResponse
    definition_uri: https://w3id.org/lmodel/mcp/McpDiscoverResultResponse
    description: A successful response from the server for a {@link DiscoverRequestserver/discover}
      request.
    in_subset:
    - server_discover
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:DiscoverResultResponse
    is_a: McpJSONRPCResultResponse
    slots:
    - mcpDiscoverResultResponse__identifier
    - mcpDiscoverResultResponse__jsonrpc
    - mcpDiscoverResultResponse__result
    attributes:
      identifier:
        name: identifier
        description: A uniquely identifying ID for a request in JSON-RPC.
        aliases:
        - id
        required: true
        any_of:
        - range: string
        - range: integer
      jsonrpc:
        name: jsonrpc
        description: The JSON-RPC version, always `2.0`.
        required: true
        equals_string: '2.0'
      result:
        name: result
        description: The result returned by the server for a {@link DiscoverRequestserver/discover}
          request.
        range: McpDiscoverResult
        required: true
    class_uri: mcp:McpDiscoverResultResponse
    extra_slots:
      allowed: true
  McpElicitRequest:
    name: McpElicitRequest
    definition_uri: https://w3id.org/lmodel/mcp/McpElicitRequest
    description: A request from the server to elicit additional information from the
      user via the client.
    in_subset:
    - elicitation_create
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:ElicitRequest
    slots:
    - mcpElicitRequest__method
    - mcpElicitRequest__params
    attributes:
      method:
        name: method
        description: The method's name, always `elicitation/create`.
        required: true
        equals_string: elicitation/create
      params:
        name: params
        description: The parameters for a request to elicit additional information
          from the user via the client.
        range: McpElicitRequestParams
        required: true
    class_uri: mcp:McpElicitRequest
    extra_slots:
      allowed: true
  McpElicitRequestFormParams:
    name: McpElicitRequestFormParams
    definition_uri: https://w3id.org/lmodel/mcp/McpElicitRequestFormParams
    description: The parameters for a request to elicit non-sensitive information
      from the user via a form in the client.
    in_subset:
    - elicitation_create
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:ElicitRequestFormParams
    slots:
    - mcpElicitRequestFormParams__message
    - mcpElicitRequestFormParams__mode
    - mcpElicitRequestFormParams__requested_schema
    attributes:
      message:
        name: message
        description: The message to present to the user describing what information
          is being requested.
        required: true
      mode:
        name: mode
        description: The elicitation mode.
        equals_string: form
      requested_schema:
        name: requested_schema
        description: 'A restricted subset of JSON Schema.

          Only top-level properties are allowed, without nesting.'
        alias: requestedSchema
        range: McpElicitRequestFormParamsRequestedSchema
        required: true
    class_uri: mcp:McpElicitRequestFormParams
    extra_slots:
      allowed: true
  McpElicitRequestFormParamsRequestedSchema:
    name: McpElicitRequestFormParamsRequestedSchema
    definition_uri: https://w3id.org/lmodel/mcp/McpElicitRequestFormParamsRequestedSchema
    description: 'A restricted subset of JSON Schema.

      Only top-level properties are allowed, without nesting.'
    in_subset:
    - elicitation_create
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:ElicitRequestFormParams/properties/requestedSchema
    slots:
    - mcpElicitRequestFormParamsRequestedSchema__schema_dialect
    - mcpElicitRequestFormParamsRequestedSchema__properties
    - mcpElicitRequestFormParamsRequestedSchema__required_names
    - mcpElicitRequestFormParamsRequestedSchema__kind
    attributes:
      schema_dialect:
        name: schema_dialect
        description: The JSON Schema dialect the schema is written in.
        aliases:
        - $schema
      properties:
        name: properties
        description: The fields of the form, by name.
        range: McpElicitRequestFormParamsRequestedSchemaProperties
        required: true
      required_names:
        name: required_names
        description: The names of the fields the user must fill in.
        aliases:
        - required
        multivalued: true
      kind:
        name: kind
        description: The kind of object, always `object`.
        aliases:
        - type
        required: true
        equals_string: object
    class_uri: mcp:McpElicitRequestFormParamsRequestedSchema
    extra_slots:
      allowed: true
  McpElicitRequestFormParamsRequestedSchemaProperties:
    name: McpElicitRequestFormParamsRequestedSchemaProperties
    definition_uri: https://w3id.org/lmodel/mcp/McpElicitRequestFormParamsRequestedSchemaProperties
    description: The object MCP's `ElicitRequestFormParams` holds under `properties`.
    in_subset:
    - elicitation_create
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:ElicitRequestFormParams/properties/requestedSchema/properties/properties
    class_uri: mcp:McpElicitRequestFormParamsRequestedSchemaProperties
    extra_slots:
      range_expression:
        range: McpPrimitiveSchemaDefinition
  McpElicitRequestParams:
    name: McpElicitRequestParams
    definition_uri: https://w3id.org/lmodel/mcp/McpElicitRequestParams
    description: The parameters for a request to elicit additional information from
      the user via the client.
    in_subset:
    - elicitation_create
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:ElicitRequestParams
    class_uri: mcp:McpElicitRequestParams
    extra_slots:
      allowed: true
    any_of:
    - is_a: McpElicitRequestFormParams
    - is_a: McpElicitRequestURLParams
  McpElicitRequestURLParams:
    name: McpElicitRequestURLParams
    definition_uri: https://w3id.org/lmodel/mcp/McpElicitRequestURLParams
    description: The parameters for a request to elicit information from the user
      via a URL in the client.
    in_subset:
    - elicitation_create
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:ElicitRequestURLParams
    slots:
    - McpElicitRequestURLParams_url
    - mcpElicitRequestURLParams__message
    - mcpElicitRequestURLParams__mode
    slot_usage:
      url:
        name: url
        description: The URL that the user should navigate to.
        required: true
    attributes:
      message:
        name: message
        description: The message to present to the user explaining why the interaction
          is needed.
        required: true
      mode:
        name: mode
        description: The elicitation mode.
        required: true
        equals_string: url
    class_uri: mcp:McpElicitRequestURLParams
    extra_slots:
      allowed: true
  McpElicitResult:
    name: McpElicitResult
    definition_uri: https://w3id.org/lmodel/mcp/McpElicitResult
    description: The result returned by the client for an {@link ElicitRequestelicitation/create}
      request.
    in_subset:
    - elicitation_create
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:ElicitResult
    slots:
    - mcpElicitResult__action
    - mcpElicitResult__content
    attributes:
      action:
        name: action
        description: 'The user action in response to the elicitation.

          - `"accept"`: User submitted the form/confirmed the action

          - `"decline"`: User explicitly declined the action

          - `"cancel"`: User dismissed without making an explicit choice'
        range: McpElicitResultAction
        required: true
      content:
        name: content
        description: 'The submitted form data, only present when action is `"accept"`
          and mode was `"form"`.

          Contains values matching the requested schema.

          Omitted for out-of-band mode responses.'
        range: McpElicitResultContent
    class_uri: mcp:McpElicitResult
    extra_slots:
      allowed: true
  McpElicitResultContent:
    name: McpElicitResultContent
    definition_uri: https://w3id.org/lmodel/mcp/McpElicitResultContent
    description: 'The submitted form data, only present when action is `"accept"`
      and mode was `"form"`.

      Contains values matching the requested schema.

      Omitted for out-of-band mode responses.'
    in_subset:
    - elicitation_create
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:ElicitResult/properties/content
    class_uri: mcp:McpElicitResultContent
    extra_slots:
      range_expression:
        any_of:
        - range: string
          multivalued: true
        - range: string
        - range: integer
        - range: boolean
  McpEmbeddedResource:
    name: McpEmbeddedResource
    definition_uri: https://w3id.org/lmodel/mcp/McpEmbeddedResource
    description: 'The contents of a resource, embedded into a prompt or tool call
      result.


      It is up to the client how best to render embedded resources for the benefit

      of the LLM and/or the user.'
    in_subset:
    - content
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:EmbeddedResource
    slots:
    - mcpEmbeddedResource__meta
    - mcpEmbeddedResource__annotations
    - mcpEmbeddedResource__resource_contents
    - mcpEmbeddedResource__kind
    attributes:
      meta:
        name: meta
        description: "Represents the contents of a `_meta` field, which clients and\
          \ servers use to attach additional metadata to their interactions.\n\nCertain\
          \ key names are reserved by MCP for protocol-level metadata; implementations\
          \ MUST NOT make assumptions about values at these keys. Additionally, specific\
          \ schema definitions may reserve particular names for purpose-specific metadata,\
          \ as declared in those definitions.\n\nValid keys have two segments:\n\n\
          **Prefix:**\n- Optional \u2014 if specified, MUST be a series of _labels_\
          \ separated by dots (`.`), followed by a slash (`/`).\n- Labels MUST start\
          \ with a letter and end with a letter or digit. Interior characters may\
          \ be letters, digits, or hyphens (`-`).\n- Implementations SHOULD use reverse\
          \ DNS notation (e.g., `com.example/` rather than `example.com/`).\n- Any\
          \ prefix where the second label is `modelcontextprotocol` or `mcp` is **reserved**\
          \ for MCP use. For example: `io.modelcontextprotocol/`, `dev.mcp/`, `org.modelcontextprotocol.api/`,\
          \ and `com.mcp.tools/` are all reserved. However, `com.example.mcp/` is\
          \ NOT reserved, as the second label is `example`.\n\n**Name:**\n- Unless\
          \ empty, MUST start and end with an alphanumeric character (`[a-z0-9A-Z]`).\n\
          - Interior characters may be alphanumeric, hyphens (`-`), underscores (`_`),\
          \ or dots (`.`)."
        alias: _meta
        range: McpMetaObject
      annotations:
        name: annotations
        description: Optional annotations for the client.
        range: McpAnnotations
      resource_contents:
        name: resource_contents
        description: The resource's contents, as text or as binary data.
        aliases:
        - resource
        required: true
        any_of:
        - range: McpTextResourceContents
        - range: McpBlobResourceContents
      kind:
        name: kind
        description: The kind of object, always `resource`.
        aliases:
        - type
        required: true
        equals_string: resource
    class_uri: mcp:McpEmbeddedResource
    extra_slots:
      allowed: true
  McpEmptyResult:
    name: McpEmptyResult
    definition_uri: https://w3id.org/lmodel/mcp/McpEmptyResult
    description: Common result fields.
    in_subset:
    - common_types
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:EmptyResult
    is_a: McpResult
    slots:
    - mcpResult__meta
    - mcpResult__result_type
    class_uri: mcp:McpEmptyResult
    extra_slots:
      allowed: true
  McpEnumSchema:
    name: McpEnumSchema
    definition_uri: https://w3id.org/lmodel/mcp/McpEnumSchema
    description: One of `UntitledSingleSelectEnumSchema`, `TitledSingleSelectEnumSchema`,
      `UntitledMultiSelectEnumSchema`, `TitledMultiSelectEnumSchema`, `LegacyTitledEnumSchema`.
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:EnumSchema
    class_uri: mcp:McpEnumSchema
    extra_slots:
      allowed: true
    any_of:
    - is_a: McpUntitledSingleSelectEnumSchema
    - is_a: McpTitledSingleSelectEnumSchema
    - is_a: McpUntitledMultiSelectEnumSchema
    - is_a: McpTitledMultiSelectEnumSchema
    - is_a: McpLegacyTitledEnumSchema
  McpError:
    name: McpError
    definition_uri: https://w3id.org/lmodel/mcp/McpError
    description: MCP's `Error`.
    in_subset:
    - errors
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:Error
    slots:
    - mcpError__code
    - mcpError__data
    - mcpError__message
    attributes:
      code:
        name: code
        description: The error type that occurred.
        range: integer
        required: true
      data:
        name: data
        description: Additional information about the error. The value of this member
          is defined by the sender (e.g. detailed error information, nested errors
          etc.).
        range: McpJSONValue
      message:
        name: message
        description: A short description of the error. The message SHOULD be limited
          to a concise single sentence.
        required: true
    class_uri: mcp:McpError
    extra_slots:
      allowed: true
  McpGetPromptRequest:
    name: McpGetPromptRequest
    definition_uri: https://w3id.org/lmodel/mcp/McpGetPromptRequest
    description: Used by the client to get a prompt provided by the server.
    in_subset:
    - prompts_get
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:GetPromptRequest
    is_a: McpJSONRPCRequest
    slots:
    - mcpGetPromptRequest__identifier
    - mcpGetPromptRequest__jsonrpc
    - mcpGetPromptRequest__method
    - mcpGetPromptRequest__params
    attributes:
      identifier:
        name: identifier
        description: A uniquely identifying ID for a request in JSON-RPC.
        aliases:
        - id
        required: true
        any_of:
        - range: string
        - range: integer
      jsonrpc:
        name: jsonrpc
        description: The JSON-RPC version, always `2.0`.
        required: true
        equals_string: '2.0'
      method:
        name: method
        description: The method's name, always `prompts/get`.
        required: true
        equals_string: prompts/get
      params:
        name: params
        description: Parameters for a `prompts/get` request.
        range: McpGetPromptRequestParams
        required: true
    class_uri: mcp:McpGetPromptRequest
    extra_slots:
      allowed: true
  McpGetPromptRequestParams:
    name: McpGetPromptRequestParams
    definition_uri: https://w3id.org/lmodel/mcp/McpGetPromptRequestParams
    description: Parameters for a `prompts/get` request.
    in_subset:
    - prompts_get
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:GetPromptRequestParams
    is_a: McpInputResponseRequestParams
    slots:
    - McpGetPromptRequestParams_name
    - mcpGetPromptRequestParams__meta
    - mcpGetPromptRequestParams__arguments
    - mcpGetPromptRequestParams__input_responses
    - mcpGetPromptRequestParams__request_state
    slot_usage:
      name:
        name: name
        description: The name of the prompt or prompt template.
        required: true
    attributes:
      meta:
        name: meta
        description: Extends {@link MetaObject} with additional request-specific fields.
          All key naming rules from `MetaObject` apply.
        alias: _meta
        range: McpRequestMetaObject
        required: true
      arguments:
        name: arguments
        description: Arguments to use for templating the prompt.
        range: McpGetPromptRequestParamsArguments
      input_responses:
        name: input_responses
        description: 'A map of client responses to server-initiated requests.

          Keys correspond to the keys in the {@link InputRequests} map;

          values are the client''s result for each request.'
        alias: inputResponses
        range: McpInputResponses
      request_state:
        name: request_state
        description: State the server handed out with an input-required result, sent
          back unchanged when the request is retried.
        alias: requestState
    class_uri: mcp:McpGetPromptRequestParams
    extra_slots:
      allowed: true
  McpGetPromptRequestParamsArguments:
    name: McpGetPromptRequestParamsArguments
    definition_uri: https://w3id.org/lmodel/mcp/McpGetPromptRequestParamsArguments
    description: Arguments to use for templating the prompt.
    in_subset:
    - prompts_get
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:GetPromptRequestParams/properties/arguments
    class_uri: mcp:McpGetPromptRequestParamsArguments
    extra_slots:
      range_expression:
        range: string
  McpGetPromptResult:
    name: McpGetPromptResult
    definition_uri: https://w3id.org/lmodel/mcp/McpGetPromptResult
    description: The result returned by the server for a {@link GetPromptRequestprompts/get}
      request.
    in_subset:
    - prompts_get
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:GetPromptResult
    is_a: McpResult
    slots:
    - McpGetPromptResult_description
    - mcpGetPromptResult__meta
    - mcpGetPromptResult__messages
    - mcpGetPromptResult__result_type
    slot_usage:
      description:
        name: description
        description: An optional description for the prompt.
    attributes:
      meta:
        name: meta
        description: Extends {@link MetaObject} with additional result-specific fields.
          All key naming rules from `MetaObject` apply.
        alias: _meta
        range: McpResultMetaObject
      messages:
        name: messages
        description: 'Describes a message returned as part of a prompt.


          This is similar to {@link SamplingMessage}, but also supports the embedding
          of

          resources from the MCP server.'
        range: McpPromptMessage
        required: true
        multivalued: true
        inlined_as_list: true
      result_type:
        name: result_type
        description: 'Indicates the type of the result, which allows the client to
          determine

          how to parse the result object.


          Servers implementing this protocol version MUST include this field.

          For backward compatibility, when a client receives a result from a

          server implementing an earlier protocol version (which does not include

          `resultType`), the client MUST treat the absent field as `"complete"`.'
        alias: resultType
        required: true
    class_uri: mcp:McpGetPromptResult
    extra_slots:
      allowed: true
  McpGetPromptResultResponse:
    name: McpGetPromptResultResponse
    definition_uri: https://w3id.org/lmodel/mcp/McpGetPromptResultResponse
    description: A successful response from the server for a {@link GetPromptRequestprompts/get}
      request.
    in_subset:
    - prompts_get
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:GetPromptResultResponse
    is_a: McpJSONRPCResultResponse
    slots:
    - mcpGetPromptResultResponse__identifier
    - mcpGetPromptResultResponse__jsonrpc
    - mcpGetPromptResultResponse__result
    attributes:
      identifier:
        name: identifier
        description: A uniquely identifying ID for a request in JSON-RPC.
        aliases:
        - id
        required: true
        any_of:
        - range: string
        - range: integer
      jsonrpc:
        name: jsonrpc
        description: The JSON-RPC version, always `2.0`.
        required: true
        equals_string: '2.0'
      result:
        name: result
        description: What the request returned.
        required: true
        any_of:
        - range: McpInputRequiredResult
        - range: McpGetPromptResult
    class_uri: mcp:McpGetPromptResultResponse
    extra_slots:
      allowed: true
  McpHeaderMismatchError:
    name: McpHeaderMismatchError
    definition_uri: https://w3id.org/lmodel/mcp/McpHeaderMismatchError
    description: 'Returned when a server rejects a request because the values in the
      HTTP

      headers do not match the corresponding values in the request body, or

      because required headers are missing or malformed. For HTTP, the response

      status code MUST be `400 Bad Request`.'
    in_subset:
    - errors
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:HeaderMismatchError
    is_a: McpJSONRPCErrorResponse
    slots:
    - mcpHeaderMismatchError__error
    - mcpHeaderMismatchError__identifier
    - mcpHeaderMismatchError__jsonrpc
    attributes:
      error:
        name: error
        description: The error the request ended with.
        range: McpHeaderMismatchErrorError
        required: true
      identifier:
        name: identifier
        description: A uniquely identifying ID for a request in JSON-RPC.
        aliases:
        - id
        any_of:
        - range: string
        - range: integer
      jsonrpc:
        name: jsonrpc
        description: The JSON-RPC version, always `2.0`.
        required: true
        equals_string: '2.0'
    class_uri: mcp:McpHeaderMismatchError
    extra_slots:
      allowed: true
  McpHeaderMismatchErrorError:
    name: McpHeaderMismatchErrorError
    definition_uri: https://w3id.org/lmodel/mcp/McpHeaderMismatchErrorError
    description: MCP's `Error`, with the code and data this error carries.
    in_subset:
    - errors
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:HeaderMismatchError/properties/error/allOf/1
    is_a: McpError
    slots:
    - mcpError__data
    - mcpError__message
    - mcpHeaderMismatchErrorError__code
    attributes:
      code:
        name: code
        description: The error code, always `-32020`.
        range: integer
        required: true
        equals_number: -32020
    class_uri: mcp:McpHeaderMismatchErrorError
    extra_slots:
      allowed: true
  McpIcon:
    name: McpIcon
    definition_uri: https://w3id.org/lmodel/mcp/McpIcon
    description: An optionally-sized icon that can be displayed in a user interface.
    in_subset:
    - common_types
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:Icon
    slots:
    - mcpIcon__mime_type
    - mcpIcon__sizes
    - mcpIcon__src
    - mcpIcon__theme
    attributes:
      mime_type:
        name: mime_type
        description: 'Optional MIME type override if the source MIME type is missing
          or generic.

          For example: `"image/png"`, `"image/jpeg"`, or `"image/svg+xml"`.'
        alias: mimeType
      sizes:
        name: sizes
        description: 'Optional array of strings that specify sizes at which the icon
          can be used.

          Each string should be in WxH format (e.g., `"48x48"`, `"96x96"`) or `"any"`
          for scalable formats like SVG.


          If not provided, the client should assume that the icon can be used at any
          size.'
        multivalued: true
      src:
        name: src
        description: 'A standard URI pointing to an icon resource. May be an HTTP/HTTPS
          URL or a

          `data:` URI with Base64-encoded image data.


          Consumers SHOULD take steps to ensure URLs serving icons are from the

          same domain as the client/server or a trusted domain.


          Consumers SHOULD take appropriate precautions when consuming SVGs as they
          can contain

          executable JavaScript.'
        range: uri
        required: true
      theme:
        name: theme
        description: 'Optional specifier for the theme this icon is designed for.
          `"light"` indicates

          the icon is designed to be used with a light background, and `"dark"` indicates

          the icon is designed to be used with a dark background.


          If not provided, the client should assume the icon can be used with any
          theme.'
        range: McpIconTheme
    class_uri: mcp:McpIcon
    extra_slots:
      allowed: true
  McpIcons:
    name: McpIcons
    definition_uri: https://w3id.org/lmodel/mcp/McpIcons
    description: Base interface to add `icons` property.
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:Icons
    slots:
    - mcpIcons__icons
    attributes:
      icons:
        name: icons
        description: 'Optional set of sized icons that the client can display in a
          user interface.


          Clients that support rendering icons MUST support at least the following
          MIME types:

          - `image/png` - PNG images (safe, universal compatibility)

          - `image/jpeg` (and `image/jpg`) - JPEG images (safe, universal compatibility)


          Clients that support rendering icons SHOULD also support:

          - `image/svg+xml` - SVG images (scalable but requires security precautions)

          - `image/webp` - WebP images (modern, efficient format)'
        range: McpIcon
        multivalued: true
        inlined_as_list: true
    class_uri: mcp:McpIcons
    extra_slots:
      allowed: true
  McpImageContent:
    name: McpImageContent
    definition_uri: https://w3id.org/lmodel/mcp/McpImageContent
    description: An image provided to or from an LLM.
    in_subset:
    - content
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:ImageContent
    slots:
    - mcpImageContent__meta
    - mcpImageContent__annotations
    - mcpImageContent__data
    - mcpImageContent__mime_type
    - mcpImageContent__kind
    attributes:
      meta:
        name: meta
        description: "Represents the contents of a `_meta` field, which clients and\
          \ servers use to attach additional metadata to their interactions.\n\nCertain\
          \ key names are reserved by MCP for protocol-level metadata; implementations\
          \ MUST NOT make assumptions about values at these keys. Additionally, specific\
          \ schema definitions may reserve particular names for purpose-specific metadata,\
          \ as declared in those definitions.\n\nValid keys have two segments:\n\n\
          **Prefix:**\n- Optional \u2014 if specified, MUST be a series of _labels_\
          \ separated by dots (`.`), followed by a slash (`/`).\n- Labels MUST start\
          \ with a letter and end with a letter or digit. Interior characters may\
          \ be letters, digits, or hyphens (`-`).\n- Implementations SHOULD use reverse\
          \ DNS notation (e.g., `com.example/` rather than `example.com/`).\n- Any\
          \ prefix where the second label is `modelcontextprotocol` or `mcp` is **reserved**\
          \ for MCP use. For example: `io.modelcontextprotocol/`, `dev.mcp/`, `org.modelcontextprotocol.api/`,\
          \ and `com.mcp.tools/` are all reserved. However, `com.example.mcp/` is\
          \ NOT reserved, as the second label is `example`.\n\n**Name:**\n- Unless\
          \ empty, MUST start and end with an alphanumeric character (`[a-z0-9A-Z]`).\n\
          - Interior characters may be alphanumeric, hyphens (`-`), underscores (`_`),\
          \ or dots (`.`)."
        alias: _meta
        range: McpMetaObject
      annotations:
        name: annotations
        description: Optional annotations for the client.
        range: McpAnnotations
      data:
        name: data
        description: The base64-encoded image data.
        range: McpBase64
        required: true
      mime_type:
        name: mime_type
        description: The MIME type of the image. Different providers may support different
          image types.
        alias: mimeType
        required: true
      kind:
        name: kind
        description: The kind of object, always `image`.
        aliases:
        - type
        required: true
        equals_string: image
    class_uri: mcp:McpImageContent
    extra_slots:
      allowed: true
  McpImplementation:
    name: McpImplementation
    definition_uri: https://w3id.org/lmodel/mcp/McpImplementation
    description: Describes the MCP implementation.
    in_subset:
    - server_discover
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:Implementation
    is_a: McpBaseMetadata
    mixins:
    - McpIcons
    slots:
    - McpImplementation_description
    - McpImplementation_name
    - McpImplementation_title
    - McpImplementation_version
    - mcpImplementation__icons
    - mcpImplementation__website_url
    slot_usage:
      description:
        name: description
        description: 'An optional human-readable description of what this implementation
          does.


          This can be used by clients or servers to provide context about their purpose

          and capabilities. For example, a server might describe the types of resources

          or tools it provides, while a client might describe its intended use case.'
      name:
        name: name
        description: Intended for programmatic or logical use, but used as a display
          name in past specs or fallback (if title isn't present).
        required: true
      title:
        name: title
        description: "Intended for UI and end-user contexts \u2014 optimized to be\
          \ human-readable and easily understood,\neven by those unfamiliar with domain-specific\
          \ terminology.\n\nIf not provided, the name should be used for display (except\
          \ for {@link Tool},\nwhere `annotations.title` should be given precedence\
          \ over using `name`,\nif present)."
      version:
        name: version
        description: The version of this implementation.
        required: true
    attributes:
      icons:
        name: icons
        description: 'Optional set of sized icons that the client can display in a
          user interface.


          Clients that support rendering icons MUST support at least the following
          MIME types:

          - `image/png` - PNG images (safe, universal compatibility)

          - `image/jpeg` (and `image/jpg`) - JPEG images (safe, universal compatibility)


          Clients that support rendering icons SHOULD also support:

          - `image/svg+xml` - SVG images (scalable but requires security precautions)

          - `image/webp` - WebP images (modern, efficient format)'
        range: McpIcon
        multivalued: true
        inlined_as_list: true
      website_url:
        name: website_url
        description: An optional URL of the website for this implementation.
        alias: websiteUrl
        range: uri
    class_uri: mcp:McpImplementation
    extra_slots:
      allowed: true
  McpInputRequest:
    name: McpInputRequest
    definition_uri: https://w3id.org/lmodel/mcp/McpInputRequest
    description: One of `CreateMessageRequest`, `ListRootsRequest`, `ElicitRequest`.
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:InputRequest
    class_uri: mcp:McpInputRequest
    extra_slots:
      allowed: true
    any_of:
    - is_a: McpCreateMessageRequest
    - is_a: McpListRootsRequest
    - is_a: McpElicitRequest
  McpInputRequests:
    name: McpInputRequests
    definition_uri: https://w3id.org/lmodel/mcp/McpInputRequests
    description: 'A map of server-initiated requests that the client must fulfill.

      Keys are server-assigned identifiers; values are the request objects.'
    in_subset:
    - multi_round_trip
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:InputRequests
    class_uri: mcp:McpInputRequests
    extra_slots:
      range_expression:
        range: McpInputRequest
  McpInputRequiredResult:
    name: McpInputRequiredResult
    definition_uri: https://w3id.org/lmodel/mcp/McpInputRequiredResult
    description: 'An InputRequiredResult sent by the server to indicate that additional
      input is needed

      before the request can be completed.


      At least one of `inputRequests` or `requestState` MUST be present.'
    in_subset:
    - multi_round_trip
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:InputRequiredResult
    is_a: McpResult
    slots:
    - mcpInputRequiredResult__meta
    - mcpInputRequiredResult__input_requests
    - mcpInputRequiredResult__request_state
    - mcpInputRequiredResult__result_type
    attributes:
      meta:
        name: meta
        description: Extends {@link MetaObject} with additional result-specific fields.
          All key naming rules from `MetaObject` apply.
        alias: _meta
        range: McpResultMetaObject
      input_requests:
        name: input_requests
        description: 'A map of server-initiated requests that the client must fulfill.

          Keys are server-assigned identifiers; values are the request objects.'
        alias: inputRequests
        range: McpInputRequests
      request_state:
        name: request_state
        description: State for the client to send back unchanged when it retries the
          request.
        alias: requestState
      result_type:
        name: result_type
        description: 'Indicates the type of the result, which allows the client to
          determine

          how to parse the result object.


          Servers implementing this protocol version MUST include this field.

          For backward compatibility, when a client receives a result from a

          server implementing an earlier protocol version (which does not include

          `resultType`), the client MUST treat the absent field as `"complete"`.'
        alias: resultType
        required: true
    class_uri: mcp:McpInputRequiredResult
    extra_slots:
      allowed: true
  McpInputResponse:
    name: McpInputResponse
    definition_uri: https://w3id.org/lmodel/mcp/McpInputResponse
    description: One of `CreateMessageResult`, `ListRootsResult`, `ElicitResult`.
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:InputResponse
    class_uri: mcp:McpInputResponse
    extra_slots:
      allowed: true
    any_of:
    - is_a: McpCreateMessageResult
    - is_a: McpListRootsResult
    - is_a: McpElicitResult
  McpInputResponseRequestParams:
    name: McpInputResponseRequestParams
    definition_uri: https://w3id.org/lmodel/mcp/McpInputResponseRequestParams
    description: MCP's `InputResponseRequestParams`.
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:InputResponseRequestParams
    is_a: McpRequestParams
    slots:
    - mcpInputResponseRequestParams__meta
    - mcpInputResponseRequestParams__input_responses
    - mcpInputResponseRequestParams__request_state
    attributes:
      meta:
        name: meta
        description: Extends {@link MetaObject} with additional request-specific fields.
          All key naming rules from `MetaObject` apply.
        alias: _meta
        range: McpRequestMetaObject
        required: true
      input_responses:
        name: input_responses
        description: 'A map of client responses to server-initiated requests.

          Keys correspond to the keys in the {@link InputRequests} map;

          values are the client''s result for each request.'
        alias: inputResponses
        range: McpInputResponses
      request_state:
        name: request_state
        description: State the server handed out with an input-required result, sent
          back unchanged when the request is retried.
        alias: requestState
    class_uri: mcp:McpInputResponseRequestParams
    extra_slots:
      allowed: true
  McpInputResponses:
    name: McpInputResponses
    definition_uri: https://w3id.org/lmodel/mcp/McpInputResponses
    description: 'A map of client responses to server-initiated requests.

      Keys correspond to the keys in the {@link InputRequests} map;

      values are the client''s result for each request.'
    in_subset:
    - multi_round_trip
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:InputResponses
    class_uri: mcp:McpInputResponses
    extra_slots:
      range_expression:
        range: McpInputResponse
  McpInternalError:
    name: McpInternalError
    definition_uri: https://w3id.org/lmodel/mcp/McpInternalError
    description: A JSON-RPC error indicating that an internal error occurred on the
      receiver. This error is returned when the receiver encounters an unexpected
      condition that prevents it from fulfilling the request.
    in_subset:
    - errors
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:InternalError
    is_a: McpError
    slots:
    - mcpInternalError__code
    - mcpInternalError__data
    - mcpInternalError__message
    attributes:
      code:
        name: code
        description: The error type that occurred.
        range: integer
        required: true
        equals_number: -32603
      data:
        name: data
        description: Additional information about the error. The value of this member
          is defined by the sender (e.g. detailed error information, nested errors
          etc.).
        range: McpJSONValue
      message:
        name: message
        description: A short description of the error. The message SHOULD be limited
          to a concise single sentence.
        required: true
    class_uri: mcp:McpInternalError
    extra_slots:
      allowed: true
  McpInvalidParamsError:
    name: McpInvalidParamsError
    definition_uri: https://w3id.org/lmodel/mcp/McpInvalidParamsError
    description: 'A JSON-RPC error indicating that the method parameters are invalid
      or malformed.


      In MCP, this error is returned in various contexts when request parameters fail
      validation:


      - **Tools**: Unknown tool name or invalid tool arguments

      - **Prompts**: Unknown prompt name or missing required arguments

      - **Pagination**: Invalid or expired cursor values

      - **Logging**: Invalid log level

      - **Elicitation**: Server requests an elicitation mode not declared in client
      capabilities

      - **Sampling**: Missing tool result or tool results mixed with other content'
    in_subset:
    - errors
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:InvalidParamsError
    is_a: McpError
    slots:
    - mcpInvalidParamsError__code
    - mcpInvalidParamsError__data
    - mcpInvalidParamsError__message
    attributes:
      code:
        name: code
        description: The error type that occurred.
        range: integer
        required: true
        equals_number: -32602
      data:
        name: data
        description: Additional information about the error. The value of this member
          is defined by the sender (e.g. detailed error information, nested errors
          etc.).
        range: McpJSONValue
      message:
        name: message
        description: A short description of the error. The message SHOULD be limited
          to a concise single sentence.
        required: true
    class_uri: mcp:McpInvalidParamsError
    extra_slots:
      allowed: true
  McpInvalidRequestError:
    name: McpInvalidRequestError
    definition_uri: https://w3id.org/lmodel/mcp/McpInvalidRequestError
    description: A JSON-RPC error indicating that the request is not a valid request
      object. This error is returned when the message structure does not conform to
      the JSON-RPC 2.0 specification requirements for a request (e.g., missing required
      fields like `jsonrpc` or `method`, or using invalid types for these fields).
    in_subset:
    - errors
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:InvalidRequestError
    is_a: McpError
    slots:
    - mcpInvalidRequestError__code
    - mcpInvalidRequestError__data
    - mcpInvalidRequestError__message
    attributes:
      code:
        name: code
        description: The error type that occurred.
        range: integer
        required: true
        equals_number: -32600
      data:
        name: data
        description: Additional information about the error. The value of this member
          is defined by the sender (e.g. detailed error information, nested errors
          etc.).
        range: McpJSONValue
      message:
        name: message
        description: A short description of the error. The message SHOULD be limited
          to a concise single sentence.
        required: true
    class_uri: mcp:McpInvalidRequestError
    extra_slots:
      allowed: true
  McpJSONObject:
    name: McpJSONObject
    definition_uri: https://w3id.org/lmodel/mcp/McpJSONObject
    description: A JSON object, whose values are JSON values.
    in_subset:
