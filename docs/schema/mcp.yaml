types:
  McpBase64:
    name: McpBase64
    definition_uri: https://w3id.org/lmodel/mcp/McpBase64
    description: Binary data, written as base64 text.
    comments:
    - MCP gives such a string the format byte.
    from_schema: https://w3id.org/lmodel/mcp
    typeof: string
    base: str
    uri: xsd:base64Binary
  McpCursor:
    name: McpCursor
    definition_uri: https://w3id.org/lmodel/mcp/McpCursor
    description: An opaque token used to represent a cursor for pagination.
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:Cursor
    typeof: string
    base: str
    uri: xsd:string
  McpProgressToken:
    name: McpProgressToken
    definition_uri: https://w3id.org/lmodel/mcp/McpProgressToken
    description: A progress token, used to associate progress notifications with the
      original request.
    comments:
    - linkml 1.12.1's JSON Schema generator reads a type's typeof and not its union_of,
      so each slot that takes this value states the union in its own any_of.
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:ProgressToken
    typeof: string
    base: str
    uri: xsd:string
    union_of:
    - string
    - integer
  McpRequestId:
    name: McpRequestId
    definition_uri: https://w3id.org/lmodel/mcp/McpRequestId
    description: A uniquely identifying ID for a request in JSON-RPC.
    comments:
    - linkml 1.12.1's JSON Schema generator reads a type's typeof and not its union_of,
      so each slot that takes this value states the union in its own any_of.
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:RequestId
    typeof: string
    base: str
    uri: xsd:string
    union_of:
    - string
    - integer
  McpResultType:
    name: McpResultType
    definition_uri: https://w3id.org/lmodel/mcp/McpResultType
    description: 'Indicates the type of a {@link Result} object, allowing the client
      to

      determine how to parse the response.


      complete - the request completed successfully and the result contains the final
      content.

      input_required - the request requires additional input and the result contains
      an {@link InputRequiredResult} object with instructions for the client to provide
      additional input before retrying the original request.'
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:ResultType
    typeof: string
    base: str
    uri: xsd:string
  McpUriTemplate:
    name: McpUriTemplate
    definition_uri: https://w3id.org/lmodel/mcp/McpUriTemplate
    description: A URI template, as RFC 6570 defines one.
    comments:
    - MCP gives such a string the format uri-template.
    from_schema: https://w3id.org/lmodel/mcp
    typeof: string
    base: str
    uri: xsd:string
  string:
    name: string
    definition_uri: https://w3id.org/linkml/String
    description: A character string
    notes:
    - In RDF serializations, a slot with range of string is treated as a literal or
      type xsd:string. If you are authoring schemas in LinkML YAML, the type is referenced
      with the lower case "string".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Text
    base: str
    uri: xsd:string
  integer:
    name: integer
    definition_uri: https://w3id.org/linkml/Integer
    description: An integer
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "integer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Integer
    base: int
    uri: xsd:integer
  boolean:
    name: boolean
    definition_uri: https://w3id.org/linkml/Boolean
    description: A binary (true or false) value
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "boolean".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Boolean
    base: Bool
    uri: xsd:boolean
    repr: bool
  float:
    name: float
    definition_uri: https://w3id.org/linkml/Float
    description: A real number that conforms to the xsd:float specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "float".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Float
    base: float
    uri: xsd:float
  double:
    name: double
    definition_uri: https://w3id.org/linkml/Double
    description: A real number that conforms to the xsd:double specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "double".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:Float
    base: float
    uri: xsd:double
  decimal:
    name: decimal
    definition_uri: https://w3id.org/linkml/Decimal
    description: A real number with arbitrary precision that conforms to the xsd:decimal
      specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "decimal".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    broad_mappings:
    - schema:Number
    base: Decimal
    uri: xsd:decimal
  time:
    name: time
    definition_uri: https://w3id.org/linkml/Time
    description: A time object represents a (local) time of day, independent of any
      particular day
    notes:
    - URI is dateTime because OWL reasoners do not work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "time".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Time
    base: XSDTime
    uri: xsd:time
    repr: str
  date:
    name: date
    definition_uri: https://w3id.org/linkml/Date
    description: a date (year, month and day) in an idealized calendar
    notes:
    - URI is dateTime because OWL reasoners don't work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Date
    base: XSDDate
    uri: xsd:date
    repr: str
  datetime:
    name: datetime
    definition_uri: https://w3id.org/linkml/Datetime
    description: The combination of a date and time
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:DateTime
    base: XSDDateTime
    uri: xsd:dateTime
    repr: str
  date_or_datetime:
    name: date_or_datetime
    definition_uri: https://w3id.org/linkml/DateOrDatetime
    description: Either a date or a datetime
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date_or_datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: linkml:DateOrDatetime
    repr: str
  uriorcurie:
    name: uriorcurie
    definition_uri: https://w3id.org/linkml/Uriorcurie
    description: a URI or a CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uriorcurie".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: URIorCURIE
    uri: xsd:anyURI
    repr: str
  curie:
    name: curie
    definition_uri: https://w3id.org/linkml/Curie
    conforms_to: https://www.w3.org/TR/curie/
    description: a compact URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "curie".
    comments:
    - in RDF serializations this MUST be expanded to a URI
    - in non-RDF serializations MAY be serialized as the compact representation
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: Curie
    uri: xsd:string
    repr: str
  uri:
    name: uri
    definition_uri: https://w3id.org/linkml/Uri
    conforms_to: https://www.ietf.org/rfc/rfc3987.txt
    description: a complete URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uri".
    comments:
    - in RDF serializations a slot with range of uri is treated as a literal or type
      xsd:anyURI unless it is an identifier or a reference to an identifier, in which
      case it is translated directly to a node
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:URL
    base: URI
    uri: xsd:anyURI
    repr: str
  ncname:
    name: ncname
    definition_uri: https://w3id.org/linkml/Ncname
    description: Prefix part of CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "ncname".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NCName
    uri: xsd:string
    repr: str
  objectidentifier:
    name: objectidentifier
    definition_uri: https://w3id.org/linkml/Objectidentifier
    description: A URI or CURIE that represents an object in the model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "objectidentifier".
    comments:
    - Used for inheritance and type checking
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: ElementIdentifier
    uri: shex:iri
    repr: str
  nodeidentifier:
    name: nodeidentifier
    definition_uri: https://w3id.org/linkml/Nodeidentifier
    description: A URI, CURIE or BNODE that represents a node in a model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "nodeidentifier".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NodeIdentifier
    uri: shex:nonLiteral
    repr: str
  jsonpointer:
    name: jsonpointer
    definition_uri: https://w3id.org/linkml/Jsonpointer
    conforms_to: https://datatracker.ietf.org/doc/html/rfc6901
    description: A string encoding a JSON Pointer. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to a valid object within the current
      instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpointer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  jsonpath:
    name: jsonpath
    definition_uri: https://w3id.org/linkml/Jsonpath
    conforms_to: https://www.ietf.org/archive/id/draft-goessner-dispatch-jsonpath-00.html
    description: A string encoding a JSON Path. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to zero or more valid objects within
      the current instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  sparqlpath:
    name: sparqlpath
    definition_uri: https://w3id.org/linkml/Sparqlpath
    conforms_to: https://www.w3.org/TR/sparql11-query/#propertypaths
    description: A string encoding a SPARQL Property Path. The value of the string
      MUST conform to SPARQL syntax and SHOULD dereference to zero or more valid objects
      within the current instance document when encoded as RDF.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "sparqlpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
enums:
  McpCacheScope:
    name: McpCacheScope
    definition_uri: https://w3id.org/lmodel/mcp/McpCacheScope
    description: The values MCP allows for `cacheScope`.
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:CacheableResult/properties/cacheScope
    permissible_values:
      private:
        text: private
      public:
        text: public
  McpCreateMessageRequestParamsIncludeContext:
    name: McpCreateMessageRequestParamsIncludeContext
    definition_uri: https://w3id.org/lmodel/mcp/McpCreateMessageRequestParamsIncludeContext
    description: The values MCP allows for `includeContext`.
    in_subset:
    - sampling_createmessage
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:CreateMessageRequestParams/properties/includeContext
    permissible_values:
      allServers:
        text: allServers
      none:
        text: none
      thisServer:
        text: thisServer
  McpElicitResultAction:
    name: McpElicitResultAction
    definition_uri: https://w3id.org/lmodel/mcp/McpElicitResultAction
    description: The values MCP allows for `action`.
    in_subset:
    - elicitation_create
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:ElicitResult/properties/action
    permissible_values:
      accept:
        text: accept
      cancel:
        text: cancel
      decline:
        text: decline
  McpIconTheme:
    name: McpIconTheme
    definition_uri: https://w3id.org/lmodel/mcp/McpIconTheme
    description: The values MCP allows for `theme`.
    in_subset:
    - common_types
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:Icon/properties/theme
    permissible_values:
      dark:
        text: dark
      light:
        text: light
  McpLoggingLevel:
    name: McpLoggingLevel
    definition_uri: https://w3id.org/lmodel/mcp/McpLoggingLevel
    description: 'The severity of a log message.


      These map to syslog message severities, as specified in RFC-5424:

      https://datatracker.ietf.org/doc/html/rfc5424#section-6.2.1'
    in_subset:
    - common_types
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:LoggingLevel
    permissible_values:
      alert:
        text: alert
      critical:
        text: critical
      debug:
        text: debug
      emergency:
        text: emergency
      error:
        text: error
      info:
        text: info
      notice:
        text: notice
      warning:
        text: warning
  McpNumberSchemaType:
    name: McpNumberSchemaType
    definition_uri: https://w3id.org/lmodel/mcp/McpNumberSchemaType
    description: The values MCP allows for `type`.
    in_subset:
    - elicitation_create
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:NumberSchema/properties/type
    permissible_values:
      integer:
        text: integer
      number:
        text: number
  McpRole:
    name: McpRole
    definition_uri: https://w3id.org/lmodel/mcp/McpRole
    description: The sender or recipient of messages and data in a conversation.
    in_subset:
    - common_types
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:Role
    permissible_values:
      assistant:
        text: assistant
      user:
        text: user
  McpStringSchemaFormat:
    name: McpStringSchemaFormat
    definition_uri: https://w3id.org/lmodel/mcp/McpStringSchemaFormat
    description: The values MCP allows for `format`.
    in_subset:
    - elicitation_create
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:StringSchema/properties/format
    permissible_values:
      date:
