  mcpCreateMessageResult__meta:
    name: mcpCreateMessageResult__meta
    description: "Represents the contents of a `_meta` field, which clients and servers\
      \ use to attach additional metadata to their interactions.\n\nCertain key names\
      \ are reserved by MCP for protocol-level metadata; implementations MUST NOT\
      \ make assumptions about values at these keys. Additionally, specific schema\
      \ definitions may reserve particular names for purpose-specific metadata, as\
      \ declared in those definitions.\n\nValid keys have two segments:\n\n**Prefix:**\n\
      - Optional \u2014 if specified, MUST be a series of _labels_ separated by dots\
      \ (`.`), followed by a slash (`/`).\n- Labels MUST start with a letter and end\
      \ with a letter or digit. Interior characters may be letters, digits, or hyphens\
      \ (`-`).\n- Implementations SHOULD use reverse DNS notation (e.g., `com.example/`\
      \ rather than `example.com/`).\n- Any prefix where the second label is `modelcontextprotocol`\
      \ or `mcp` is **reserved** for MCP use. For example: `io.modelcontextprotocol/`,\
      \ `dev.mcp/`, `org.modelcontextprotocol.api/`, and `com.mcp.tools/` are all\
      \ reserved. However, `com.example.mcp/` is NOT reserved, as the second label\
      \ is `example`.\n\n**Name:**\n- Unless empty, MUST start and end with an alphanumeric\
      \ character (`[a-z0-9A-Z]`).\n- Interior characters may be alphanumeric, hyphens\
      \ (`-`), underscores (`_`), or dots (`.`)."
    from_schema: https://w3id.org/lmodel/mcp
    slot_uri: mcp:_meta
    alias: _meta
    owner: McpCreateMessageResult
    domain_of:
    - McpCreateMessageResult
    range: McpMetaObject
    inlined: true
    inlined_as_list: true
  mcpCreateMessageResult__content:
    name: mcpCreateMessageResult__content
    description: The content the message carries.
    from_schema: https://w3id.org/lmodel/mcp
