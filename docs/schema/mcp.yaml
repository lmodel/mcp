    definition_uri: https://w3id.org/lmodel/mcp/McpTitledSingleSelectEnumSchemaOneOf
    description: The object MCP's `TitledSingleSelectEnumSchema` holds under `oneOf`.
    in_subset:
    - elicitation_create
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
