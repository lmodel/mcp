    attributes:
      meta:
        name: meta
        description: Extends {@link MetaObject} with additional request-specific fields.
          All key naming rules from `MetaObject` apply.
        alias: _meta
        range: McpRequestMetaObject
        required: true
      input_responses:
        name: input_responses
        description: 'A map of client responses to server-initiated requests.

          Keys correspond to the keys in the {@link InputRequests} map;

          values are the client''s result for each request.'
        alias: inputResponses
        range: McpInputResponses
      request_state:
        name: request_state
        description: State the server handed out with an input-required result, sent
          back unchanged when the request is retried.
        alias: requestState
      uri:
        name: uri
        description: The URI of the resource. The URI can use any protocol; it is
          up to the server how to interpret it.
        range: uri
