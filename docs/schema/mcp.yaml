        range: McpError
        required: true
      identifier:
        name: identifier
        description: A uniquely identifying ID for a request in JSON-RPC.
        aliases:
        - id
        any_of:
        - range: string
        - range: integer
      jsonrpc:
        name: jsonrpc
        description: The JSON-RPC version, always `2.0`.
        required: true
        equals_string: '2.0'
    class_uri: mcp:McpJSONRPCErrorResponse
    extra_slots:
      allowed: true
  McpJSONRPCMessage:
    name: McpJSONRPCMessage
