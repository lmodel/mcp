      \ `not`), conditional keywords\n(`if`/`then`/`else`), reference keywords (`$ref`,\
      \ `$defs`, `$anchor`), and any other\nstandard validation or annotation keywords.\n\
      \nProperty schemas may carry an `x-mcp-header` annotation to mirror the\nargument\
      \ value into an HTTP header on the Streamable HTTP transport. See\nthe Streamable\
      \ HTTP transport specification for the validity and\nextraction rules.\n\nDefaults\
