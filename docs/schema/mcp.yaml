    slots:
    - McpResourceTemplate_description
    - McpResourceTemplate_name
    - McpResourceTemplate_title
    - mcpResourceTemplate__meta
    - mcpResourceTemplate__annotations
    - mcpResourceTemplate__icons
    - mcpResourceTemplate__mime_type
    - mcpResourceTemplate__uri_template
    slot_usage:
      description:
        name: description
        description: 'A description of what this template is for.


          This can be used by clients to improve the LLM''s understanding of available
          resources. It can be thought of like a "hint" to the model.'
      name:
        name: name
        description: Intended for programmatic or logical use, but used as a display
          name in past specs or fallback (if title isn't present).
        required: true
      title:
        name: title
        description: "Intended for UI and end-user contexts \u2014 optimized to be\
          \ human-readable and easily understood,\neven by those unfamiliar with domain-specific\
          \ terminology.\n\nIf not provided, the name should be used for display (except\
          \ for {@link Tool},\nwhere `annotations.title` should be given precedence\
          \ over using `name`,\nif present)."
    attributes:
      meta:
        name: meta
        description: "Represents the contents of a `_meta` field, which clients and\
          \ servers use to attach additional metadata to their interactions.\n\nCertain\
          \ key names are reserved by MCP for protocol-level metadata; implementations\
          \ MUST NOT make assumptions about values at these keys. Additionally, specific\
          \ schema definitions may reserve particular names for purpose-specific metadata,\
          \ as declared in those definitions.\n\nValid keys have two segments:\n\n\
          **Prefix:**\n- Optional \u2014 if specified, MUST be a series of _labels_\
          \ separated by dots (`.`), followed by a slash (`/`).\n- Labels MUST start\
          \ with a letter and end with a letter or digit. Interior characters may\
          \ be letters, digits, or hyphens (`-`).\n- Implementations SHOULD use reverse\
          \ DNS notation (e.g., `com.example/` rather than `example.com/`).\n- Any\
          \ prefix where the second label is `modelcontextprotocol` or `mcp` is **reserved**\
          \ for MCP use. For example: `io.modelcontextprotocol/`, `dev.mcp/`, `org.modelcontextprotocol.api/`,\
          \ and `com.mcp.tools/` are all reserved. However, `com.example.mcp/` is\
          \ NOT reserved, as the second label is `example`.\n\n**Name:**\n- Unless\
          \ empty, MUST start and end with an alphanumeric character (`[a-z0-9A-Z]`).\n\
          - Interior characters may be alphanumeric, hyphens (`-`), underscores (`_`),\
          \ or dots (`.`)."
        alias: _meta
        range: McpMetaObject
      annotations:
        name: annotations
        description: Optional annotations for the client.
        range: McpAnnotations
      icons:
        name: icons
        description: 'Optional set of sized icons that the client can display in a
          user interface.


          Clients that support rendering icons MUST support at least the following
          MIME types:

          - `image/png` - PNG images (safe, universal compatibility)

          - `image/jpeg` (and `image/jpg`) - JPEG images (safe, universal compatibility)


          Clients that support rendering icons SHOULD also support:

          - `image/svg+xml` - SVG images (scalable but requires security precautions)

          - `image/webp` - WebP images (modern, efficient format)'
        range: McpIcon
        multivalued: true
        inlined_as_list: true
      mime_type:
        name: mime_type
        description: The MIME type for all resources that match this template. This
          should only be included if all resources matching this template have the
          same type.
        alias: mimeType
      uri_template:
        name: uri_template
        description: A URI template (according to RFC 6570) that can be used to construct
          resource URIs.
        alias: uriTemplate
        range: McpUriTemplate
        required: true
    class_uri: mcp:McpResourceTemplate
    extra_slots:
      allowed: true
  McpResourceTemplateReference:
    name: McpResourceTemplateReference
    definition_uri: https://w3id.org/lmodel/mcp/McpResourceTemplateReference
    description: A reference to a resource or resource template definition.
    in_subset:
    - completion_complete
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:ResourceTemplateReference
    slots:
    - mcpResourceTemplateReference__kind
    - mcpResourceTemplateReference__uri
    attributes:
      kind:
        name: kind
        description: The kind of object, always `ref/resource`.
        aliases:
        - type
        required: true
        equals_string: ref/resource
      uri:
        name: uri
        description: The URI or URI template of the resource.
        range: McpUriTemplate
        required: true
    class_uri: mcp:McpResourceTemplateReference
    extra_slots:
      allowed: true
  McpResourceUpdatedNotification:
    name: McpResourceUpdatedNotification
    definition_uri: https://w3id.org/lmodel/mcp/McpResourceUpdatedNotification
    description: A notification from the server to the client, informing it that a
      resource has changed and may need to be read again. This is only sent for resources
      the client opted in to via the `resourceSubscriptions` field of a {@link SubscriptionsListenRequestsubscriptions/listen}
      request.
    in_subset:
    - notifications_resources_updated
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:ResourceUpdatedNotification
    is_a: McpJSONRPCNotification
    slots:
    - mcpResourceUpdatedNotification__jsonrpc
    - mcpResourceUpdatedNotification__method
    - mcpResourceUpdatedNotification__params
    attributes:
      jsonrpc:
        name: jsonrpc
        description: The JSON-RPC version, always `2.0`.
        required: true
        equals_string: '2.0'
      method:
        name: method
        description: The method's name, always `notifications/resources/updated`.
        required: true
        equals_string: notifications/resources/updated
      params:
        name: params
        description: Parameters for a `notifications/resources/updated` notification.
        range: McpResourceUpdatedNotificationParams
        required: true
    class_uri: mcp:McpResourceUpdatedNotification
    extra_slots:
      allowed: true
  McpResourceUpdatedNotificationParams:
    name: McpResourceUpdatedNotificationParams
    definition_uri: https://w3id.org/lmodel/mcp/McpResourceUpdatedNotificationParams
    description: Parameters for a `notifications/resources/updated` notification.
    in_subset:
    - notifications_resources_updated
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:ResourceUpdatedNotificationParams
    is_a: McpNotificationParams
    slots:
    - mcpResourceUpdatedNotificationParams__meta
    - mcpResourceUpdatedNotificationParams__uri
    attributes:
      meta:
        name: meta
        description: Extends {@link MetaObject} with additional notification-specific
          fields. All key naming rules from `MetaObject` apply.
        alias: _meta
        range: McpNotificationMetaObject
      uri:
        name: uri
        description: The URI of the resource that has been updated. This might be
          a sub-resource of the one that the client actually subscribed to.
        range: uri
        required: true
    class_uri: mcp:McpResourceUpdatedNotificationParams
    extra_slots:
      allowed: true
  McpResult:
    name: McpResult
    definition_uri: https://w3id.org/lmodel/mcp/McpResult
    description: Common result fields.
    in_subset:
    - common_types
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:Result
    slots:
    - mcpResult__meta
    - mcpResult__result_type
    attributes:
      meta:
        name: meta
        description: Extends {@link MetaObject} with additional result-specific fields.
          All key naming rules from `MetaObject` apply.
        alias: _meta
        range: McpResultMetaObject
      result_type:
        name: result_type
        description: 'Indicates the type of the result, which allows the client to
          determine

          how to parse the result object.


          Servers implementing this protocol version MUST include this field.

          For backward compatibility, when a client receives a result from a

          server implementing an earlier protocol version (which does not include

          `resultType`), the client MUST treat the absent field as `"complete"`.'
        alias: resultType
        required: true
    class_uri: mcp:McpResult
    extra_slots:
      allowed: true
  McpResultMetaObject:
    name: McpResultMetaObject
    definition_uri: https://w3id.org/lmodel/mcp/McpResultMetaObject
    description: Extends {@link MetaObject} with additional result-specific fields.
      All key naming rules from `MetaObject` apply.
    in_subset:
    - common_types
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:ResultMetaObject
    is_a: McpMetaObject
    slots:
    - mcpResultMetaObject__mcp_server_info
    attributes:
      mcp_server_info:
        name: mcp_server_info
        description: 'Identifies the server software producing the response. Servers
          SHOULD

          include this field on every response unless specifically configured not

          to do so.


          The {@link Implementation} schema requires `name` and `version`; other

          fields are optional.


          The value is self-reported by the server and is not verified by the

          protocol. It is intended for display, logging, and debugging. Clients

          SHOULD NOT use it to change their behavior, and SHOULD NOT rely on it for

          security decisions.'
        aliases:
        - io.modelcontextprotocol/serverInfo
        range: McpImplementation
    class_uri: mcp:McpResultMetaObject
    extra_slots:
      allowed: true
  McpRoot:
    name: McpRoot
    definition_uri: https://w3id.org/lmodel/mcp/McpRoot
    description: Represents a root directory or file that the server can operate on.
    in_subset:
    - roots_list
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:Root
    slots:
    - McpRoot_name
    - mcpRoot__meta
    - mcpRoot__uri
    slot_usage:
      name:
        name: name
        description: 'An optional name for the root. This can be used to provide a
          human-readable

          identifier for the root, which may be useful for display purposes or for

          referencing the root in other parts of the application.'
    attributes:
      meta:
        name: meta
        description: "Represents the contents of a `_meta` field, which clients and\
          \ servers use to attach additional metadata to their interactions.\n\nCertain\
          \ key names are reserved by MCP for protocol-level metadata; implementations\
          \ MUST NOT make assumptions about values at these keys. Additionally, specific\
          \ schema definitions may reserve particular names for purpose-specific metadata,\
          \ as declared in those definitions.\n\nValid keys have two segments:\n\n\
          **Prefix:**\n- Optional \u2014 if specified, MUST be a series of _labels_\
          \ separated by dots (`.`), followed by a slash (`/`).\n- Labels MUST start\
          \ with a letter and end with a letter or digit. Interior characters may\
          \ be letters, digits, or hyphens (`-`).\n- Implementations SHOULD use reverse\
          \ DNS notation (e.g., `com.example/` rather than `example.com/`).\n- Any\
          \ prefix where the second label is `modelcontextprotocol` or `mcp` is **reserved**\
          \ for MCP use. For example: `io.modelcontextprotocol/`, `dev.mcp/`, `org.modelcontextprotocol.api/`,\
          \ and `com.mcp.tools/` are all reserved. However, `com.example.mcp/` is\
          \ NOT reserved, as the second label is `example`.\n\n**Name:**\n- Unless\
          \ empty, MUST start and end with an alphanumeric character (`[a-z0-9A-Z]`).\n\
          - Interior characters may be alphanumeric, hyphens (`-`), underscores (`_`),\
          \ or dots (`.`)."
        alias: _meta
        range: McpMetaObject
      uri:
        name: uri
        description: 'The URI identifying the root. This *must* start with `file://`
          for now.

          This restriction may be relaxed in future versions of the protocol to allow

          other URI schemes.'
        range: uri
        required: true
    class_uri: mcp:McpRoot
    extra_slots:
      allowed: true
  McpSamplingMessage:
    name: McpSamplingMessage
    definition_uri: https://w3id.org/lmodel/mcp/McpSamplingMessage
    description: Describes a message issued to or received from an LLM API.
    in_subset:
    - sampling_createmessage
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:SamplingMessage
    slots:
    - mcpSamplingMessage__meta
    - mcpSamplingMessage__content
    - mcpSamplingMessage__role
    attributes:
      meta:
        name: meta
        description: "Represents the contents of a `_meta` field, which clients and\
          \ servers use to attach additional metadata to their interactions.\n\nCertain\
          \ key names are reserved by MCP for protocol-level metadata; implementations\
          \ MUST NOT make assumptions about values at these keys. Additionally, specific\
          \ schema definitions may reserve particular names for purpose-specific metadata,\
          \ as declared in those definitions.\n\nValid keys have two segments:\n\n\
          **Prefix:**\n- Optional \u2014 if specified, MUST be a series of _labels_\
          \ separated by dots (`.`), followed by a slash (`/`).\n- Labels MUST start\
          \ with a letter and end with a letter or digit. Interior characters may\
          \ be letters, digits, or hyphens (`-`).\n- Implementations SHOULD use reverse\
          \ DNS notation (e.g., `com.example/` rather than `example.com/`).\n- Any\
          \ prefix where the second label is `modelcontextprotocol` or `mcp` is **reserved**\
          \ for MCP use. For example: `io.modelcontextprotocol/`, `dev.mcp/`, `org.modelcontextprotocol.api/`,\
          \ and `com.mcp.tools/` are all reserved. However, `com.example.mcp/` is\
          \ NOT reserved, as the second label is `example`.\n\n**Name:**\n- Unless\
          \ empty, MUST start and end with an alphanumeric character (`[a-z0-9A-Z]`).\n\
          - Interior characters may be alphanumeric, hyphens (`-`), underscores (`_`),\
          \ or dots (`.`)."
        alias: _meta
        range: McpMetaObject
      content:
        name: content
        description: The content the message carries.
        required: true
        any_of:
        - range: McpTextContent
        - range: McpImageContent
        - range: McpAudioContent
        - range: McpToolUseContent
        - range: McpToolResultContent
        - range: McpSamplingMessageContentBlock
          multivalued: true
          inlined_as_list: true
      role:
        name: role
        description: The sender or recipient of messages and data in a conversation.
        range: McpRole
        required: true
    class_uri: mcp:McpSamplingMessage
    extra_slots:
      allowed: true
  McpSamplingMessageContentBlock:
    name: McpSamplingMessageContentBlock
    definition_uri: https://w3id.org/lmodel/mcp/McpSamplingMessageContentBlock
    description: One of `TextContent`, `ImageContent`, `AudioContent`, `ToolUseContent`,
      `ToolResultContent`.
    in_subset:
    - sampling_createmessage
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:SamplingMessageContentBlock
    class_uri: mcp:McpSamplingMessageContentBlock
    extra_slots:
      allowed: true
    any_of:
    - is_a: McpTextContent
    - is_a: McpImageContent
    - is_a: McpAudioContent
    - is_a: McpToolUseContent
    - is_a: McpToolResultContent
  McpServerCapabilities:
    name: McpServerCapabilities
    definition_uri: https://w3id.org/lmodel/mcp/McpServerCapabilities
    description: 'Capabilities that a server may support. Known capabilities are defined
      here, in this schema, but this is not a closed set: any server can define its
      own, additional capabilities.'
    in_subset:
    - server_discover
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:ServerCapabilities
    slots:
    - mcpServerCapabilities__completions
    - mcpServerCapabilities__experimental
    - mcpServerCapabilities__extensions
    - mcpServerCapabilities__logging
    - mcpServerCapabilities__prompts
    - mcpServerCapabilities__resources
    - mcpServerCapabilities__tools
    attributes:
      completions:
        name: completions
        description: Present if the server supports argument autocompletion suggestions.
        range: McpJSONObject
      experimental:
        name: experimental
        description: Experimental, non-standard capabilities that the server supports.
        range: McpServerCapabilitiesExperimental
      extensions:
        name: extensions
        description: 'Optional MCP extensions that the server supports. Keys are extension
          identifiers

          (e.g., "io.modelcontextprotocol/tasks"), and values are per-extension settings

          objects. An empty object indicates support with no settings.


          Keys MUST follow the {@link MetaObject`_meta` key naming rules}, with a

          mandatory prefix.'
        range: McpServerCapabilitiesExtensions
      logging:
        name: logging
        description: Present if the server supports sending log messages to the client.
        range: McpJSONObject
      prompts:
        name: prompts
        description: Present if the server offers any prompt templates.
        range: McpServerCapabilitiesPrompts
      resources:
        name: resources
        description: Present if the server offers any resources to read.
        range: McpServerCapabilitiesResources
      tools:
        name: tools
        description: Present if the server offers any tools to call.
        range: McpServerCapabilitiesTools
    class_uri: mcp:McpServerCapabilities
    extra_slots:
      allowed: true
  McpServerCapabilitiesExperimental:
    name: McpServerCapabilitiesExperimental
    definition_uri: https://w3id.org/lmodel/mcp/McpServerCapabilitiesExperimental
    description: Experimental, non-standard capabilities that the server supports.
    in_subset:
    - server_discover
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:ServerCapabilities/properties/experimental
    class_uri: mcp:McpServerCapabilitiesExperimental
    extra_slots:
      range_expression:
        range: McpJSONObject
  McpServerCapabilitiesExtensions:
    name: McpServerCapabilitiesExtensions
    definition_uri: https://w3id.org/lmodel/mcp/McpServerCapabilitiesExtensions
    description: 'Optional MCP extensions that the server supports. Keys are extension
      identifiers

      (e.g., "io.modelcontextprotocol/tasks"), and values are per-extension settings

      objects. An empty object indicates support with no settings.


      Keys MUST follow the {@link MetaObject`_meta` key naming rules}, with a

      mandatory prefix.'
    in_subset:
    - server_discover
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:ServerCapabilities/properties/extensions
    class_uri: mcp:McpServerCapabilitiesExtensions
    extra_slots:
      range_expression:
        range: McpJSONObject
  McpServerCapabilitiesPrompts:
    name: McpServerCapabilitiesPrompts
    definition_uri: https://w3id.org/lmodel/mcp/McpServerCapabilitiesPrompts
    description: Present if the server offers any prompt templates.
    in_subset:
    - server_discover
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:ServerCapabilities/properties/prompts
    slots:
    - mcpServerCapabilitiesPrompts__list_changed
    attributes:
      list_changed:
        name: list_changed
        description: Whether this server supports notifications for changes to the
          prompt list.
        alias: listChanged
        range: boolean
    class_uri: mcp:McpServerCapabilitiesPrompts
    extra_slots:
      allowed: true
  McpServerCapabilitiesResources:
    name: McpServerCapabilitiesResources
    definition_uri: https://w3id.org/lmodel/mcp/McpServerCapabilitiesResources
    description: Present if the server offers any resources to read.
    in_subset:
    - server_discover
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:ServerCapabilities/properties/resources
    slots:
    - mcpServerCapabilitiesResources__list_changed
    - mcpServerCapabilitiesResources__subscribe
    attributes:
      list_changed:
        name: list_changed
        description: Whether this server supports notifications for changes to the
          resource list.
        alias: listChanged
        range: boolean
      subscribe:
        name: subscribe
        description: Whether this server supports subscribing to resource updates.
        range: boolean
    class_uri: mcp:McpServerCapabilitiesResources
    extra_slots:
      allowed: true
  McpServerCapabilitiesTools:
    name: McpServerCapabilitiesTools
    definition_uri: https://w3id.org/lmodel/mcp/McpServerCapabilitiesTools
    description: Present if the server offers any tools to call.
    in_subset:
    - server_discover
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:ServerCapabilities/properties/tools
    slots:
    - mcpServerCapabilitiesTools__list_changed
    attributes:
      list_changed:
        name: list_changed
        description: Whether this server supports notifications for changes to the
          tool list.
        alias: listChanged
        range: boolean
    class_uri: mcp:McpServerCapabilitiesTools
    extra_slots:
      allowed: true
  McpServerNotification:
    name: McpServerNotification
    definition_uri: https://w3id.org/lmodel/mcp/McpServerNotification
    description: One of `CancelledNotification`, `ProgressNotification`, `ResourceListChangedNotification`,
      `SubscriptionsAcknowledgedNotification`, `ResourceUpdatedNotification`, `PromptListChangedNotification`,
      `ToolListChangedNotification`, `LoggingMessageNotification`.
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:ServerNotification
    class_uri: mcp:McpServerNotification
    extra_slots:
      allowed: true
    any_of:
    - is_a: McpCancelledNotification
    - is_a: McpProgressNotification
    - is_a: McpResourceListChangedNotification
    - is_a: McpSubscriptionsAcknowledgedNotification
    - is_a: McpResourceUpdatedNotification
    - is_a: McpPromptListChangedNotification
    - is_a: McpToolListChangedNotification
    - is_a: McpLoggingMessageNotification
  McpServerResult:
    name: McpServerResult
    definition_uri: https://w3id.org/lmodel/mcp/McpServerResult
    description: One of `Result`, `InputRequiredResult`, `DiscoverResult`, `ListResourcesResult`,
      `ListResourceTemplatesResult`, `ReadResourceResult`, `SubscriptionsListenResult`,
      `ListPromptsResult`, `GetPromptResult`, `ListToolsResult`, `CallToolResult`,
      `CompleteResult`.
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:ServerResult
    class_uri: mcp:McpServerResult
    extra_slots:
      allowed: true
    any_of:
    - is_a: McpResult
    - is_a: McpInputRequiredResult
    - is_a: McpDiscoverResult
    - is_a: McpListResourcesResult
    - is_a: McpListResourceTemplatesResult
    - is_a: McpReadResourceResult
    - is_a: McpSubscriptionsListenResult
    - is_a: McpListPromptsResult
    - is_a: McpGetPromptResult
    - is_a: McpListToolsResult
    - is_a: McpCallToolResult
    - is_a: McpCompleteResult
  McpSingleSelectEnumSchema:
    name: McpSingleSelectEnumSchema
    definition_uri: https://w3id.org/lmodel/mcp/McpSingleSelectEnumSchema
    description: One of `UntitledSingleSelectEnumSchema`, `TitledSingleSelectEnumSchema`.
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:SingleSelectEnumSchema
    class_uri: mcp:McpSingleSelectEnumSchema
    extra_slots:
      allowed: true
    any_of:
    - is_a: McpUntitledSingleSelectEnumSchema
    - is_a: McpTitledSingleSelectEnumSchema
  McpStringSchema:
    name: McpStringSchema
    definition_uri: https://w3id.org/lmodel/mcp/McpStringSchema
    description: MCP's `StringSchema`.
    in_subset:
    - elicitation_create
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:StringSchema
    slots:
    - McpStringSchema_description
    - McpStringSchema_title
    - mcpStringSchema__default
    - mcpStringSchema__format
    - mcpStringSchema__max_length
    - mcpStringSchema__min_length
    - mcpStringSchema__kind
    slot_usage:
      description:
        name: description
        description: A description of the field for the user.
      title:
        name: title
        description: A title for the field.
    attributes:
      default:
        name: default
        description: The value the field takes when the user gives none.
      format:
        name: format
        description: The format the string must have.
        range: McpStringSchemaFormat
      max_length:
        name: max_length
        description: The most characters the field accepts.
        alias: maxLength
        range: integer
      min_length:
        name: min_length
        description: The fewest characters the field accepts.
        alias: minLength
        range: integer
      kind:
        name: kind
        description: The kind of object, always `string`.
        aliases:
        - type
        required: true
        equals_string: string
    class_uri: mcp:McpStringSchema
    extra_slots:
      allowed: true
  McpSubscriptionFilter:
    name: McpSubscriptionFilter
    definition_uri: https://w3id.org/lmodel/mcp/McpSubscriptionFilter
    description: 'The set of notification types a client may opt in to on a

      {@link SubscriptionsListenRequestsubscriptions/listen} request.


      Each notification type is **opt-in**; the server **MUST NOT** send

      notification types the client has not explicitly requested here.'
    in_subset:
    - subscriptions_listen
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:SubscriptionFilter
    slots:
    - mcpSubscriptionFilter__prompts_list_changed
    - mcpSubscriptionFilter__resource_subscriptions
    - mcpSubscriptionFilter__resources_list_changed
    - mcpSubscriptionFilter__tools_list_changed
    attributes:
      prompts_list_changed:
        name: prompts_list_changed
        description: If true, receive {@link PromptListChangedNotificationnotifications/prompts/list_changed}.
        alias: promptsListChanged
        range: boolean
      resource_subscriptions:
        name: resource_subscriptions
        description: 'Subscribe to {@link ResourceUpdatedNotificationnotifications/resources/updated}
          for these resource URIs.

          Replaces the former `resources/subscribe` RPC.'
        alias: resourceSubscriptions
        multivalued: true
      resources_list_changed:
        name: resources_list_changed
        description: If true, receive {@link ResourceListChangedNotificationnotifications/resources/list_changed}.
        alias: resourcesListChanged
        range: boolean
      tools_list_changed:
        name: tools_list_changed
        description: If true, receive {@link ToolListChangedNotificationnotifications/tools/list_changed}.
        alias: toolsListChanged
        range: boolean
    class_uri: mcp:McpSubscriptionFilter
    extra_slots:
      allowed: true
  McpSubscriptionsAcknowledgedNotification:
    name: McpSubscriptionsAcknowledgedNotification
    definition_uri: https://w3id.org/lmodel/mcp/McpSubscriptionsAcknowledgedNotification
    description: 'Sent by the server to acknowledge that a

      {@link SubscriptionsListenRequestsubscriptions/listen} subscription has been

      established and to report which notification types it agreed to honor.


      This notification MUST be the first message the server sends carrying the

      subscription''s ID in `io.modelcontextprotocol/subscriptionId`. The server MUST

      NOT send any notification on the subscription before acknowledging it. On

      stdio, where every subscription shares one channel, this ordering is defined

      per subscription ID and not per channel: messages belonging to other

      subscriptions MAY be interleaved before it.'
    in_subset:
    - notifications_subscriptions_acknowledged
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:SubscriptionsAcknowledgedNotification
    is_a: McpJSONRPCNotification
    slots:
    - mcpSubscriptionsAcknowledgedNotification__jsonrpc
    - mcpSubscriptionsAcknowledgedNotification__method
    - mcpSubscriptionsAcknowledgedNotification__params
    attributes:
      jsonrpc:
        name: jsonrpc
        description: The JSON-RPC version, always `2.0`.
        required: true
        equals_string: '2.0'
      method:
        name: method
        description: The method's name, always `notifications/subscriptions/acknowledged`.
        required: true
        equals_string: notifications/subscriptions/acknowledged
      params:
        name: params
        description: Parameters for a {@link SubscriptionsAcknowledgedNotificationnotifications/subscriptions/acknowledged}
          notification.
        range: McpSubscriptionsAcknowledgedNotificationParams
        required: true
    class_uri: mcp:McpSubscriptionsAcknowledgedNotification
    extra_slots:
      allowed: true
  McpSubscriptionsAcknowledgedNotificationParams:
    name: McpSubscriptionsAcknowledgedNotificationParams
    definition_uri: https://w3id.org/lmodel/mcp/McpSubscriptionsAcknowledgedNotificationParams
    description: Parameters for a {@link SubscriptionsAcknowledgedNotificationnotifications/subscriptions/acknowledged}
      notification.
    in_subset:
    - notifications_subscriptions_acknowledged
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:SubscriptionsAcknowledgedNotificationParams
    is_a: McpNotificationParams
    slots:
    - mcpSubscriptionsAcknowledgedNotificationParams__meta
    - mcpSubscriptionsAcknowledgedNotificationParams__notifications
    attributes:
      meta:
        name: meta
        description: Extends {@link MetaObject} with additional notification-specific
          fields. All key naming rules from `MetaObject` apply.
        alias: _meta
        range: McpNotificationMetaObject
      notifications:
        name: notifications
        description: 'The subset of requested notification types the server agreed
          to honor.

          Only includes notification types the server actually supports; if the

          client requested an unsupported type (e.g., `promptsListChanged` when

          the server has no prompts), it is omitted from this set.'
        range: McpSubscriptionFilter
        required: true
    class_uri: mcp:McpSubscriptionsAcknowledgedNotificationParams
    extra_slots:
      allowed: true
  McpSubscriptionsListenRequest:
    name: McpSubscriptionsListenRequest
    definition_uri: https://w3id.org/lmodel/mcp/McpSubscriptionsListenRequest
    description: 'Sent from the client to open a long-lived channel for receiving
      notifications

      outside the context of a specific request. Replaces the previous HTTP GET

      endpoint and ensures consistent behavior between HTTP and STDIO.'
    in_subset:
    - subscriptions_listen
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:SubscriptionsListenRequest
    is_a: McpJSONRPCRequest
    slots:
    - mcpSubscriptionsListenRequest__identifier
    - mcpSubscriptionsListenRequest__jsonrpc
    - mcpSubscriptionsListenRequest__method
    - mcpSubscriptionsListenRequest__params
    attributes:
      identifier:
        name: identifier
        description: A uniquely identifying ID for a request in JSON-RPC.
        aliases:
        - id
        required: true
        any_of:
        - range: string
        - range: integer
      jsonrpc:
        name: jsonrpc
        description: The JSON-RPC version, always `2.0`.
        required: true
        equals_string: '2.0'
      method:
        name: method
        description: The method's name, always `subscriptions/listen`.
        required: true
        equals_string: subscriptions/listen
      params:
        name: params
        description: Parameters for a {@link SubscriptionsListenRequestsubscriptions/listen}
          request.
        range: McpSubscriptionsListenRequestParams
        required: true
    class_uri: mcp:McpSubscriptionsListenRequest
    extra_slots:
      allowed: true
  McpSubscriptionsListenRequestParams:
    name: McpSubscriptionsListenRequestParams
    definition_uri: https://w3id.org/lmodel/mcp/McpSubscriptionsListenRequestParams
    description: Parameters for a {@link SubscriptionsListenRequestsubscriptions/listen}
      request.
    in_subset:
    - subscriptions_listen
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:SubscriptionsListenRequestParams
    is_a: McpRequestParams
    slots:
    - mcpSubscriptionsListenRequestParams__meta
    - mcpSubscriptionsListenRequestParams__notifications
    attributes:
      meta:
        name: meta
        description: Extends {@link MetaObject} with additional request-specific fields.
          All key naming rules from `MetaObject` apply.
        alias: _meta
        range: McpRequestMetaObject
        required: true
      notifications:
        name: notifications
        description: 'The notifications the client opts in to on this stream. The
          server

          **MUST NOT** send notification types the client has not explicitly

          requested.'
        range: McpSubscriptionFilter
        required: true
    class_uri: mcp:McpSubscriptionsListenRequestParams
    extra_slots:
      allowed: true
  McpSubscriptionsListenResult:
    name: McpSubscriptionsListenResult
    definition_uri: https://w3id.org/lmodel/mcp/McpSubscriptionsListenResult
    description: 'The response to a {@link SubscriptionsListenRequestsubscriptions/listen}

      request, signalling that the subscription has ended gracefully (for example,

      during server shutdown). Because the listen stream is long-lived, this result

      is sent only when the server tears the subscription down; an abrupt transport

      close carries no response. The result body is otherwise empty.'
    in_subset:
    - subscriptions_listen
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:SubscriptionsListenResult
    is_a: McpResult
    slots:
    - mcpSubscriptionsListenResult__meta
    - mcpSubscriptionsListenResult__result_type
    attributes:
      meta:
        name: meta
        description: 'Extends {@link ResultMetaObject} with the subscription-stream
          identifier carried by a

          {@link SubscriptionsListenResult}. All key naming rules from `MetaObject`
          apply.'
        alias: _meta
        range: McpSubscriptionsListenResultMetaObject
        required: true
      result_type:
        name: result_type
        description: 'Indicates the type of the result, which allows the client to
          determine

          how to parse the result object.


          Servers implementing this protocol version MUST include this field.

          For backward compatibility, when a client receives a result from a

          server implementing an earlier protocol version (which does not include

          `resultType`), the client MUST treat the absent field as `"complete"`.'
        alias: resultType
        required: true
    class_uri: mcp:McpSubscriptionsListenResult
    extra_slots:
      allowed: true
  McpSubscriptionsListenResultMetaObject:
    name: McpSubscriptionsListenResultMetaObject
    definition_uri: https://w3id.org/lmodel/mcp/McpSubscriptionsListenResultMetaObject
    description: 'Extends {@link ResultMetaObject} with the subscription-stream identifier
      carried by a

      {@link SubscriptionsListenResult}. All key naming rules from `MetaObject` apply.'
    in_subset:
    - subscriptions_listen
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:SubscriptionsListenResultMetaObject
    is_a: McpResultMetaObject
    slots:
    - mcpSubscriptionsListenResultMetaObject__mcp_server_info
    - mcpSubscriptionsListenResultMetaObject__mcp_subscription_id
    attributes:
      mcp_server_info:
        name: mcp_server_info
        description: 'Identifies the server software producing the response. Servers
          SHOULD

          include this field on every response unless specifically configured not

          to do so.


          The {@link Implementation} schema requires `name` and `version`; other

          fields are optional.


          The value is self-reported by the server and is not verified by the

          protocol. It is intended for display, logging, and debugging. Clients

          SHOULD NOT use it to change their behavior, and SHOULD NOT rely on it for

          security decisions.'
        aliases:
        - io.modelcontextprotocol/serverInfo
        range: McpImplementation
      mcp_subscription_id:
        name: mcp_subscription_id
        description: "Identifies the subscription stream this response closes, so\
          \ the client can\ncorrelate it with the originating subscription \u2014\
          \ mirroring the same key on\nthe stream's notifications. The value is the\
          \ JSON-RPC ID of the\n`subscriptions/listen` request that opened the stream\
          \ (and equals this\nresponse's `id`)."
        aliases:
        - io.modelcontextprotocol/subscriptionId
        required: true
        any_of:
        - range: string
        - range: integer
    class_uri: mcp:McpSubscriptionsListenResultMetaObject
    extra_slots:
      allowed: true
  McpSubscriptionsListenResultResponse:
    name: McpSubscriptionsListenResultResponse
    definition_uri: https://w3id.org/lmodel/mcp/McpSubscriptionsListenResultResponse
    description: 'A successful response from the server for a {@link SubscriptionsListenRequestsubscriptions/listen}

      request, sent when the server tears the subscription down gracefully.'
    in_subset:
    - subscriptions_listen
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:SubscriptionsListenResultResponse
    is_a: McpJSONRPCResultResponse
    slots:
    - mcpSubscriptionsListenResultResponse__identifier
    - mcpSubscriptionsListenResultResponse__jsonrpc
    - mcpSubscriptionsListenResultResponse__result
    attributes:
      identifier:
        name: identifier
        description: A uniquely identifying ID for a request in JSON-RPC.
        aliases:
        - id
        required: true
        any_of:
        - range: string
        - range: integer
      jsonrpc:
        name: jsonrpc
        description: The JSON-RPC version, always `2.0`.
        required: true
        equals_string: '2.0'
      result:
        name: result
        description: 'The response to a {@link SubscriptionsListenRequestsubscriptions/listen}

          request, signalling that the subscription has ended gracefully (for example,

          during server shutdown). Because the listen stream is long-lived, this result

          is sent only when the server tears the subscription down; an abrupt transport

          close carries no response. The result body is otherwise empty.'
        range: McpSubscriptionsListenResult
        required: true
    class_uri: mcp:McpSubscriptionsListenResultResponse
    extra_slots:
      allowed: true
  McpTextContent:
    name: McpTextContent
    definition_uri: https://w3id.org/lmodel/mcp/McpTextContent
    description: Text provided to or from an LLM.
    in_subset:
    - content
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:TextContent
    slots:
    - mcpTextContent__meta
    - mcpTextContent__annotations
    - mcpTextContent__text
    - mcpTextContent__kind
    attributes:
      meta:
        name: meta
        description: "Represents the contents of a `_meta` field, which clients and\
          \ servers use to attach additional metadata to their interactions.\n\nCertain\
          \ key names are reserved by MCP for protocol-level metadata; implementations\
          \ MUST NOT make assumptions about values at these keys. Additionally, specific\
          \ schema definitions may reserve particular names for purpose-specific metadata,\
          \ as declared in those definitions.\n\nValid keys have two segments:\n\n\
          **Prefix:**\n- Optional \u2014 if specified, MUST be a series of _labels_\
          \ separated by dots (`.`), followed by a slash (`/`).\n- Labels MUST start\
          \ with a letter and end with a letter or digit. Interior characters may\
          \ be letters, digits, or hyphens (`-`).\n- Implementations SHOULD use reverse\
          \ DNS notation (e.g., `com.example/` rather than `example.com/`).\n- Any\
          \ prefix where the second label is `modelcontextprotocol` or `mcp` is **reserved**\
          \ for MCP use. For example: `io.modelcontextprotocol/`, `dev.mcp/`, `org.modelcontextprotocol.api/`,\
          \ and `com.mcp.tools/` are all reserved. However, `com.example.mcp/` is\
          \ NOT reserved, as the second label is `example`.\n\n**Name:**\n- Unless\
          \ empty, MUST start and end with an alphanumeric character (`[a-z0-9A-Z]`).\n\
          - Interior characters may be alphanumeric, hyphens (`-`), underscores (`_`),\
          \ or dots (`.`)."
        alias: _meta
        range: McpMetaObject
      annotations:
        name: annotations
        description: Optional annotations for the client.
        range: McpAnnotations
      text:
        name: text
        description: The text content of the message.
        required: true
      kind:
        name: kind
        description: The kind of object, always `text`.
        aliases:
        - type
        required: true
        equals_string: text
    class_uri: mcp:McpTextContent
    extra_slots:
      allowed: true
  McpTextResourceContents:
    name: McpTextResourceContents
    definition_uri: https://w3id.org/lmodel/mcp/McpTextResourceContents
    description: MCP's `TextResourceContents`.
    in_subset:
    - content
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:TextResourceContents
    is_a: McpResourceContents
    slots:
    - mcpTextResourceContents__meta
    - mcpTextResourceContents__mime_type
    - mcpTextResourceContents__text
    - mcpTextResourceContents__uri
    attributes:
      meta:
        name: meta
        description: "Represents the contents of a `_meta` field, which clients and\
          \ servers use to attach additional metadata to their interactions.\n\nCertain\
          \ key names are reserved by MCP for protocol-level metadata; implementations\
          \ MUST NOT make assumptions about values at these keys. Additionally, specific\
          \ schema definitions may reserve particular names for purpose-specific metadata,\
          \ as declared in those definitions.\n\nValid keys have two segments:\n\n\
          **Prefix:**\n- Optional \u2014 if specified, MUST be a series of _labels_\
          \ separated by dots (`.`), followed by a slash (`/`).\n- Labels MUST start\
          \ with a letter and end with a letter or digit. Interior characters may\
          \ be letters, digits, or hyphens (`-`).\n- Implementations SHOULD use reverse\
          \ DNS notation (e.g., `com.example/` rather than `example.com/`).\n- Any\
          \ prefix where the second label is `modelcontextprotocol` or `mcp` is **reserved**\
          \ for MCP use. For example: `io.modelcontextprotocol/`, `dev.mcp/`, `org.modelcontextprotocol.api/`,\
          \ and `com.mcp.tools/` are all reserved. However, `com.example.mcp/` is\
          \ NOT reserved, as the second label is `example`.\n\n**Name:**\n- Unless\
          \ empty, MUST start and end with an alphanumeric character (`[a-z0-9A-Z]`).\n\
          - Interior characters may be alphanumeric, hyphens (`-`), underscores (`_`),\
          \ or dots (`.`)."
        alias: _meta
        range: McpMetaObject
      mime_type:
        name: mime_type
        description: The MIME type of this resource, if known.
        alias: mimeType
      text:
        name: text
        description: The text of the item. This must only be set if the item can actually
          be represented as text (not binary data).
        required: true
      uri:
        name: uri
        description: The URI of this resource.
        range: uri
        required: true
    class_uri: mcp:McpTextResourceContents
    extra_slots:
      allowed: true
  McpTitledMultiSelectEnumSchema:
