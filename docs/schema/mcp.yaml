    - McpTitledSingleSelectEnumSchema_title
    - mcpTitledSingleSelectEnumSchema__default
    - mcpTitledSingleSelectEnumSchema__one_of
    - mcpTitledSingleSelectEnumSchema__kind
    slot_usage:
      description:
        name: description
        description: Optional description for the enum field.
      title:
        name: title
        description: Optional title for the enum field.
    attributes:
      default:
        name: default
        description: Optional default value.
      one_of:
        name: one_of
        description: Array of enum options with values and display labels.
        alias: oneOf
        range: McpTitledSingleSelectEnumSchemaOneOf
        required: true
        multivalued: true
        inlined_as_list: true
      kind:
        name: kind
