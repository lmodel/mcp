        required: true
        any_of:
        - range: string
        - range: integer
      jsonrpc:
        name: jsonrpc
        description: The JSON-RPC version, always `2.0`.
        required: true
        equals_string: '2.0'
      method:
        name: method
        description: The method's name, always `completion/complete`.
        required: true
        equals_string: completion/complete
      params:
        name: params
        description: Parameters for a `completion/complete` request.
        range: McpCompleteRequestParams
        required: true
    class_uri: mcp:McpCompleteRequest
    extra_slots:
      allowed: true
  McpCompleteRequestParams:
    name: McpCompleteRequestParams
    definition_uri: https://w3id.org/lmodel/mcp/McpCompleteRequestParams
    description: Parameters for a `completion/complete` request.
    in_subset:
    - completion_complete
    from_schema: https://w3id.org/lmodel/mcp
