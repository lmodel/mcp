  McpCompleteResult:
    name: McpCompleteResult
    definition_uri: https://w3id.org/lmodel/mcp/McpCompleteResult
    description: The result returned by the server for a {@link CompleteRequestcompletion/complete}
      request.
    in_subset:
    - completion_complete
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:CompleteResult
    is_a: McpResult
    slots:
    - mcpCompleteResult__meta
    - mcpCompleteResult__completion
    - mcpCompleteResult__result_type
    attributes:
      meta:
        name: meta
        description: Extends {@link MetaObject} with additional result-specific fields.
          All key naming rules from `MetaObject` apply.
        alias: _meta
        range: McpResultMetaObject
      completion:
        name: completion
        description: The completion values and whether more are available.
        range: McpCompleteResultCompletion
        required: true
      result_type:
        name: result_type
        description: 'Indicates the type of the result, which allows the client to
          determine

          how to parse the result object.


          Servers implementing this protocol version MUST include this field.

          For backward compatibility, when a client receives a result from a

          server implementing an earlier protocol version (which does not include

          `resultType`), the client MUST treat the absent field as `"complete"`.'
        alias: resultType
        required: true
    class_uri: mcp:McpCompleteResult
    extra_slots:
      allowed: true
  McpCompleteResultCompletion:
    name: McpCompleteResultCompletion
    definition_uri: https://w3id.org/lmodel/mcp/McpCompleteResultCompletion
    description: The object MCP's `CompleteResult` holds under `completion`.
    in_subset:
    - completion_complete
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:CompleteResult/properties/completion
    slots:
    - mcpCompleteResultCompletion__has_more
    - mcpCompleteResultCompletion__total
    - mcpCompleteResultCompletion__values
    attributes:
      has_more:
        name: has_more
        description: Indicates whether there are additional completion options beyond
          those provided in the current response, even if the exact total is unknown.
        alias: hasMore
        range: boolean
      total:
        name: total
        description: The total number of completion options available. This can exceed
          the number of values actually sent in the response.
        range: integer
      values:
        name: values
        description: An array of completion values. Must not exceed 100 items.
        required: true
        multivalued: true
        maximum_cardinality: 100
    class_uri: mcp:McpCompleteResultCompletion
    extra_slots:
      allowed: true
  McpCompleteResultResponse:
    name: McpCompleteResultResponse
    definition_uri: https://w3id.org/lmodel/mcp/McpCompleteResultResponse
    description: A successful response from the server for a {@link CompleteRequestcompletion/complete}
      request.
    in_subset:
    - completion_complete
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:CompleteResultResponse
    is_a: McpJSONRPCResultResponse
    slots:
    - mcpCompleteResultResponse__identifier
    - mcpCompleteResultResponse__jsonrpc
    - mcpCompleteResultResponse__result
    attributes:
      identifier:
        name: identifier
        description: A uniquely identifying ID for a request in JSON-RPC.
        aliases:
        - id
        required: true
        any_of:
        - range: string
        - range: integer
      jsonrpc:
        name: jsonrpc
        description: The JSON-RPC version, always `2.0`.
        required: true
        equals_string: '2.0'
      result:
        name: result
        description: The result returned by the server for a {@link CompleteRequestcompletion/complete}
          request.
        range: McpCompleteResult
        required: true
    class_uri: mcp:McpCompleteResultResponse
    extra_slots:
      allowed: true
  McpContentBlock:
    name: McpContentBlock
    definition_uri: https://w3id.org/lmodel/mcp/McpContentBlock
    description: One of `TextContent`, `ImageContent`, `AudioContent`, `ResourceLink`,
      `EmbeddedResource`.
    in_subset:
    - content
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
