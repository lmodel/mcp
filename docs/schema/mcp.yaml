  McpJSONRPCResultResponse:
    name: McpJSONRPCResultResponse
    definition_uri: https://w3id.org/lmodel/mcp/McpJSONRPCResultResponse
    description: A successful (non-error) response to a request.
    in_subset:
    - json_rpc
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:JSONRPCResultResponse
    slots:
    - mcpJSONRPCResultResponse__identifier
    - mcpJSONRPCResultResponse__jsonrpc
    - mcpJSONRPCResultResponse__result
    attributes:
      identifier:
        name: identifier
        description: A uniquely identifying ID for a request in JSON-RPC.
        aliases:
        - id
        required: true
        any_of:
        - range: string
        - range: integer
      jsonrpc:
        name: jsonrpc
        description: The JSON-RPC version, always `2.0`.
        required: true
        equals_string: '2.0'
      result:
        name: result
        description: Common result fields.
        range: McpResult
        required: true
    class_uri: mcp:McpJSONRPCResultResponse
    extra_slots:
      allowed: true
  McpJSONValue:
    name: McpJSONValue
    definition_uri: https://w3id.org/lmodel/mcp/McpJSONValue
    description: One of `JSONObject`.
    comments:
    - Any JSON value. MCP's schema.json leaves out null and numbers with a fraction,
      which schema.ts allows; this class takes any JSON.
    in_subset:
    - common_types
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - linkml:Any
    - mcp_schema:JSONValue
    class_uri: linkml:Any
    extra_slots:
      allowed: true
  McpLegacyTitledEnumSchema:
    name: McpLegacyTitledEnumSchema
    definition_uri: https://w3id.org/lmodel/mcp/McpLegacyTitledEnumSchema
    description: 'Use {@link TitledSingleSelectEnumSchema} instead.

      This interface will be removed in a future version.'
    in_subset:
    - elicitation_create
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:LegacyTitledEnumSchema
    slots:
    - McpLegacyTitledEnumSchema_description
    - McpLegacyTitledEnumSchema_title
    - mcpLegacyTitledEnumSchema__default
    - mcpLegacyTitledEnumSchema__enum
    - mcpLegacyTitledEnumSchema__enum_names
    - mcpLegacyTitledEnumSchema__kind
    slot_usage:
      description:
        name: description
        description: A description of the field for the user.
      title:
        name: title
        description: A title for the field.
    attributes:
      default:
        name: default
        description: The value the field takes when the user gives none.
      enum:
        name: enum
        description: The values the field offers.
        required: true
        multivalued: true
      enum_names:
        name: enum_names
        description: '(Legacy) Display names for enum values.

          Non-standard according to JSON schema 2020-12.'
        alias: enumNames
        multivalued: true
      kind:
        name: kind
        description: The kind of object, always `string`.
        aliases:
        - type
        required: true
        equals_string: string
    class_uri: mcp:McpLegacyTitledEnumSchema
    extra_slots:
      allowed: true
  McpListPromptsRequest:
    name: McpListPromptsRequest
    definition_uri: https://w3id.org/lmodel/mcp/McpListPromptsRequest
    description: Sent from the client to request a list of prompts and prompt templates
      the server has.
    in_subset:
    - prompts_list
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:ListPromptsRequest
    is_a: McpPaginatedRequest
    slots:
    - mcpListPromptsRequest__identifier
    - mcpListPromptsRequest__jsonrpc
    - mcpListPromptsRequest__method
    - mcpListPromptsRequest__params
    attributes:
      identifier:
        name: identifier
        description: A uniquely identifying ID for a request in JSON-RPC.
        aliases:
        - id
        required: true
        any_of:
        - range: string
        - range: integer
      jsonrpc:
        name: jsonrpc
        description: The JSON-RPC version, always `2.0`.
        required: true
        equals_string: '2.0'
      method:
        name: method
        description: The method's name, always `prompts/list`.
        required: true
        equals_string: prompts/list
      params:
        name: params
        description: Common params for paginated requests.
        range: McpPaginatedRequestParams
        required: true
    class_uri: mcp:McpListPromptsRequest
    extra_slots:
      allowed: true
  McpListPromptsResult:
    name: McpListPromptsResult
    definition_uri: https://w3id.org/lmodel/mcp/McpListPromptsResult
    description: The result returned by the server for a {@link ListPromptsRequestprompts/list}
      request.
    in_subset:
    - prompts_list
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:ListPromptsResult
    is_a: McpPaginatedResult
    mixins:
    - McpCacheableResult
    slots:
    - mcpListPromptsResult__meta
    - mcpListPromptsResult__cache_scope
    - mcpListPromptsResult__next_cursor
    - mcpListPromptsResult__prompts
    - mcpListPromptsResult__result_type
    - mcpListPromptsResult__ttl_ms
    attributes:
      meta:
        name: meta
        description: Extends {@link MetaObject} with additional result-specific fields.
          All key naming rules from `MetaObject` apply.
        alias: _meta
        range: McpResultMetaObject
      cache_scope:
        name: cache_scope
        description: "Indicates the intended scope of the cached response, analogous\
          \ to HTTP\n`Cache-Control: public` vs `Cache-Control: private`.\n\n- `\"\
          public\"`: The response does not contain user-specific data. Any\n  client\
          \ or intermediary (e.g., shared gateway, caching proxy) MAY cache\n  the\
          \ response and serve it across authorization contexts.\n- `\"private\"`:\
          \ The response MAY be cached and reused only within the\n  same authorization\
          \ context. Caches MUST NOT be shared across\n  authorization contexts (e.g.,\
          \ a different access token requires a\n  different cache)."
        alias: cacheScope
        range: McpCacheScope
        required: true
      next_cursor:
        name: next_cursor
        description: 'An opaque token representing the pagination position after the
          last returned result.

          If present, there may be more results available.'
        alias: nextCursor
      prompts:
        name: prompts
        description: A prompt or prompt template that the server offers.
        range: McpPrompt
        required: true
        multivalued: true
        inlined_as_list: true
      result_type:
        name: result_type
        description: 'Indicates the type of the result, which allows the client to
          determine

          how to parse the result object.


          Servers implementing this protocol version MUST include this field.

          For backward compatibility, when a client receives a result from a

          server implementing an earlier protocol version (which does not include

          `resultType`), the client MUST treat the absent field as `"complete"`.'
        alias: resultType
        required: true
      ttl_ms:
        name: ttl_ms
        description: "A hint from the server indicating how long (in milliseconds)\
          \ the\nclient MAY cache this response before re-fetching. Semantics are\n\
          analogous to HTTP Cache-Control max-age.\n\n- If 0, The response SHOULD\
          \ be considered immediately stale,\n  The client MAY re-fetch every time\
          \ the result is needed.\n- If positive, the client SHOULD consider the result\
          \ fresh for this many\n  milliseconds after receiving the response."
        alias: ttlMs
        range: integer
        required: true
        minimum_value: 0
    class_uri: mcp:McpListPromptsResult
    extra_slots:
      allowed: true
  McpListPromptsResultResponse:
    name: McpListPromptsResultResponse
    definition_uri: https://w3id.org/lmodel/mcp/McpListPromptsResultResponse
    description: A successful response from the server for a {@link ListPromptsRequestprompts/list}
      request.
    in_subset:
    - prompts_list
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:ListPromptsResultResponse
    is_a: McpJSONRPCResultResponse
