classes:
  McpAnnotations:
    name: McpAnnotations
    definition_uri: https://w3id.org/lmodel/mcp/McpAnnotations
    description: Optional annotations for the client. The client can use annotations
      to inform how objects are used or displayed
    in_subset:
    - common_types
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:Annotations
    slots:
    - mcpAnnotations__intended_audience
    - mcpAnnotations__last_modified
    - mcpAnnotations__priority
    attributes:
      intended_audience:
        name: intended_audience
        description: 'Describes who the intended audience of this object or data is.


          It can include multiple entries to indicate content useful for multiple
          audiences (e.g., `["user", "assistant"]`).'
        aliases:
        - audience
        range: McpRole
        multivalued: true
      last_modified:
        name: last_modified
        description: 'The moment the resource was last modified, as an ISO 8601 formatted
          string.


          Should be an ISO 8601 formatted string (e.g., "2025-01-12T15:00:58Z").


          Examples: last activity timestamp in an open file, timestamp when the resource

          was attached, etc.'
        alias: lastModified
      priority:
        name: priority
        description: 'Describes how important this data is for operating the server.


          A value of 1 means "most important," and indicates that the data is

          effectively required, while 0 means "least important," and indicates that

          the data is entirely optional.'
        range: float
        minimum_value: 0
        maximum_value: 1
    class_uri: mcp:McpAnnotations
    extra_slots:
      allowed: true
  McpAudioContent:
    name: McpAudioContent
    definition_uri: https://w3id.org/lmodel/mcp/McpAudioContent
    description: Audio provided to or from an LLM.
    in_subset:
    - content
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:AudioContent
    slots:
    - mcpAudioContent__meta
    - mcpAudioContent__annotations
    - mcpAudioContent__data
    - mcpAudioContent__mime_type
    - mcpAudioContent__kind
    attributes:
      meta:
        name: meta
        description: "Represents the contents of a `_meta` field, which clients and\
          \ servers use to attach additional metadata to their interactions.\n\nCertain\
          \ key names are reserved by MCP for protocol-level metadata; implementations\
          \ MUST NOT make assumptions about values at these keys. Additionally, specific\
          \ schema definitions may reserve particular names for purpose-specific metadata,\
          \ as declared in those definitions.\n\nValid keys have two segments:\n\n\
          **Prefix:**\n- Optional \u2014 if specified, MUST be a series of _labels_\
          \ separated by dots (`.`), followed by a slash (`/`).\n- Labels MUST start\
          \ with a letter and end with a letter or digit. Interior characters may\
          \ be letters, digits, or hyphens (`-`).\n- Implementations SHOULD use reverse\
          \ DNS notation (e.g., `com.example/` rather than `example.com/`).\n- Any\
          \ prefix where the second label is `modelcontextprotocol` or `mcp` is **reserved**\
          \ for MCP use. For example: `io.modelcontextprotocol/`, `dev.mcp/`, `org.modelcontextprotocol.api/`,\
          \ and `com.mcp.tools/` are all reserved. However, `com.example.mcp/` is\
          \ NOT reserved, as the second label is `example`.\n\n**Name:**\n- Unless\
          \ empty, MUST start and end with an alphanumeric character (`[a-z0-9A-Z]`).\n\
          - Interior characters may be alphanumeric, hyphens (`-`), underscores (`_`),\
          \ or dots (`.`)."
        alias: _meta
        range: McpMetaObject
      annotations:
        name: annotations
        description: Optional annotations for the client.
        range: McpAnnotations
      data:
        name: data
        description: The base64-encoded audio data.
        range: McpBase64
        required: true
      mime_type:
        name: mime_type
        description: The MIME type of the audio. Different providers may support different
          audio types.
        alias: mimeType
        required: true
      kind:
        name: kind
        description: The kind of object, always `audio`.
        aliases:
        - type
        required: true
        equals_string: audio
    class_uri: mcp:McpAudioContent
    extra_slots:
      allowed: true
  McpBaseMetadata:
    name: McpBaseMetadata
    definition_uri: https://w3id.org/lmodel/mcp/McpBaseMetadata
    description: Base interface for metadata with name (identifier) and title (display
      name) properties.
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:BaseMetadata
    slots:
    - McpBaseMetadata_name
    - McpBaseMetadata_title
    slot_usage:
      name:
        name: name
        description: Intended for programmatic or logical use, but used as a display
          name in past specs or fallback (if title isn't present).
        required: true
      title:
        name: title
        description: "Intended for UI and end-user contexts \u2014 optimized to be\
          \ human-readable and easily understood,\neven by those unfamiliar with domain-specific\
          \ terminology.\n\nIf not provided, the name should be used for display (except\
          \ for {@link Tool},\nwhere `annotations.title` should be given precedence\
          \ over using `name`,\nif present)."
    class_uri: mcp:McpBaseMetadata
    extra_slots:
      allowed: true
  McpBlobResourceContents:
    name: McpBlobResourceContents
    definition_uri: https://w3id.org/lmodel/mcp/McpBlobResourceContents
    description: MCP's `BlobResourceContents`.
    in_subset:
    - content
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:BlobResourceContents
    is_a: McpResourceContents
    slots:
    - mcpBlobResourceContents__meta
    - mcpBlobResourceContents__blob
    - mcpBlobResourceContents__mime_type
    - mcpBlobResourceContents__uri
    attributes:
      meta:
        name: meta
        description: "Represents the contents of a `_meta` field, which clients and\
          \ servers use to attach additional metadata to their interactions.\n\nCertain\
          \ key names are reserved by MCP for protocol-level metadata; implementations\
          \ MUST NOT make assumptions about values at these keys. Additionally, specific\
          \ schema definitions may reserve particular names for purpose-specific metadata,\
          \ as declared in those definitions.\n\nValid keys have two segments:\n\n\
          **Prefix:**\n- Optional \u2014 if specified, MUST be a series of _labels_\
          \ separated by dots (`.`), followed by a slash (`/`).\n- Labels MUST start\
          \ with a letter and end with a letter or digit. Interior characters may\
          \ be letters, digits, or hyphens (`-`).\n- Implementations SHOULD use reverse\
          \ DNS notation (e.g., `com.example/` rather than `example.com/`).\n- Any\
          \ prefix where the second label is `modelcontextprotocol` or `mcp` is **reserved**\
          \ for MCP use. For example: `io.modelcontextprotocol/`, `dev.mcp/`, `org.modelcontextprotocol.api/`,\
          \ and `com.mcp.tools/` are all reserved. However, `com.example.mcp/` is\
          \ NOT reserved, as the second label is `example`.\n\n**Name:**\n- Unless\
          \ empty, MUST start and end with an alphanumeric character (`[a-z0-9A-Z]`).\n\
          - Interior characters may be alphanumeric, hyphens (`-`), underscores (`_`),\
          \ or dots (`.`)."
        alias: _meta
        range: McpMetaObject
      blob:
        name: blob
        description: A base64-encoded string representing the binary data of the item.
        range: McpBase64
        required: true
      mime_type:
        name: mime_type
        description: The MIME type of this resource, if known.
        alias: mimeType
      uri:
        name: uri
        description: The URI of this resource.
        range: uri
        required: true
    class_uri: mcp:McpBlobResourceContents
    extra_slots:
      allowed: true
  McpBooleanSchema:
    name: McpBooleanSchema
    definition_uri: https://w3id.org/lmodel/mcp/McpBooleanSchema
    description: MCP's `BooleanSchema`.
    in_subset:
    - elicitation_create
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:BooleanSchema
    slots:
    - McpBooleanSchema_description
    - McpBooleanSchema_title
    - mcpBooleanSchema__default
    - mcpBooleanSchema__kind
    slot_usage:
      description:
        name: description
        description: A description of the field for the user.
      title:
        name: title
        description: A title for the field.
    attributes:
      default:
        name: default
        description: The value the field takes when the user gives none.
        range: boolean
      kind:
        name: kind
        description: The kind of object, always `boolean`.
        aliases:
        - type
        required: true
        equals_string: boolean
    class_uri: mcp:McpBooleanSchema
    extra_slots:
      allowed: true
  McpCacheableResult:
    name: McpCacheableResult
    definition_uri: https://w3id.org/lmodel/mcp/McpCacheableResult
    description: A result that supports a time-to-live (TTL) hint for client-side
      caching.
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:CacheableResult
    is_a: McpResult
    slots:
    - mcpCacheableResult__meta
    - mcpCacheableResult__cache_scope
    - mcpCacheableResult__result_type
    - mcpCacheableResult__ttl_ms
    attributes:
      meta:
        name: meta
        description: Extends {@link MetaObject} with additional result-specific fields.
          All key naming rules from `MetaObject` apply.
        alias: _meta
        range: McpResultMetaObject
      cache_scope:
        name: cache_scope
        description: "Indicates the intended scope of the cached response, analogous\
          \ to HTTP\n`Cache-Control: public` vs `Cache-Control: private`.\n\n- `\"\
          public\"`: The response does not contain user-specific data. Any\n  client\
          \ or intermediary (e.g., shared gateway, caching proxy) MAY cache\n  the\
          \ response and serve it across authorization contexts.\n- `\"private\"`:\
          \ The response MAY be cached and reused only within the\n  same authorization\
          \ context. Caches MUST NOT be shared across\n  authorization contexts (e.g.,\
          \ a different access token requires a\n  different cache)."
        alias: cacheScope
        range: McpCacheScope
        required: true
      result_type:
        name: result_type
        description: 'Indicates the type of the result, which allows the client to
          determine

          how to parse the result object.


          Servers implementing this protocol version MUST include this field.

          For backward compatibility, when a client receives a result from a

          server implementing an earlier protocol version (which does not include

          `resultType`), the client MUST treat the absent field as `"complete"`.'
        alias: resultType
        required: true
      ttl_ms:
        name: ttl_ms
        description: "A hint from the server indicating how long (in milliseconds)\
          \ the\nclient MAY cache this response before re-fetching. Semantics are\n\
          analogous to HTTP Cache-Control max-age.\n\n- If 0, The response SHOULD\
          \ be considered immediately stale,\n  The client MAY re-fetch every time\
          \ the result is needed.\n- If positive, the client SHOULD consider the result\
          \ fresh for this many\n  milliseconds after receiving the response."
        alias: ttlMs
        range: integer
        required: true
        minimum_value: 0
    class_uri: mcp:McpCacheableResult
    extra_slots:
      allowed: true
  McpCallToolRequest:
    name: McpCallToolRequest
    definition_uri: https://w3id.org/lmodel/mcp/McpCallToolRequest
    description: Used by the client to invoke a tool provided by the server.
    in_subset:
    - tools_call
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:CallToolRequest
    is_a: McpJSONRPCRequest
    slots:
    - mcpCallToolRequest__identifier
    - mcpCallToolRequest__jsonrpc
    - mcpCallToolRequest__method
    - mcpCallToolRequest__params
    attributes:
      identifier:
        name: identifier
        description: A uniquely identifying ID for a request in JSON-RPC.
        aliases:
        - id
        required: true
        any_of:
        - range: string
        - range: integer
      jsonrpc:
        name: jsonrpc
        description: The JSON-RPC version, always `2.0`.
        required: true
        equals_string: '2.0'
      method:
        name: method
        description: The method's name, always `tools/call`.
        required: true
        equals_string: tools/call
      params:
        name: params
        description: Parameters for a `tools/call` request.
        range: McpCallToolRequestParams
        required: true
    class_uri: mcp:McpCallToolRequest
    extra_slots:
      allowed: true
  McpCallToolRequestParams:
    name: McpCallToolRequestParams
    definition_uri: https://w3id.org/lmodel/mcp/McpCallToolRequestParams
    description: Parameters for a `tools/call` request.
    in_subset:
    - tools_call
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:CallToolRequestParams
    is_a: McpInputResponseRequestParams
    slots:
    - McpCallToolRequestParams_name
    - mcpCallToolRequestParams__meta
    - mcpCallToolRequestParams__arguments
    - mcpCallToolRequestParams__input_responses
    - mcpCallToolRequestParams__request_state
    slot_usage:
      name:
        name: name
        description: The name of the tool.
        required: true
    attributes:
      meta:
        name: meta
        description: Extends {@link MetaObject} with additional request-specific fields.
          All key naming rules from `MetaObject` apply.
        alias: _meta
        range: McpRequestMetaObject
        required: true
      arguments:
        name: arguments
        description: Arguments to use for the tool call.
        range: McpJSONObject
      input_responses:
        name: input_responses
        description: 'A map of client responses to server-initiated requests.

          Keys correspond to the keys in the {@link InputRequests} map;

          values are the client''s result for each request.'
        alias: inputResponses
        range: McpInputResponses
      request_state:
        name: request_state
        description: State the server handed out with an input-required result, sent
          back unchanged when the request is retried.
        alias: requestState
    class_uri: mcp:McpCallToolRequestParams
    extra_slots:
      allowed: true
  McpCallToolResult:
    name: McpCallToolResult
    definition_uri: https://w3id.org/lmodel/mcp/McpCallToolResult
    description: The result returned by the server for a {@link CallToolRequesttools/call}
      request.
    in_subset:
    - tools_call
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:CallToolResult
    is_a: McpResult
    slots:
    - mcpCallToolResult__meta
    - mcpCallToolResult__content
    - mcpCallToolResult__is_error
    - mcpCallToolResult__result_type
    - mcpCallToolResult__structured_content
    attributes:
      meta:
        name: meta
        description: Extends {@link MetaObject} with additional result-specific fields.
          All key naming rules from `MetaObject` apply.
        alias: _meta
        range: McpResultMetaObject
      content:
        name: content
        description: A list of content objects that represent the unstructured result
          of the tool call.
        range: McpContentBlock
        required: true
        multivalued: true
        inlined_as_list: true
      is_error:
        name: is_error
        description: 'Whether the tool call ended in an error.


          If not set, this is assumed to be false (the call was successful).


          Any errors that originate from the tool SHOULD be reported inside the result

          object, with `isError` set to true, _not_ as an MCP protocol-level error

          response. Otherwise, the LLM would not be able to see that an error occurred

          and self-correct.


          However, any errors in _finding_ the tool, an error indicating that the

          server does not support tool calls, or any other exceptional conditions,

          should be reported as an MCP error response.'
        alias: isError
        range: boolean
      result_type:
        name: result_type
        description: 'Indicates the type of the result, which allows the client to
          determine

          how to parse the result object.


          Servers implementing this protocol version MUST include this field.

          For backward compatibility, when a client receives a result from a

          server implementing an earlier protocol version (which does not include

          `resultType`), the client MUST treat the absent field as `"complete"`.'
        alias: resultType
        required: true
      structured_content:
        name: structured_content
        description: 'An optional JSON value that represents the structured result
          of the tool call.


          This can be any JSON value (object, array, string, number, boolean, or null)

          that conforms to the tool''s outputSchema if one is defined.'
        alias: structuredContent
        range: McpJSONValue
    class_uri: mcp:McpCallToolResult
    extra_slots:
      allowed: true
  McpCallToolResultResponse:
    name: McpCallToolResultResponse
    definition_uri: https://w3id.org/lmodel/mcp/McpCallToolResultResponse
    description: A successful response from the server for a {@link CallToolRequesttools/call}
      request.
    in_subset:
    - tools_call
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:CallToolResultResponse
    is_a: McpJSONRPCResultResponse
    slots:
    - mcpCallToolResultResponse__identifier
    - mcpCallToolResultResponse__jsonrpc
    - mcpCallToolResultResponse__result
    attributes:
      identifier:
        name: identifier
        description: A uniquely identifying ID for a request in JSON-RPC.
        aliases:
        - id
        required: true
        any_of:
        - range: string
        - range: integer
      jsonrpc:
        name: jsonrpc
        description: The JSON-RPC version, always `2.0`.
        required: true
        equals_string: '2.0'
      result:
        name: result
        description: What the request returned.
        required: true
        any_of:
        - range: McpInputRequiredResult
        - range: McpCallToolResult
    class_uri: mcp:McpCallToolResultResponse
    extra_slots:
      allowed: true
  McpCancelledNotification:
    name: McpCancelledNotification
    definition_uri: https://w3id.org/lmodel/mcp/McpCancelledNotification
    description: 'This notification is sent by the client to indicate that it is cancelling
      a request it previously issued.


      On stdio, the server also sends this notification, solely to terminate a {@link
      SubscriptionsListenRequestsubscriptions/listen} stream: it references the ID
      of the `subscriptions/listen` request that opened the stream. Servers MUST NOT
      use this notification to cancel any other request.


      The request SHOULD still be in-flight, but due to communication latency, it
      is always possible that this notification MAY arrive after the request has already
      finished.


      This notification indicates that the result will be unused, so any associated
      processing SHOULD cease.'
    in_subset:
    - notifications_cancelled
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:CancelledNotification
    is_a: McpJSONRPCNotification
    slots:
    - mcpCancelledNotification__jsonrpc
    - mcpCancelledNotification__method
    - mcpCancelledNotification__params
    attributes:
      jsonrpc:
        name: jsonrpc
        description: The JSON-RPC version, always `2.0`.
        required: true
        equals_string: '2.0'
      method:
        name: method
        description: The method's name, always `notifications/cancelled`.
        required: true
        equals_string: notifications/cancelled
      params:
        name: params
        description: Parameters for a `notifications/cancelled` notification.
        range: McpCancelledNotificationParams
        required: true
    class_uri: mcp:McpCancelledNotification
    extra_slots:
      allowed: true
  McpCancelledNotificationParams:
    name: McpCancelledNotificationParams
    definition_uri: https://w3id.org/lmodel/mcp/McpCancelledNotificationParams
    description: Parameters for a `notifications/cancelled` notification.
    in_subset:
    - notifications_cancelled
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:CancelledNotificationParams
    is_a: McpNotificationParams
    slots:
    - mcpCancelledNotificationParams__meta
    - mcpCancelledNotificationParams__reason_text
    - mcpCancelledNotificationParams__request_id
    attributes:
      meta:
        name: meta
        description: Extends {@link MetaObject} with additional notification-specific
          fields. All key naming rules from `MetaObject` apply.
        alias: _meta
        range: McpNotificationMetaObject
      reason_text:
        name: reason_text
        description: An optional string describing the reason for the cancellation.
          This MAY be logged or presented to the user.
        aliases:
        - reason
      request_id:
        name: request_id
        description: 'The ID of the request to cancel.


          This MUST correspond to the ID of a request the client previously issued.'
        alias: requestId
        required: true
        any_of:
        - range: string
        - range: integer
    class_uri: mcp:McpCancelledNotificationParams
    extra_slots:
      allowed: true
  McpClientCapabilities:
    name: McpClientCapabilities
    definition_uri: https://w3id.org/lmodel/mcp/McpClientCapabilities
    description: 'Capabilities a client may support. Known capabilities are defined
      here, in this schema, but this is not a closed set: any client can define its
      own, additional capabilities.'
    in_subset:
    - server_discover
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:ClientCapabilities
    slots:
    - mcpClientCapabilities__elicitation
    - mcpClientCapabilities__experimental
    - mcpClientCapabilities__extensions
    - mcpClientCapabilities__roots
    - mcpClientCapabilities__sampling
    attributes:
      elicitation:
        name: elicitation
        description: Present if the client supports elicitation from the server.
        range: McpClientCapabilitiesElicitation
      experimental:
        name: experimental
        description: Experimental, non-standard capabilities that the client supports.
        range: McpClientCapabilitiesExperimental
      extensions:
        name: extensions
        description: 'Optional MCP extensions that the client supports. Keys are extension
          identifiers

          (e.g., "io.modelcontextprotocol/oauth-client-credentials"), and values are

          per-extension settings objects. An empty object indicates support with no
          settings.


          Keys MUST follow the {@link MetaObject`_meta` key naming rules}, with a

          mandatory prefix.'
        range: McpClientCapabilitiesExtensions
      roots:
        name: roots
        description: Present if the client supports listing roots.
        range: McpClientCapabilitiesRoots
      sampling:
        name: sampling
        description: Present if the client supports sampling from an LLM.
        range: McpClientCapabilitiesSampling
    class_uri: mcp:McpClientCapabilities
    extra_slots:
      allowed: true
  McpClientCapabilitiesElicitation:
    name: McpClientCapabilitiesElicitation
    definition_uri: https://w3id.org/lmodel/mcp/McpClientCapabilitiesElicitation
    description: Present if the client supports elicitation from the server.
    in_subset:
    - server_discover
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:ClientCapabilities/properties/elicitation
    slots:
    - mcpClientCapabilitiesElicitation__form
    - mcpClientCapabilitiesElicitation__url_settings
    attributes:
      form:
        name: form
        description: Settings for elicitation by form.
        range: McpJSONObject
      url_settings:
        name: url_settings
        description: Settings for elicitation by URL.
        aliases:
        - url
        range: McpJSONObject
    class_uri: mcp:McpClientCapabilitiesElicitation
    extra_slots:
      allowed: true
  McpClientCapabilitiesExperimental:
    name: McpClientCapabilitiesExperimental
    definition_uri: https://w3id.org/lmodel/mcp/McpClientCapabilitiesExperimental
    description: Experimental, non-standard capabilities that the client supports.
    in_subset:
    - server_discover
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:ClientCapabilities/properties/experimental
    class_uri: mcp:McpClientCapabilitiesExperimental
    extra_slots:
      range_expression:
        range: McpJSONObject
  McpClientCapabilitiesExtensions:
    name: McpClientCapabilitiesExtensions
    definition_uri: https://w3id.org/lmodel/mcp/McpClientCapabilitiesExtensions
    description: 'Optional MCP extensions that the client supports. Keys are extension
      identifiers

      (e.g., "io.modelcontextprotocol/oauth-client-credentials"), and values are

      per-extension settings objects. An empty object indicates support with no settings.


      Keys MUST follow the {@link MetaObject`_meta` key naming rules}, with a

      mandatory prefix.'
    in_subset:
    - server_discover
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:ClientCapabilities/properties/extensions
    class_uri: mcp:McpClientCapabilitiesExtensions
    extra_slots:
      range_expression:
        range: McpJSONObject
  McpClientCapabilitiesRoots:
    name: McpClientCapabilitiesRoots
    definition_uri: https://w3id.org/lmodel/mcp/McpClientCapabilitiesRoots
    description: Present if the client supports listing roots.
    in_subset:
    - server_discover
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:ClientCapabilities/properties/roots
    class_uri: mcp:McpClientCapabilitiesRoots
    extra_slots:
      allowed: true
  McpClientCapabilitiesSampling:
    name: McpClientCapabilitiesSampling
    definition_uri: https://w3id.org/lmodel/mcp/McpClientCapabilitiesSampling
    description: Present if the client supports sampling from an LLM.
    in_subset:
    - server_discover
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:ClientCapabilities/properties/sampling
    slots:
    - mcpClientCapabilitiesSampling__context_info
    - mcpClientCapabilitiesSampling__tools
    attributes:
      context_info:
        name: context_info
        description: 'Whether the client supports context inclusion via `includeContext`
          parameter.

          If not declared, servers SHOULD only use `includeContext: "none"` (or omit
          it).'
        aliases:
        - context
        range: McpJSONObject
      tools:
        name: tools
        description: Whether the client supports tool use via `tools` and `toolChoice`
          parameters.
        range: McpJSONObject
    class_uri: mcp:McpClientCapabilitiesSampling
    extra_slots:
      allowed: true
  McpClientNotification:
    name: McpClientNotification
    definition_uri: https://w3id.org/lmodel/mcp/McpClientNotification
    description: 'This notification is sent by the client to indicate that it is cancelling
      a request it previously issued.


      On stdio, the server also sends this notification, solely to terminate a {@link
      SubscriptionsListenRequestsubscriptions/listen} stream: it references the ID
      of the `subscriptions/listen` request that opened the stream. Servers MUST NOT
      use this notification to cancel any other request.


      The request SHOULD still be in-flight, but due to communication latency, it
      is always possible that this notification MAY arrive after the request has already
      finished.


      This notification indicates that the result will be unused, so any associated
      processing SHOULD cease.'
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:ClientNotification
    is_a: McpCancelledNotification
    slots:
    - mcpClientNotification__jsonrpc
    - mcpClientNotification__method
    - mcpClientNotification__params
    attributes:
      jsonrpc:
        name: jsonrpc
        description: The JSON-RPC version, always `2.0`.
        required: true
        equals_string: '2.0'
      method:
        name: method
        description: The method's name, always `notifications/cancelled`.
        required: true
        equals_string: notifications/cancelled
      params:
        name: params
        description: Parameters for a `notifications/cancelled` notification.
        range: McpCancelledNotificationParams
        required: true
    class_uri: mcp:McpClientNotification
    extra_slots:
      allowed: true
  McpClientRequest:
    name: McpClientRequest
    definition_uri: https://w3id.org/lmodel/mcp/McpClientRequest
    description: One of `DiscoverRequest`, `ListResourcesRequest`, `ListResourceTemplatesRequest`,
      `ReadResourceRequest`, `SubscriptionsListenRequest`, `ListPromptsRequest`, `GetPromptRequest`,
      `ListToolsRequest`, `CallToolRequest`, `CompleteRequest`.
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:ClientRequest
    class_uri: mcp:McpClientRequest
    extra_slots:
      allowed: true
    any_of:
    - is_a: McpDiscoverRequest
    - is_a: McpListResourcesRequest
    - is_a: McpListResourceTemplatesRequest
    - is_a: McpReadResourceRequest
    - is_a: McpSubscriptionsListenRequest
    - is_a: McpListPromptsRequest
    - is_a: McpGetPromptRequest
    - is_a: McpListToolsRequest
    - is_a: McpCallToolRequest
    - is_a: McpCompleteRequest
  McpClientResult:
    name: McpClientResult
    definition_uri: https://w3id.org/lmodel/mcp/McpClientResult
    description: Common result fields.
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:ClientResult
    is_a: McpEmptyResult
    slots:
    - mcpResult__meta
    - mcpResult__result_type
    class_uri: mcp:McpClientResult
    extra_slots:
      allowed: true
  McpCompleteRequest:
    name: McpCompleteRequest
    definition_uri: https://w3id.org/lmodel/mcp/McpCompleteRequest
    description: A request from the client to the server, to ask for completion options.
    in_subset:
    - completion_complete
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:CompleteRequest
    is_a: McpJSONRPCRequest
    slots:
    - mcpCompleteRequest__identifier
    - mcpCompleteRequest__jsonrpc
    - mcpCompleteRequest__method
    - mcpCompleteRequest__params
    attributes:
      identifier:
        name: identifier
        description: A uniquely identifying ID for a request in JSON-RPC.
        aliases:
