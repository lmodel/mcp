  McpListResourceTemplatesResult:
    name: McpListResourceTemplatesResult
    definition_uri: https://w3id.org/lmodel/mcp/McpListResourceTemplatesResult
    description: The result returned by the server for a {@link ListResourceTemplatesRequestresources/templates/list}
      request.
    in_subset:
    - resources_templates_list
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:ListResourceTemplatesResult
    is_a: McpPaginatedResult
    mixins:
    - McpCacheableResult
    slots:
    - mcpListResourceTemplatesResult__meta
    - mcpListResourceTemplatesResult__cache_scope
    - mcpListResourceTemplatesResult__next_cursor
