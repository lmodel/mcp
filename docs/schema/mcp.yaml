    name: McpMissingRequiredClientCapabilityErrorError
    definition_uri: https://w3id.org/lmodel/mcp/McpMissingRequiredClientCapabilityErrorError
    description: MCP's `Error`, with the code and data this error carries.
    in_subset:
    - errors
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:MissingRequiredClientCapabilityError/properties/error/allOf/1
    is_a: McpError
    slots:
    - mcpError__message
    - mcpMissingRequiredClientCapabilityErrorError__code
    - mcpMissingRequiredClientCapabilityErrorError__data
    attributes:
      code:
        name: code
        description: The error code, always `-32021`.
        range: integer
        required: true
        equals_number: -32021
      data:
        name: data
        description: Details of the error.
        range: McpMissingRequiredClientCapabilityErrorErrorData
        required: true
    class_uri: mcp:McpMissingRequiredClientCapabilityErrorError
    extra_slots:
      allowed: true
  McpMissingRequiredClientCapabilityErrorErrorData:
    name: McpMissingRequiredClientCapabilityErrorErrorData
    definition_uri: https://w3id.org/lmodel/mcp/McpMissingRequiredClientCapabilityErrorErrorData
    description: The object MCP's `MissingRequiredClientCapabilityError` holds under
      `data`.
    in_subset:
    - errors
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:MissingRequiredClientCapabilityError/properties/error/allOf/1/properties/data
    slots:
    - mcpMissingRequiredClientCapabilityErrorErrorData__required_capabilities
    attributes:
      required_capabilities:
        name: required_capabilities
        description: The capabilities the server requires from the client to process
          this request.
        alias: requiredCapabilities
        range: McpClientCapabilities
        required: true
    class_uri: mcp:McpMissingRequiredClientCapabilityErrorErrorData
    extra_slots:
      allowed: true
  McpModelHint:
    name: McpModelHint
    definition_uri: https://w3id.org/lmodel/mcp/McpModelHint
    description: 'Hints to use for model selection.


      Keys not declared here are currently left unspecified by the spec and are up

      to the client to interpret.'
    in_subset:
    - sampling_createmessage
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:ModelHint
    slots:
    - McpModelHint_name
    slot_usage:
      name:
        name: name
        description: "A hint for a model name.\n\nThe client SHOULD treat this as\
          \ a substring of a model name; for example:\n - `claude-3-5-sonnet` should\
          \ match `claude-3-5-sonnet-20241022`\n - `sonnet` should match `claude-3-5-sonnet-20241022`,\
          \ `claude-3-sonnet-20240229`, etc.\n - `claude` should match any Claude\
          \ model\n\nThe client MAY also map the string to a different provider's\
          \ model name or a different model family, as long as it fills a similar\
          \ niche; for example:\n - `gemini-1.5-flash` could match `claude-3-haiku-20240307`"
    class_uri: mcp:McpModelHint
    extra_slots:
      allowed: true
  McpModelPreferences:
    name: McpModelPreferences
    definition_uri: https://w3id.org/lmodel/mcp/McpModelPreferences
    description: "The server's preferences for model selection, requested of the client\
      \ during sampling.\n\nBecause LLMs can vary along multiple dimensions, choosing\
      \ the \"best\" model is\nrarely straightforward.  Different models excel in\
      \ different areas\u2014some are\nfaster but less capable, others are more capable\
      \ but more expensive, and so\non. This interface allows servers to express their\
      \ priorities across multiple\ndimensions to help clients make an appropriate\
      \ selection for their use case.\n\nThese preferences are always advisory. The\
      \ client MAY ignore them. It is also\nup to the client to decide how to interpret\
      \ these preferences and how to\nbalance them against other considerations."
    in_subset:
    - sampling_createmessage
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:ModelPreferences
    slots:
    - mcpModelPreferences__cost_priority
    - mcpModelPreferences__hints
    - mcpModelPreferences__intelligence_priority
    - mcpModelPreferences__speed_priority
    attributes:
      cost_priority:
        name: cost_priority
        description: 'How much to prioritize cost when selecting a model. A value
          of 0 means cost

          is not important, while a value of 1 means cost is the most important

          factor.'
        alias: costPriority
        range: float
        minimum_value: 0
        maximum_value: 1
      hints:
        name: hints
        description: 'Optional hints to use for model selection.


          If multiple hints are specified, the client MUST evaluate them in order

          (such that the first match is taken).


          The client SHOULD prioritize these hints over the numeric priorities, but

          MAY still use the priorities to select from ambiguous matches.'
        range: McpModelHint
        multivalued: true
        inlined_as_list: true
      intelligence_priority:
        name: intelligence_priority
        description: 'How much to prioritize intelligence and capabilities when selecting
          a

          model. A value of 0 means intelligence is not important, while a value of
          1

          means intelligence is the most important factor.'
        alias: intelligencePriority
        range: float
        minimum_value: 0
        maximum_value: 1
      speed_priority:
        name: speed_priority
        description: 'How much to prioritize sampling speed (latency) when selecting
          a model. A

          value of 0 means speed is not important, while a value of 1 means speed
          is

          the most important factor.'
        alias: speedPriority
        range: float
        minimum_value: 0
        maximum_value: 1
    class_uri: mcp:McpModelPreferences
    extra_slots:
      allowed: true
  McpMultiSelectEnumSchema:
    name: McpMultiSelectEnumSchema
    definition_uri: https://w3id.org/lmodel/mcp/McpMultiSelectEnumSchema
    description: One of `UntitledMultiSelectEnumSchema`, `TitledMultiSelectEnumSchema`.
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:MultiSelectEnumSchema
    class_uri: mcp:McpMultiSelectEnumSchema
    extra_slots:
      allowed: true
    any_of:
    - is_a: McpUntitledMultiSelectEnumSchema
    - is_a: McpTitledMultiSelectEnumSchema
  McpNotification:
    name: McpNotification
    definition_uri: https://w3id.org/lmodel/mcp/McpNotification
    description: MCP's `Notification`.
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:Notification
    slots:
    - mcpNotification__method
    - mcpNotification__params
    attributes:
      method:
        name: method
        description: The name of the method.
        required: true
      params:
        name: params
        description: The parameters the message carries.
        range: McpJSONObject
    class_uri: mcp:McpNotification
    extra_slots:
      allowed: true
  McpNotificationMetaObject:
    name: McpNotificationMetaObject
    definition_uri: https://w3id.org/lmodel/mcp/McpNotificationMetaObject
    description: Extends {@link MetaObject} with additional notification-specific
      fields. All key naming rules from `MetaObject` apply.
    in_subset:
    - common_types
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:NotificationMetaObject
    is_a: McpMetaObject
    slots:
    - mcpNotificationMetaObject__mcp_subscription_id
    attributes:
      mcp_subscription_id:
        name: mcp_subscription_id
        description: 'Identifies the subscription stream a notification was delivered
          on. The

          server MUST include this key on every notification delivered via a

          {@link SubscriptionsListenRequestsubscriptions/listen} stream, so the

          client can correlate the notification with the originating subscription.

          The key is absent on notifications not delivered via a subscription

          stream (e.g. progress notifications for an in-flight request), which is

          why it is optional here.


          The value is the JSON-RPC ID of the `subscriptions/listen` request that

          opened the stream.'
        aliases:
        - io.modelcontextprotocol/subscriptionId
        any_of:
        - range: string
        - range: integer
    class_uri: mcp:McpNotificationMetaObject
    extra_slots:
      allowed: true
  McpNotificationParams:
    name: McpNotificationParams
    definition_uri: https://w3id.org/lmodel/mcp/McpNotificationParams
    description: Common params for any notification.
    in_subset:
    - common_types
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:NotificationParams
    slots:
    - mcpNotificationParams__meta
    attributes:
      meta:
        name: meta
        description: Extends {@link MetaObject} with additional notification-specific
          fields. All key naming rules from `MetaObject` apply.
        alias: _meta
        range: McpNotificationMetaObject
    class_uri: mcp:McpNotificationParams
    extra_slots:
      allowed: true
  McpNumberSchema:
    name: McpNumberSchema
    definition_uri: https://w3id.org/lmodel/mcp/McpNumberSchema
    description: MCP's `NumberSchema`.
    in_subset:
    - elicitation_create
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:NumberSchema
    slots:
    - McpNumberSchema_description
    - McpNumberSchema_title
    - mcpNumberSchema__default
    - mcpNumberSchema__maximum
    - mcpNumberSchema__minimum
    - mcpNumberSchema__kind
    slot_usage:
      description:
        name: description
        description: A description of the field for the user.
      title:
        name: title
        description: A title for the field.
    attributes:
      default:
        name: default
        description: The value the field takes when the user gives none.
        range: float
      maximum:
        name: maximum
        description: The largest value the field accepts.
        range: float
      minimum:
        name: minimum
        description: The smallest value the field accepts.
        range: float
      kind:
        name: kind
        description: The kind of value the field takes.
        aliases:
        - type
        range: McpNumberSchemaType
        required: true
    class_uri: mcp:McpNumberSchema
    extra_slots:
      allowed: true
  McpPaginatedRequest:
    name: McpPaginatedRequest
    definition_uri: https://w3id.org/lmodel/mcp/McpPaginatedRequest
    description: MCP's `PaginatedRequest`.
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:PaginatedRequest
    is_a: McpJSONRPCRequest
    slots:
    - mcpPaginatedRequest__identifier
    - mcpPaginatedRequest__jsonrpc
    - mcpPaginatedRequest__method
    - mcpPaginatedRequest__params
    attributes:
      identifier:
        name: identifier
        description: A uniquely identifying ID for a request in JSON-RPC.
        aliases:
        - id
        required: true
        any_of:
        - range: string
        - range: integer
      jsonrpc:
        name: jsonrpc
        description: The JSON-RPC version, always `2.0`.
        required: true
        equals_string: '2.0'
      method:
        name: method
        description: The name of the method.
        required: true
      params:
        name: params
        description: Common params for paginated requests.
        range: McpPaginatedRequestParams
        required: true
    class_uri: mcp:McpPaginatedRequest
    extra_slots:
      allowed: true
  McpPaginatedRequestParams:
    name: McpPaginatedRequestParams
    definition_uri: https://w3id.org/lmodel/mcp/McpPaginatedRequestParams
    description: Common params for paginated requests.
    in_subset:
    - common_types
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:PaginatedRequestParams
    is_a: McpRequestParams
    slots:
    - mcpPaginatedRequestParams__meta
    - mcpPaginatedRequestParams__cursor
    attributes:
      meta:
        name: meta
        description: Extends {@link MetaObject} with additional request-specific fields.
          All key naming rules from `MetaObject` apply.
        alias: _meta
        range: McpRequestMetaObject
        required: true
      cursor:
        name: cursor
        description: 'An opaque token representing the current pagination position.

          If provided, the server should return results starting after this cursor.'
    class_uri: mcp:McpPaginatedRequestParams
    extra_slots:
      allowed: true
  McpPaginatedResult:
    name: McpPaginatedResult
    definition_uri: https://w3id.org/lmodel/mcp/McpPaginatedResult
    description: MCP's `PaginatedResult`.
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:PaginatedResult
    is_a: McpResult
    slots:
    - mcpPaginatedResult__meta
    - mcpPaginatedResult__next_cursor
    - mcpPaginatedResult__result_type
    attributes:
      meta:
        name: meta
        description: Extends {@link MetaObject} with additional result-specific fields.
          All key naming rules from `MetaObject` apply.
        alias: _meta
        range: McpResultMetaObject
      next_cursor:
        name: next_cursor
        description: 'An opaque token representing the pagination position after the
          last returned result.

          If present, there may be more results available.'
        alias: nextCursor
      result_type:
        name: result_type
        description: 'Indicates the type of the result, which allows the client to
          determine

          how to parse the result object.


          Servers implementing this protocol version MUST include this field.

          For backward compatibility, when a client receives a result from a

          server implementing an earlier protocol version (which does not include

          `resultType`), the client MUST treat the absent field as `"complete"`.'
        alias: resultType
        required: true
    class_uri: mcp:McpPaginatedResult
    extra_slots:
      allowed: true
  McpParseError:
    name: McpParseError
    definition_uri: https://w3id.org/lmodel/mcp/McpParseError
    description: A JSON-RPC error indicating that invalid JSON was received by the
      server. This error is returned when the server cannot parse the JSON text of
      a message.
    in_subset:
    - errors
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:ParseError
    is_a: McpError
    slots:
    - mcpParseError__code
    - mcpParseError__data
    - mcpParseError__message
    attributes:
      code:
        name: code
        description: The error type that occurred.
        range: integer
        required: true
        equals_number: -32700
      data:
        name: data
        description: Additional information about the error. The value of this member
          is defined by the sender (e.g. detailed error information, nested errors
          etc.).
        range: McpJSONValue
      message:
        name: message
        description: A short description of the error. The message SHOULD be limited
          to a concise single sentence.
        required: true
    class_uri: mcp:McpParseError
    extra_slots:
      allowed: true
  McpPrimitiveSchemaDefinition:
    name: McpPrimitiveSchemaDefinition
    definition_uri: https://w3id.org/lmodel/mcp/McpPrimitiveSchemaDefinition
    description: 'Restricted schema definitions that only allow primitive types

      without nested objects or arrays.'
    in_subset:
    - elicitation_create
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:PrimitiveSchemaDefinition
    class_uri: mcp:McpPrimitiveSchemaDefinition
    extra_slots:
      allowed: true
    any_of:
    - is_a: McpStringSchema
    - is_a: McpNumberSchema
    - is_a: McpBooleanSchema
    - is_a: McpUntitledSingleSelectEnumSchema
    - is_a: McpTitledSingleSelectEnumSchema
    - is_a: McpUntitledMultiSelectEnumSchema
    - is_a: McpTitledMultiSelectEnumSchema
    - is_a: McpLegacyTitledEnumSchema
  McpProgressNotification:
    name: McpProgressNotification
    definition_uri: https://w3id.org/lmodel/mcp/McpProgressNotification
    description: An out-of-band notification used to inform the receiver of a progress
      update for a long-running request.
    in_subset:
    - notifications_progress
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:ProgressNotification
    is_a: McpJSONRPCNotification
    slots:
    - mcpProgressNotification__jsonrpc
    - mcpProgressNotification__method
    - mcpProgressNotification__params
    attributes:
      jsonrpc:
        name: jsonrpc
        description: The JSON-RPC version, always `2.0`.
        required: true
        equals_string: '2.0'
      method:
        name: method
        description: The method's name, always `notifications/progress`.
        required: true
        equals_string: notifications/progress
      params:
        name: params
        description: Parameters for a {@link ProgressNotificationnotifications/progress}
          notification.
        range: McpProgressNotificationParams
        required: true
    class_uri: mcp:McpProgressNotification
    extra_slots:
      allowed: true
  McpProgressNotificationParams:
    name: McpProgressNotificationParams
    definition_uri: https://w3id.org/lmodel/mcp/McpProgressNotificationParams
    description: Parameters for a {@link ProgressNotificationnotifications/progress}
      notification.
    in_subset:
    - notifications_progress
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:ProgressNotificationParams
    is_a: McpNotificationParams
    slots:
    - mcpProgressNotificationParams__meta
    - mcpProgressNotificationParams__message
    - mcpProgressNotificationParams__progress
    - mcpProgressNotificationParams__progress_token
    - mcpProgressNotificationParams__total
    attributes:
      meta:
        name: meta
        description: Extends {@link MetaObject} with additional notification-specific
          fields. All key naming rules from `MetaObject` apply.
        alias: _meta
        range: McpNotificationMetaObject
      message:
        name: message
        description: An optional message describing the current progress.
      progress:
        name: progress
        description: The progress thus far. This should increase every time progress
          is made, even if the total is unknown.
        range: float
        required: true
      progress_token:
        name: progress_token
        description: The progress token which was given in the initial request, used
          to associate this notification with the request that is proceeding.
        alias: progressToken
        required: true
        any_of:
        - range: string
        - range: integer
      total:
        name: total
        description: Total number of items to process (or total progress required),
          if known.
        range: float
    class_uri: mcp:McpProgressNotificationParams
    extra_slots:
      allowed: true
  McpPrompt:
    name: McpPrompt
    definition_uri: https://w3id.org/lmodel/mcp/McpPrompt
    description: A prompt or prompt template that the server offers.
    in_subset:
    - prompts_list
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:Prompt
    is_a: McpBaseMetadata
    mixins:
    - McpIcons
    slots:
    - McpPrompt_description
    - McpPrompt_name
    - McpPrompt_title
    - mcpPrompt__meta
    - mcpPrompt__arguments
    - mcpPrompt__icons
    slot_usage:
      description:
        name: description
        description: An optional description of what this prompt provides
      name:
        name: name
        description: Intended for programmatic or logical use, but used as a display
          name in past specs or fallback (if title isn't present).
        required: true
      title:
        name: title
        description: "Intended for UI and end-user contexts \u2014 optimized to be\
          \ human-readable and easily understood,\neven by those unfamiliar with domain-specific\
          \ terminology.\n\nIf not provided, the name should be used for display (except\
          \ for {@link Tool},\nwhere `annotations.title` should be given precedence\
          \ over using `name`,\nif present)."
    attributes:
      meta:
        name: meta
        description: "Represents the contents of a `_meta` field, which clients and\
          \ servers use to attach additional metadata to their interactions.\n\nCertain\
          \ key names are reserved by MCP for protocol-level metadata; implementations\
          \ MUST NOT make assumptions about values at these keys. Additionally, specific\
          \ schema definitions may reserve particular names for purpose-specific metadata,\
          \ as declared in those definitions.\n\nValid keys have two segments:\n\n\
          **Prefix:**\n- Optional \u2014 if specified, MUST be a series of _labels_\
          \ separated by dots (`.`), followed by a slash (`/`).\n- Labels MUST start\
          \ with a letter and end with a letter or digit. Interior characters may\
          \ be letters, digits, or hyphens (`-`).\n- Implementations SHOULD use reverse\
          \ DNS notation (e.g., `com.example/` rather than `example.com/`).\n- Any\
          \ prefix where the second label is `modelcontextprotocol` or `mcp` is **reserved**\
          \ for MCP use. For example: `io.modelcontextprotocol/`, `dev.mcp/`, `org.modelcontextprotocol.api/`,\
          \ and `com.mcp.tools/` are all reserved. However, `com.example.mcp/` is\
          \ NOT reserved, as the second label is `example`.\n\n**Name:**\n- Unless\
          \ empty, MUST start and end with an alphanumeric character (`[a-z0-9A-Z]`).\n\
          - Interior characters may be alphanumeric, hyphens (`-`), underscores (`_`),\
          \ or dots (`.`)."
        alias: _meta
        range: McpMetaObject
      arguments:
        name: arguments
        description: A list of arguments to use for templating the prompt.
        range: McpPromptArgument
        multivalued: true
        inlined_as_list: true
      icons:
        name: icons
        description: 'Optional set of sized icons that the client can display in a
          user interface.


          Clients that support rendering icons MUST support at least the following
          MIME types:

          - `image/png` - PNG images (safe, universal compatibility)

          - `image/jpeg` (and `image/jpg`) - JPEG images (safe, universal compatibility)


          Clients that support rendering icons SHOULD also support:

          - `image/svg+xml` - SVG images (scalable but requires security precautions)

          - `image/webp` - WebP images (modern, efficient format)'
        range: McpIcon
        multivalued: true
        inlined_as_list: true
    class_uri: mcp:McpPrompt
    extra_slots:
      allowed: true
  McpPromptArgument:
    name: McpPromptArgument
    definition_uri: https://w3id.org/lmodel/mcp/McpPromptArgument
    description: Describes an argument that a prompt can accept.
    in_subset:
    - prompts_list
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:PromptArgument
    is_a: McpBaseMetadata
    slots:
    - McpPromptArgument_description
    - McpPromptArgument_name
    - McpPromptArgument_title
    - mcpPromptArgument__required
    slot_usage:
      description:
        name: description
        description: A human-readable description of the argument.
      name:
        name: name
        description: Intended for programmatic or logical use, but used as a display
          name in past specs or fallback (if title isn't present).
        required: true
      title:
        name: title
        description: "Intended for UI and end-user contexts \u2014 optimized to be\
          \ human-readable and easily understood,\neven by those unfamiliar with domain-specific\
          \ terminology.\n\nIf not provided, the name should be used for display (except\
          \ for {@link Tool},\nwhere `annotations.title` should be given precedence\
          \ over using `name`,\nif present)."
    attributes:
      required:
        name: required
        description: Whether this argument must be provided.
        slot_uri: schema:valueRequired
        range: boolean
    class_uri: mcp:McpPromptArgument
    extra_slots:
      allowed: true
  McpPromptListChangedNotification:
    name: McpPromptListChangedNotification
    definition_uri: https://w3id.org/lmodel/mcp/McpPromptListChangedNotification
    description: An optional notification from the server to the client, informing
      it that the list of prompts it offers has changed. This is only delivered on
      a {@link SubscriptionsListenRequestsubscriptions/listen} stream when the client
      requested it via the `promptsListChanged` filter field.
    in_subset:
    - notifications_prompts_list_changed
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:PromptListChangedNotification
    is_a: McpJSONRPCNotification
    slots:
    - mcpPromptListChangedNotification__jsonrpc
    - mcpPromptListChangedNotification__method
    - mcpPromptListChangedNotification__params
    attributes:
      jsonrpc:
        name: jsonrpc
        description: The JSON-RPC version, always `2.0`.
        required: true
        equals_string: '2.0'
      method:
        name: method
        description: The method's name, always `notifications/prompts/list_changed`.
        required: true
        equals_string: notifications/prompts/list_changed
      params:
        name: params
        description: Common params for any notification.
        range: McpNotificationParams
    class_uri: mcp:McpPromptListChangedNotification
    extra_slots:
      allowed: true
  McpPromptMessage:
    name: McpPromptMessage
    definition_uri: https://w3id.org/lmodel/mcp/McpPromptMessage
    description: 'Describes a message returned as part of a prompt.


      This is similar to {@link SamplingMessage}, but also supports the embedding
      of

      resources from the MCP server.'
    in_subset:
    - prompts_get
    from_schema: https://w3id.org/lmodel/mcp
    exact_mappings:
    - mcp_schema:PromptMessage
    slots:
    - mcpPromptMessage__content
    - mcpPromptMessage__role
    attributes:
      content:
        name: content
        description: The content the message carries.
        range: McpContentBlock
        required: true
      role:
        name: role
        description: The sender or recipient of messages and data in a conversation.
        range: McpRole
        required: true
    class_uri: mcp:McpPromptMessage
    extra_slots:
      allowed: true
  McpPromptReference:
    name: McpPromptReference
    definition_uri: https://w3id.org/lmodel/mcp/McpPromptReference
    description: Identifies a prompt.
    in_subset:
    - completion_complete
    from_schema: https://w3id.org/lmodel/mcp
