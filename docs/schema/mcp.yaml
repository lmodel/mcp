        required: true
        equals_string: '2.0'
      method:
        name: method
        description: The name of the method.
        required: true
      params:
        name: params
        description: The parameters the message carries.
        range: McpJSONObject
    class_uri: mcp:McpJSONRPCNotification
    extra_slots:
      allowed: true
  McpJSONRPCRequest:
    name: McpJSONRPCRequest
    definition_uri: https://w3id.org/lmodel/mcp/McpJSONRPCRequest
    description: A request that expects a response.
    in_subset:
