    "McpModelPreferences": {
      "name": "McpModelPreferences",
      "description": "The server's preferences for model selection, requested of the client during sampling.\n\nBecause LLMs can vary along multiple dimensions, choosing the \"best\" model is\nrarely straightforward.  Different models excel in different areas—some are\nfaster but less capable, others are more capable but more expensive, and so\non. This interface allows servers to express their priorities across multiple\ndimensions to help clients make an appropriate selection for their use case.\n\nThese preferences are always advisory. The client MAY ignore them. It is also\nup to the client to decide how to interpret these preferences and how to\nbalance them against other considerations.",
      "deprecated": "Deprecated as of protocol version 2026-07-28 (SEP-2577). Remains in the specification for at least twelve months; see the deprecated features registry.",
      "in_subset": [
        "sampling_createmessage"
      ],
      "from_schema": "https://w3id.org/lmodel/mcp",
      "exact_mappings": [
        "mcp_schema:ModelPreferences"
      ],
      "attributes": {
        "cost_priority": {
          "name": "cost_priority",
          "description": "How much to prioritize cost when selecting a model. A value of 0 means cost\nis not important, while a value of 1 means cost is the most important\nfactor.",
          "from_schema": "https://w3id.org/lmodel/mcp",
          "alias": "costPriority",
          "owner": "McpModelPreferences",
          "domain_of": [
            "McpModelPreferences"
          ],
          "range": "float",
          "minimum_value": 0,
          "maximum_value": 1
        },
        "hints": {
          "name": "hints",
          "description": "Optional hints to use for model selection.\n\nIf multiple hints are specified, the client MUST evaluate them in order\n(such that the first match is taken).\n\nThe client SHOULD prioritize these hints over the numeric priorities, but\nMAY still use the priorities to select from ambiguous matches.",
          "from_schema": "https://w3id.org/lmodel/mcp",
          "owner": "McpModelPreferences",
          "domain_of": [
            "McpModelPreferences"
          ],
          "range": "McpModelHint",
          "multivalued": true,
          "inlined": true,
          "inlined_as_list": true
        },
        "intelligence_priority": {
          "name": "intelligence_priority",
          "description": "How much to prioritize intelligence and capabilities when selecting a\nmodel. A value of 0 means intelligence is not important, while a value of 1\nmeans intelligence is the most important factor.",
          "from_schema": "https://w3id.org/lmodel/mcp",
          "alias": "intelligencePriority",
          "owner": "McpModelPreferences",
          "domain_of": [
            "McpModelPreferences"
          ],
          "range": "float",
          "minimum_value": 0,
          "maximum_value": 1
        },
        "speed_priority": {
          "name": "speed_priority",
          "description": "How much to prioritize sampling speed (latency) when selecting a model. A\nvalue of 0 means speed is not important, while a value of 1 means speed is\nthe most important factor.",
          "from_schema": "https://w3id.org/lmodel/mcp",
          "alias": "speedPriority",
          "owner": "McpModelPreferences",
          "domain_of": [
            "McpModelPreferences"
          ],
          "range": "float",
          "minimum_value": 0,
          "maximum_value": 1
        }
      },
      "extra_slots": {
        "allowed": true
      }
    },
