[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
# Named like lmodel/slsa's slsa-linkml, so the PyPI name says what it holds and
# stays clear of the MCP SDK's "mcp". PyPI publishing is off.
name = "mcp-linkml"
description = "Model Context Protocol (MCP) 2026-07-28 (LinkML)"
authors = [
  {name = "Noel McLoughlin", email = "noel.mcloughlin@gmail.com"},
]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]

dependencies = [
  "linkml-runtime >=1.12.1",
]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "linkml>=1.12.1",
    "mkdocs-material>=8.2.8",
    "mkdocs-mermaid2-plugin>=1.1.1",
    "mkdocs-pymdownx-material-extras>=2.5.6",
    "jupyter>=1.0.0",
    "mknotebooks>= 0.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mcp"]

# See https://hatch.pypa.io/latest/config/build/#file-selection for how to
# explicitly include files other than default into the build distributions.

[tool.hatch.version]
source = "uv-dynamic-versioning"

# Ref.: https://github.com/ninoseki/uv-dynamic-versioning/
[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
fallback-version = "0.0.0"

# Ref.: https://docs.pytest.org/en/stable/reference/reference.html#configuration-options
[tool.pytest.ini_options]
testpaths = ["tests"]

# https://docs.astral.sh/ruff/configuration/
[tool.ruff]
exclude = [
    "src/mcp/_version.py",
]
# Set oldest supported Python version
target-version = "py310"

# Ref.: https://github.com/codespell-project/codespell
[tool.codespell]
skip = [
  "LICENSE",
  "NOTICE",
  "pyproject.toml",
  "uv.lock",
  "project/*",
  "src/mcp/datamodel/mcp_pydantic.py",
  "src/mcp/datamodel/mcp.py",
  # The upstream's files, copied as published; what the converter and the writer
  # give from them; the neighbours' adapt copies, copied as released; and files
  # copied in by the KTL sidecar sync or written by npm, not by hand.
  "upstream/*",
  "meta/*",
  "src/mcp/schema/mcp.yaml",
  "tests/neighbours/*",
  ".lokf/scripts/*",
  "website/package-lock.json",
]

# Reminder: words have to be lowercased for the ignore-words-list
ignore-words-list = "linke"
quiet-level = 3

# Ref.: https://github.com/crate-ci/typos (spell checker)
[tool.typos.default.extend-words]
linke = "linke"

[tool.typos.files]
extend-exclude = [
  "LICENSE",
  "NOTICE",
  "uv.lock",
  "pyproject.toml",
  "project/*",
  "src/mcp/datamodel/mcp_pydantic.py",
  "src/mcp/datamodel/mcp.py",
  "upstream/*",
  "meta/*",
  "src/mcp/schema/mcp.yaml",
  "tests/neighbours/*",
  ".lokf/scripts/*",
  "website/package-lock.json",
]
