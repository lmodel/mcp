# A tool a server lists in its tools/list result.
name: get_forecast
title: Weather forecast
description: Returns the forecast for a city over the next few days.
inputSchema:
  type: object
  properties:
    city:
      type: string
    days:
      type: integer
      minimum: 1
      maximum: 7
  required:
    - city
outputSchema:
  type: object
  properties:
    summary:
      type: string
annotations:
  readOnlyHint: true
  openWorldHint: true
icons:
  - src: https://example.com/icons/forecast.png
    mimeType: image/png
    sizes:
      - 48x48
